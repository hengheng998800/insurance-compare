<title>保险对比</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="保险对比">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="insurance-manifest.webmanifest">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;max-width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f6f8;color:#333;-webkit-tap-highlight-color:transparent;margin:0;padding:0;overflow:hidden;overscroll-behavior-x:contain;height:100vh;height:100dvh}
.app{display:flex;flex-direction:column;max-width:430px;margin:0 auto;background:#f5f6f8;height:100vh;height:100dvh;overflow:hidden;position:relative}

/* ===== 顶栏 ===== */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid #eee;flex-shrink:0;z-index:100}
.header .title{font-size:17px;font-weight:600;letter-spacing:.3px}
.header .icons{display:flex;gap:14px;align-items:center}
.header .icons .icon-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#666}
.header .icons .icon-btn svg{width:20px;height:20px}

/* ===== 主内容 ===== */
.pages{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:70px}
.page{display:none}
.page.active{display:block}

/* ===== 底部导航 ===== */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #eee;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0}
.nav-item svg{width:22px;height:22px;color:#b0b6bf;transition:color .2s}
.nav-item span{font-size:11px;color:#b0b6bf;transition:color .2s}
.nav-item.active svg,.nav-item.active span{color:#2f6fed}

/* ===== 筛选栏（v3.3 精致化）===== */
.filter-bar{display:flex;gap:7px;padding:12px 12px 4px;overflow-x:auto;background:transparent;border-bottom:none;scrollbar-width:none;flex-shrink:0}
.filter-bar::-webkit-scrollbar{display:none}
.chip{padding:6px 15px;border-radius:11px;font-size:13px;white-space:nowrap;cursor:pointer;background:#fff;color:#4a5568;transition:.18s;border:1px solid #dfe5ee;box-shadow:0 1px 2.5px rgba(30,40,60,.05);font-weight:500}
.chip.active{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:transparent;box-shadow:0 2px 7px rgba(37,99,235,.32);font-weight:600}
.chip .cnt{opacity:.65;font-size:11px;margin-left:3px}
/* 下拉式筛选 pill（v2.6） */
.fsel-wrap{position:relative;display:inline-flex;align-items:center}
.fsel{appearance:none;-webkit-appearance:none;border:1px solid #dfe5ee;background:#fff;border-radius:11px;padding:8px 28px 8px 13px;font-size:13px;color:#3d4a5c;outline:none;max-width:170px;font-family:inherit;box-shadow:0 1px 2.5px rgba(30,40,60,.05);font-weight:500}
.fsel.active{border-color:#2f6fed;color:#2f6fed;background:#eef4ff;font-weight:600}
.fsel-wrap::after{content:'▾';position:absolute;right:12px;font-size:11px;color:#9aa1ab;pointer-events:none}
/* 产品库筛选面板（v2.6） */
.list-filter{display:block;margin:9px 12px;padding:11px 12px 12px;background:#fff;border:1px solid #dfe5ee;border-radius:14px;box-shadow:0 1.5px 6px rgba(30,40,60,.07);flex-shrink:0}
.lf-row{display:flex;gap:8px;align-items:center}
.lf-row + .lf-row{margin-top:9px}
.list-filter .fsel{max-width:150px;flex:1}
.list-search{flex:1;min-width:0;width:100%;border:1px solid transparent;border-radius:11px;padding:9px 14px;font-size:13px;background:#f2f4f8;outline:none;font-family:inherit;box-sizing:border-box;transition:.18s}
.list-search:focus{background:#fff;border-color:#2f6fed;box-shadow:0 0 0 3px rgba(47,111,237,.12)}
.list-search:focus{border-color:#2f6fed;background:#fff}
/* 勾选产品折叠（v2.6） */
.sel-pills{transition:max-height .25s ease}
.sel-pills.collapsed{max-height:92px;overflow:hidden}
.sel-more{font-size:12px;color:#2f6fed;cursor:pointer;padding:7px 2px 0;text-align:center;font-weight:600}

/* ===== 首页公司分组视图（v2.9） ===== */
.co-card{background:#fff;border:1px solid #c2ccd9;border-radius:12px;margin-bottom:12px;box-shadow:0 1.5px 5px rgba(30,40,60,.08);overflow:hidden}
.co-head{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
.co-logo{width:34px;height:34px;border-radius:8px;object-fit:contain;background:#f4f6f9;border:1px solid #e5e9ef;flex-shrink:0}
.co-logo-fb{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:inset 0 -6px 12px rgba(0,0,0,.18), 0 1px 3px rgba(30,40,60,.2);letter-spacing:0;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.co-name{font-size:14.5px;font-weight:700;color:#1f2329;flex:1;min-width:0;word-break:break-all}
.co-name .co-cnt{font-size:11.5px;font-weight:600;color:#8a919b;margin-left:5px}
.co-kind{font-size:11px;color:#8a919b;margin-top:2px}
.co-arrow{color:#b0b6bf;font-size:12px;transition:transform .2s;flex-shrink:0}
.co-card.folded .co-arrow{transform:rotate(-90deg)}
.co-body{display:block}
.line-div{display:flex;align-items:center;gap:10px;padding:9px 14px 3px}
.line-div::before,.line-div::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#c9d4e4)}
.line-div::after{background:linear-gradient(90deg,#c9d4e4,transparent)}
.line-div-txt{font-size:11px;font-weight:700;color:#5b6b80;letter-spacing:1px;padding:2px 10px;border-radius:10px;background:#eef2f8;flex-shrink:0}
.co-card.folded .co-body{display:none}
.p-row{display:flex;align-items:center;gap:9px;padding:9px 13px;border-top:1px solid #edf0f4;cursor:pointer}
.p-row:active{background:#f5f8ff}
.p-row .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.p-row .pr-name{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:#2a2f36;word-break:break-all}
.p-row .pr-tier{font-size:10px;font-weight:600;color:#2f6fed;background:#e8f0fe;border-radius:4px;padding:1px 5px;flex-shrink:0}
.p-row .pr-badge{font-size:10.5px;color:#8a919b;background:#f4f6f9;border-radius:5px;padding:2px 6px;flex-shrink:0}
.p-row .pr-score{font-size:12px;font-weight:700;flex-shrink:0;width:30px;text-align:right}
.p-row .pr-score.hi{color:#137333}.p-row .pr-score.mid{color:#b25e00}.p-row .pr-score.lo{color:#c5221f}
.list-overview{display:flex;gap:6px;padding:10px 12px 2px;flex-wrap:wrap}
.ov-chip{font-size:11.5px;color:#5f6368;background:#fff;border:1px solid #d8dee7;border-radius:14px;padding:3.5px 10px}
.ov-chip{cursor:pointer;user-select:none;transition:all .15s}
.ov-chip.on{background:#1a56b0;color:#fff;border-color:#1a56b0;font-weight:700}

/* ===== 保险科普（按品种学习）—— 蓝白高端风 ===== */
.know-wrap{margin:2px 0 12px;border-radius:14px;background:#fff;border:1px solid #d3dbe6;box-shadow:0 2px 8px rgba(30,40,60,.08);overflow:hidden}
.know-head{display:flex;align-items:center;gap:8px;padding:12px 14px;background:linear-gradient(135deg,#eef4ff,#e2ebfb);cursor:pointer;user-select:none;border-bottom:1px solid #e3e9f2}
.know-head .kt{flex:1;min-width:0}
.know-head .kt b{font-size:15px;color:#1a4a9e;letter-spacing:1px}
.know-head .kt span{display:block;font-size:11px;color:#6d84ab;margin-top:1px}
.know-arrow{font-size:11px;color:#3b66b5;transition:transform .2s}
.know-wrap.folded .know-arrow{transform:rotate(-90deg)}
.know-body{display:none;padding:4px 12px 12px;background:#fbfcfe}
.know-wrap:not(.folded) .know-body{display:block}
.know-sec{margin-top:12px}
.know-sec-t{display:flex;align-items:center;gap:9px;padding:2px 2px 9px;border-bottom:1.5px solid #dfe6f0;margin-bottom:9px}
.know-pill{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border-radius:10px;color:#fff;font-size:14px;font-weight:800;letter-spacing:1px;box-shadow:0 2px 6px rgba(30,40,60,.22);text-shadow:0 1px 2px rgba(0,0,0,.18);flex-shrink:0}
.pill-yl{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.pill-cz{background:linear-gradient(135deg,#ef5350,#b71c1c)}
.pill-sx{background:linear-gradient(135deg,#9163dd,#5e35b1)}
.pill-yw{background:linear-gradient(135deg,#f59f00,#d9480f)}
.know-sec-t em{font-style:normal;font-size:11px;color:#6d84ab}
.know-sec-t b{font-size:14.5px;color:#173a73}
.know-sec-t em{font-style:normal;font-size:11px;color:#6d84ab}
.know-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.know-card{text-align:left;border:1px solid #dbe3ee;border-radius:10px;background:#fff;padding:9px 10px;cursor:pointer;box-shadow:0 1px 3px rgba(30,40,60,.06);transition:transform .12s, box-shadow .12s;font-family:inherit}
/* v3.9.24 全部产品折叠大卡片 */
.all-card{background:#fff;border:1px solid #c2ccd9;border-radius:12px;margin:10px 0 12px;box-shadow:0 1.5px 5px rgba(30,40,60,.08);overflow:hidden}
.all-card .know-head{border-bottom:none}
.all-card.open .know-head{border-bottom:1px solid #e3e9f2}
.all-body{display:none}
.all-card.open .all-body{display:block}
.all-card .co-card{margin:10px 12px 12px}
.all-arrow{color:#1a4a9e;font-size:13px;transition:transform .2s;flex-shrink:0}
.all-card.open .all-arrow{transform:rotate(90deg)}
.know-card:active{transform:scale(.97);box-shadow:0 2px 8px rgba(30,60,120,.15)}
.know-card.base{grid-column:1 / -1;background:linear-gradient(135deg,#f0f5ff,#e4edfc);border:1px solid #b9cdf0;box-shadow:0 1.5px 6px rgba(37,99,235,.10)}
.know-ribbon{display:inline-block;font-size:9.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,#3b82f6,#2563eb);border-radius:9px;padding:2px 9px;margin-bottom:5px;letter-spacing:.5px}
.know-card.civic{grid-column:1 / -1;background:linear-gradient(135deg,#f2fbf6,#e6f6ee);border:1px solid #b5e0c8;box-shadow:0 1.5px 6px rgba(16,140,80,.10)}
.civic-ribbon{color:#0c6b3d;background:linear-gradient(135deg,#5fbb8a,#2f9e63)}
.know-name{font-size:13px;font-weight:800;color:#1a3a6b;margin-bottom:5px}
.know-li{display:flex;gap:4px;font-size:10.5px;line-height:1.5;margin-top:2px;color:#5c6b84}
.know-li .ic{flex-shrink:0}
.know-card{color:#2a2f36}
.know-li.pro .ic{color:#1d8a3e !important;font-weight:700}
.know-li.con .ic{color:#c5221f !important;font-weight:700}
.know-hint{margin:12px 2px 0;font-size:10.5px;color:#93a0b4;text-align:center}
.learn-banner{display:flex;align-items:center;gap:8px;margin:2px 0 10px;background:#eef4ff;border:1px dashed #9db8e3;border-radius:10px;padding:8px 12px;font-size:12.5px;color:#1a4a9e}
.learn-banner b{flex:1}
.learn-banner button{border:none;background:#2f5cc0;color:#fff;border-radius:12px;padding:3px 12px;font-size:12px;font-family:inherit}

/* ===== 产品卡片 ===== */
#page-list{background:#f1f4f9}
.list{padding:10px 12px}
.pcard{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:12px;box-shadow:0 1.5px 5px rgba(30,40,60,.08);cursor:pointer;position:relative;transition:box-shadow .15s;border:1px solid #c2ccd9}
.pcard:active{box-shadow:0 1px 6px rgba(0,0,0,.12)}
.pcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pcard-name{font-size:15px;font-weight:600;line-height:1.35;flex:1;min-width:0;word-break:break-all}
.pcard-company{font-size:12px;color:#8a919b;margin-top:3px}
/* 卡片数据三格 */
.pcard-stats{display:flex;gap:7px;margin-top:10px}
.pcard-stats .stat{flex:1;background:#fafbfc;border:1px solid #f0f2f5;border-radius:8px;padding:6px 4px;text-align:center;line-height:1.2}
.pcard-stats .stat b{display:block;font-size:15px;font-weight:700;color:#5f6368}
.pcard-stats .stat span{font-size:9.5px;color:#9aa1ab;display:block;margin-top:2px}
.pcard-stats .stat.hi{background:#eef9f1;border-color:#d3efdc}
.pcard-stats .stat.hi b{color:#137333}
.pcard-stats .stat.mid{background:#fffbf0;border-color:#fdeecd}
.pcard-stats .stat.mid b{color:#c77700}
.pcard-stats .stat.lo b{color:#b06a63}
.pcard-stats .stat.rank b{color:#2f6fed}
/* 关键条款 */
.pcard-kv{display:flex;flex-direction:column;gap:3px;margin-top:9px;padding-top:9px;border-top:1px dashed #eef0f3}
.pcard-kv .kv{display:flex;font-size:11.5px;line-height:1.4}
.pcard-kv .kv-k{color:#a0a6ae;width:44px;flex-shrink:0}
.pcard-kv .kv-v{color:#3c4043;flex:1;min-width:0;word-break:break-word}
/* 优势亮点 */
.pcard-pros{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.pglass{font-size:10.5px;color:#1c7a3e;background:#eef9f1;border-radius:5px;padding:3px 7px;line-height:1.4;display:block}
.pcard-badge{font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;font-weight:500}
.badge-cz{background:#ffeaea;color:#d93025}
.badge-yl{background:#e8f0fe;color:#1a73e8}
.badge-yw{background:#fff3e0;color:#e8710a}
.badge-sx{background:#e6f4ea;color:#137333}
.badge-nj{background:#f3e8fd;color:#8430ce}
.badge-qt{background:#f0f1f4;color:#5f6368}
.pcard-meta{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;font-size:12px;color:#8a919b}
.pcard-meta span{display:flex;align-items:center;gap:3px}
.pcard-score{position:absolute;right:12px;bottom:11px;font-size:12px;color:#2f6fed;font-weight:600}
.pcard-tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.ptag{font-size:11px;padding:1px 6px;border-radius:4px;background:#f0f1f4;color:#6b7280}

/* ===== 空状态 ===== */
.empty{text-align:center;padding:60px 30px;color:#9aa1ab}
.empty svg{width:56px;height:56px;opacity:.35;margin-bottom:14px}
.empty p{font-size:14px;margin-bottom:6px}
.empty .hint{font-size:12px;color:#b0b6bf;line-height:1.6}

/* ===== 表单 ===== */
.form-wrap{padding:12px 12px 20px}
.fgroup{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden}
.fgroup-title{font-size:12px;font-weight:600;color:#8a919b;padding:11px 14px 7px;letter-spacing:.4px}
.frow{display:flex;align-items:flex-start;padding:10px 14px;border-top:1px solid #f2f3f5;gap:10px}
.frow:first-of-type{border-top:none}
.flabel{font-size:13px;color:#5f6368;width:92px;flex-shrink:0;padding-top:7px;line-height:1.35}
.fnote{font-size:10px;color:#b0b6bf;margin-top:2px;line-height:1.3;font-weight:400}
/* 多条描述 */
.multi-wrap{flex:1;min-width:0}
.multi-row{display:flex;align-items:flex-start;gap:4px}
.multi-row + .multi-row{margin-top:6px;padding-top:8px;border-top:1px dashed #dfe3ea}
.td-line + .td-line{margin-top:7px;padding-top:9px;border-top:1px dashed #dfe3ea}
.multi-input{flex:1;min-width:0;min-height:26px;line-height:1.5}
.multi-del{width:22px;height:26px;display:flex;align-items:center;justify-content:center;color:#c0c5cc;font-size:17px;cursor:pointer;flex-shrink:0;border-radius:5px;line-height:1}
.multi-del:active{background:#fef2f2;color:#d93025}
.multi-add{font-size:12px;color:#2f6fed;padding:7px 0 1px;cursor:pointer;display:inline-block;font-weight:500}
.multi-add:active{opacity:.6}
/* 详情/对比里的多条显示 */
.multi-view{display:flex;flex-direction:column;gap:3px}
.multi-view .mv-item{position:relative;padding-left:11px;line-height:1.5}
.multi-view .mv-item::before{content:'';position:absolute;left:0;top:.62em;width:4px;height:4px;border-radius:50%;background:#c0c5cc}
.finput{flex:1;min-width:0;border:none;outline:none;font-size:14px;color:#202124;background:transparent;padding:6px 0;font-family:inherit;line-height:1.45;resize:none}
.finput::placeholder{color:#c0c5cc}
textarea.finput{min-height:38px;overflow:hidden}
.frow-select{position:relative}
.frow-select select{flex:1;border:none;outline:none;font-size:14px;color:#202124;background:transparent;padding:7px 0;font-family:inherit;appearance:none;-webkit-appearance:none}
.frow-select::after{content:'›';position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(90deg);font-size:16px;color:#c0c5cc;pointer-events:none}

/* ===== 按钮 ===== */
.btn{display:block;width:100%;padding:13px;border-radius:10px;border:none;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-primary{background:#2f6fed;color:#fff}
.btn-ghost{background:#fff;color:#5f6368;border:1px solid #e3e5e9}
.btn-danger{background:#fff;color:#d93025;border:1px solid #f5c6c2}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{width:auto;flex:1}

/* ===== 底部固定操作 ===== */
.fixed-actions{position:sticky;bottom:0;background:linear-gradient(to top,#f5f6f8 60%,rgba(245,246,248,0));padding:12px 12px 14px;margin:0 -12px -20px}

/* ===== 对比表 ===== */
.cmp-wrap{padding:10px 0 20px}
.cmp-scroll{overflow:auto;scrollbar-width:thin;max-height:calc(100dvh - 175px);border-radius:10px;margin:0 8px;box-shadow:0 1px 4px rgba(0,0,0,.06);background:#fff;overscroll-behavior:contain}
.cmp-table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.cmp-table th,.cmp-table td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid #f0f1f4;background:#fff;line-height:1.45}
.cmp-table thead th{position:-webkit-sticky;position:sticky;top:0;background:#fafbfc;-webkit-transform:translateZ(0);transform:translateZ(0);font-weight:600;font-size:12.5px;color:#202124;border-bottom:2px solid #e8eaed;z-index:2;min-width:132px;max-width:150px}
.cmp-table thead th:first-child{position:-webkit-sticky;position:sticky;left:0;top:0;z-index:4;background:#f3f6fb}
/* 分组行：一、投保规则 / 二、必选责任 … */
.cmp-table tr.group-row th{position:-webkit-sticky;position:sticky;left:0;background:linear-gradient(90deg,#e8f0fe,#f4f8ff);color:#1a5fd0;font-weight:700;font-size:12px;letter-spacing:.5px;padding:7px 10px;text-align:left;border-top:1px solid #d6e4ff;border-bottom:1px solid #d6e4ff;z-index:3}
.cmp-table tr.group-row th .gcnt{font-weight:400;font-size:11px;color:#5b8def;margin-left:6px}
.cmp-table tbody th{position:-webkit-sticky;position:sticky;left:0;background:#fafbfc;-webkit-transform:translateZ(0);transform:translateZ(0);font-weight:500;color:#5f6368;font-size:12px;min-width:84px;max-width:96px;z-index:1;border-right:1px solid #f0f1f4}
.cmp-table td{min-width:132px;max-width:170px;color:#3c4043;word-break:break-word;border-left:1px solid #e2e6ec}
.cmp-table thead th:not(:first-child){border-left:1px solid #dfe3ea}
.cmp-table td[data-p]{cursor:pointer}
.cmp-table td[data-p]:active{box-shadow:inset 0 0 0 999px rgba(47,111,237,.09)}
.cmp-table td.diff{background:#fffdf5}
.cmp-table td.best{background:#f0fdf4;color:#137333;font-weight:600}
.cmp-table td.worst{background:#fef7f7;color:#c5221f}
/* 语义引擎标注 */
.cmp-table td.adv{background:#eef9f1;box-shadow:inset 3px 0 0 #34a853;color:#0f6c33;font-weight:600}
.cmp-table td.dis{background:#fdf3f3;color:#a2504a}
.cmp-table td.adv.diff{background:#e9f7ee}
.adv-mark{display:inline-block;font-size:9.5px;font-weight:700;background:#34a853;color:#fff;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle;letter-spacing:.5px}
.dis-mark{display:inline-block;font-size:9.5px;background:#e8a09a;color:#fff;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle;letter-spacing:.5px}
.adv-reason{display:block;font-size:10px;font-weight:400;color:#3f8f5c;margin-top:4px;line-height:1.35}
.cmp-table thead th.top-col{background:linear-gradient(180deg,#fff6e5,#ffeccc);box-shadow:inset 0 -2px 0 #f0a500}

/* ===== 优势榜 ===== */
.verdict{margin:0 8px 10px;background:#fff;border-radius:12px;padding:12px 12px 8px;box-shadow:0 1px 5px rgba(0,0,0,.07);border:1px solid #eef0f4}
.verdict-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.verdict-head .vt{font-size:14.5px;font-weight:700;color:#202124;letter-spacing:.3px}
.verdict-head .vs{font-size:11px;color:#9aa1ab}
.vcard{border:1px solid #c9d2dd;border-radius:10px;padding:9px 10px 10px;margin-bottom:8px;background:#fcfcfd;position:relative;transition:.15s}
.vcard.is-top{border-color:#f0c060;background:linear-gradient(180deg,#fffdf5,#fff9ec);box-shadow:0 2px 8px rgba(240,165,0,.13)}
.vcard:last-child{margin-bottom:2px}
.vcard-top{display:flex;align-items:center;gap:8px}
.vrank{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:#c8ccd2}
.vcard.r1 .vrank{background:linear-gradient(135deg,#f5b301,#e08b00)}
.vcard.r2 .vrank{background:linear-gradient(135deg,#b8c0cc,#9aa1ab)}
.vcard.r3 .vrank{background:linear-gradient(135deg,#d09a6a,#b57b4a)}
.vname{flex:1;font-size:13.5px;font-weight:600;color:#202124;line-height:1.3;word-break:break-all;min-width:0}
.crown{font-size:9.5px;background:linear-gradient(135deg,#f5b301,#e08b00);color:#fff;border-radius:4px;padding:1.5px 6px;margin-left:6px;font-weight:700;vertical-align:middle;white-space:nowrap}
.vscore{flex-shrink:0;font-size:11px;color:#7a828c;text-align:right;line-height:1.3}
.vscore b{font-size:17px;color:#137333;font-weight:700}
.vscore span{font-size:10px;margin-left:1px}
.vscore i{display:block;font-style:normal;font-size:10px;color:#b06a63}
.vbar{position:relative;height:16px;border-radius:8px;background:#f1f3f6;margin:7px 0 6px;overflow:hidden}
.vbar-in{height:100%;border-radius:8px;background:linear-gradient(90deg,#6ec48b,#34a853);transition:width .35s ease}
.vcard.r2 .vbar-in,.vcard.r3 .vbar-in{background:linear-gradient(90deg,#a9b3c1,#8d97a5)}
.vcard.rn .vbar-in{background:linear-gradient(90deg,#c9ced6,#b4bac3)}
.vbar-t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:#3f4650;font-weight:600;letter-spacing:.3px}
.vpros{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.vtag{font-size:10.5px;line-height:1.45;padding:3px 7px;border-radius:5px;display:block}
.vtag.good{background:#eef9f1;color:#1c7a3e}
.vtag.bad{background:#fdf1f0;color:#a0504a}
.vtag.neutral{background:#f5f6f8;color:#9aa1ab}
.cmp-table thead th .hsub{display:block;font-size:11px;color:#8a919b;font-weight:400;margin-top:2px}
.cmp-table thead th .hdel{color:#c0c5cc;font-size:14px;margin-left:4px;cursor:pointer}
.cmp-note{padding:8px 14px;font-size:11.5px;color:#9aa1ab;line-height:1.6}
/* 产品勾选条 */
.sel-bar{background:#fff;border-radius:11px;margin:0 8px 10px;padding:9px 11px 11px;box-shadow:0 1px 4px rgba(0,0,0,.05);border:1px solid #c9d2dd}
.sel-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sel-t{font-size:12px;font-weight:600;color:#5f6368}
.sel-n{font-size:10.5px;color:#2f6fed;background:#eef3ff;border-radius:8px;padding:1px 7px;font-weight:600}
.sel-clear{font-size:11px;color:#8a919b;margin-left:auto;text-decoration:underline;cursor:pointer;padding:2px 4px}
.sel-pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sel-pill{font-size:11.5px;color:#5f6368;background:#f5f6f8;border:1.5px solid transparent;border-radius:16px;padding:5px 11px;cursor:pointer;line-height:1.3;word-break:break-all;max-width:100%}
.sel-gwrap{flex-basis:100%;margin-top:6px}
.sel-group{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:3px 10px}
.sel-gpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.sel-pill:active{background:#eef3ff}
.sel-pill.on{color:#1a5fd0;background:#e8f0fe;border-color:#2f6fed;font-weight:600}
.best-mark{display:inline-block;font-size:10px;background:#137333;color:#fff;border-radius:3px;padding:0 3px;margin-left:3px;vertical-align:middle}

/* ===== 健康告知 ===== */
.hc-hero{margin:10px 12px 0;padding:16px 16px 15px;border-radius:14px;color:#fff;
  background:linear-gradient(135deg,#1f6b52 0%,#2e8f6d 45%,#3fa882 100%);
  box-shadow:0 5px 16px rgba(31,107,82,.22);position:relative;overflow:hidden}
.hc-hero::after{content:'';position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.hc-hero-t{font-size:17px;font-weight:700;letter-spacing:.5px}
.hc-hero-s{font-size:11.5px;opacity:.85;margin-top:5px;line-height:1.5}
.hc-card{background:#fff;margin:10px 12px 0;border-radius:12px;padding:13px 13px 14px;border:1px solid #e8ecf1;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hc-card-t{font-size:13.5px;font-weight:700;color:#20242b;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hc-card-hint{font-size:10.5px;font-weight:400;color:#95a0ad;background:#f3f5f8;border-radius:5px;padding:1px 6px}
.hc-chips{display:flex;flex-wrap:wrap;gap:7px}
.hc-chip{display:inline-flex;align-items:center;gap:4px;font-family:inherit;font-size:12.5px;line-height:1;
  padding:8px 11px;border-radius:20px;border:1px solid #dde3ea;background:#fafbfc;color:#4a5360;cursor:pointer;
  transition:all .16s;-webkit-tap-highlight-color:transparent}
.hc-chip .hc-ic{font-size:13px;line-height:1}
.hc-chip.on{background:#e7f7ef;border-color:#39a06f;color:#12653f;font-weight:600;box-shadow:0 1px 4px rgba(57,160,111,.18)}
.hc-free-wrap{margin-top:11px}
.hc-free{width:100%;box-sizing:border-box;border:1px solid #e1e6ec;border-radius:9px;padding:9px 10px;
  font-family:inherit;font-size:12.5px;line-height:1.55;color:#2d333b;background:#fafbfc;outline:none;resize:vertical}
.hc-free:focus{border-color:#39a06f;background:#fff}
.hc-free-tip{font-size:10.5px;color:#a3adb8;margin-top:4px}
.g-kv-hqt{cursor:pointer;position:relative;border:1px solid #cfe8da!important;background:#f4fbf7!important}
.g-kv-hqt:active{background:#eaf6ef!important}
.g-kv-open{display:inline-block;font-size:10px;color:#1a8a4a;background:#dff2e7;border-radius:8px;padding:1px 7px;margin-left:6px;font-weight:600}
.hqt-full{font-size:12.5px;line-height:1.9;color:#33413a}
.hqt-details summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}
.hqt-details summary::-webkit-details-marker{display:none}
.hqt-sum{padding:12px 14px}
.hqt-sum b{font-size:14px;color:#133a2c;letter-spacing:.5px}
.hqt-hint{font-size:10.5px;color:#9aa4b0;margin-left:auto}
.hqt-sum::after{content:'▶';font-size:10px;color:#b0b6bf;transition:transform .2s}
.hqt-details[open] .hqt-sum::after{transform:rotate(90deg)}
.hqt-body{padding:4px 14px 14px;font-size:12px;line-height:1.8;color:#3c4a42;border-top:1px dashed #e2e8e4;margin-top:2px;white-space:pre-wrap}
.hc-kinds{display:flex;gap:7px;flex-wrap:wrap;margin:12px 12px 0}
.hc-kind{font-family:inherit;font-size:12px;padding:7px 11px;border-radius:18px;border:1px solid #dde3ea;background:#fff;color:#4a5360;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hc-kind span{font-size:10px;color:#98a2ae}
.hc-kind.on{background:#1f6b52;border-color:#1f6b52;color:#fff;font-weight:600}
.hc-kind.on span{color:rgba(255,255,255,.75)}
.hc-line-raw{margin-top:5px;font-size:10.5px;line-height:1.65;color:#7d8896;background:rgba(255,255,255,.55);border-left:2px solid #c9d2dc;border-radius:4px;padding:5px 8px}
.hc-raw-tag{display:inline-block;font-size:9px;background:#e8ecf1;color:#5b6673;border-radius:3px;padding:0 4px;margin-right:5px;vertical-align:1px}
.hc-search{width:100%;box-sizing:border-box;margin:0 0 10px;padding:9px 11px;font-family:inherit;font-size:12.5px;
  border:1px solid #e1e6ec;border-radius:9px;background:#fafbfc;color:#2d333b;outline:none;-webkit-appearance:none}
.hc-search:focus{border-color:#39a06f;background:#fff}
.hc-chip.hc-more{background:#eef2f7;border-style:dashed;color:#5b6673}
.hc-nores{font-size:11.5px;color:#9aa4b0;padding:6px 2px}
.hc-clear{margin-top:10px;font-family:inherit;font-size:12px;color:#8a939e;background:#f4f6f9;border:none;
  border-radius:8px;padding:7px 14px;cursor:pointer}
.hc-empty{background:#fff;margin:10px 12px;border-radius:12px;padding:28px 20px;text-align:center;border:1px dashed #d8dfe8}
.hc-empty-ic{font-size:30px;margin-bottom:8px}
.hc-empty-t{font-size:14px;font-weight:600;color:#39414c}
.hc-empty-s{font-size:11.5px;color:#8b96a3;line-height:1.7;margin-top:6px}
.hc-sum{display:flex;gap:7px;margin:11px 12px 0}
.hc-sum-i{flex:1;background:#fff;border-radius:11px;padding:10px 4px 9px;text-align:center;border:1px solid #eceff3;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hc-sum-i b{display:block;font-size:19px;line-height:1.2;font-weight:800}
.hc-sum-i span{font-size:10.5px;color:#8b96a3;letter-spacing:.5px}
.hc-sum-i.ok b{color:#1a8a4a}
.hc-sum-i.cau b{color:#c98209}
.hc-sum-i.blk b{color:#d0442f}
.hc-sum-i.non b{color:#98a2ae}
.hc-sec{margin:14px 12px 0}
.hc-sec-h{display:flex;align-items:center;gap:8px;padding:0 2px 3px}
.hc-sec-h .hc-sec-ic{font-size:15px}
.hc-sec-h b{font-size:14px;color:#1f252d;letter-spacing:.5px}
.hc-sec-h span{font-size:11px;color:#98a2ae;margin-left:6px}
.hc-sec-sub{font-size:10.5px;color:#9aa4b0;line-height:1.6;padding:0 2px 9px}
.hc-sec.ok .hc-sec-h b{color:#146c3c}
.hc-sec.cau .hc-sec-h b{color:#a06c05}
.hc-sec.blk .hc-sec-h b{color:#b23a26}
.hc-item{background:#fff;border-radius:11px;margin-bottom:8px;border:1px solid #eceff3;
  box-shadow:0 1px 3px rgba(0,0,0,.045);overflow:hidden;cursor:pointer;position:relative}
.hc-sec.ok .hc-item{border-left:3px solid #3aab6d}
.hc-sec.cau .hc-item{border-left:3px solid #e3a228}
.hc-sec.blk .hc-item{border-left:3px solid #dd5c45}
.hc-sec.non .hc-item{border-left:3px solid #c9d2dc}
.hc-item:active{background:#fafbfc}
.hc-item-h{padding:10px 12px 0}
.hc-item-n{font-size:13.5px;font-weight:700;color:#1c222a;line-height:1.4;padding-right:60px}
.hc-item-tag{font-size:10.5px;color:#8e98a4;margin-top:2px}
.hc-item-b{padding:8px 12px 4px}
.hc-line{border-radius:7px;padding:6px 8px;margin-bottom:5px}
.hc-line:last-child{margin-bottom:0}
.hc-line-h{display:flex;align-items:center;gap:6px}
.hc-line-h b{font-size:12px;color:#2b323b}
.hc-lv{font-size:9.5px;border-radius:3px;padding:1px 5px;line-height:1.5}
.hc-line-n{font-size:11px;line-height:1.6;color:#5c6672;margin-top:3px}
.lvl-blk{background:#fdf0ee}
.lvl-blk .hc-lv{background:#f6d6d0;color:#b23a26}

var STORAGE_KEY = 'ins_v1';
var IDB_NAME = 'insurance-compare', IDB_STORE = 'kv', idbInst = null;

/* ---------- IndexedDB 层 ---------- */
function idbOpen() {
  return new Promise(function(resolve, reject){
    if (idbInst) return resolve(idbInst);
    if (!window.indexedDB) return reject(new Error('no-idb'));
    var req = window.indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(){
      var db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = function(){ idbInst = req.result; resolve(idbInst); };
    req.onerror = function(){ reject(req.error); };
  });
}
function idbSet(key, value) {
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  }).catch(function(){ /* 静默降级到 localStorage */ });
}
function idbGet(key) {
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, 'readonly');
      var r = tx.objectStore(IDB_STORE).get(key);
      r.onsuccess = function(){ resolve(r.result); };
      r.onerror = function(){ reject(r.error); };
    });
  });
}

/* ============================================================
   条款语义判断引擎
   对每个字段按「条款常识」打分，而不是只比数字大小。
   返回 -1(劣势) / 0(中性/不可比) / 1(优势)，权重 1~5
   ============================================================ */

// 正向词：出现即有利
var POS_WORDS = ['不限','不占','继续有效','依然有效','含','支持','可附加','保证','宽松','终身','全额','0免赔','无免赔','不分组','额外赔','递增','返还','不限制'];
// 负向词：出现即不利
var NEG_WORDS = ['不支持','无此功能','无','不含','不保','终止','失效','严格','占基本保额','占保额','限制','除外','不赔','需满足','仅限','单次','不变'];

function hasAny(txt, words) {
  for (var i = 0; i < words.length; i++) if (txt.indexOf(words[i]) >= 0) return words[i];
  return null;
}

/* 等待期：180天 → 6个月，统一成月数 */
function waitMonths(txt) {
  var m = String(txt).match(/(\d+(?:\.\d+)?)\s*(天|日|个月|月|年)/);
  if (!m) return null;
  var n = parseFloat(m[1]);
  var u = m[2];
  if (u === '天' || u === '日') return n / 30;
  if (u === '年') return n * 12;
  return n;
}

/* 赔付比例：取百分比，多个取最大 */
function ratios(txt) {
  var out = [], re = /(\d+(?:\.\d+)?)\s*%/g, m;
  while ((m = re.exec(String(txt))) !== null) out.push(parseFloat(m[1]));
  return out;
}

/* 金额统一成「万」，用于保额类比较 */
function toWan(txt) {
  var m = String(txt).match(/(\d+(?:\.\d+)?)\s*(万|千|元|块)?/);
  if (!m) return null;
  var n = parseFloat(m[1]);
  if (m[2] === '千') return n / 10;
  if (m[2] === '元' || m[2] === '块') return n / 10000;
  return n;
}

/* 判断某字段上，候选产品们谁更优。
   peers: [{id, txt}]  txt 已转成纯文本
   返回 { [id]: {level:-1|0|1, weight:n, reason:'…'} } */
function judgeField(fd, peers) {
  var res = {};
  var filled = peers.filter(function(p){ return p.txt !== ''; });
  peers.forEach(function(p){ res[p.id] = { level:0, weight:0, reason:'' }; });
  if (filled.length < 2) return res;   // 只有一个填了，谈不上对比

  var key = fd.key;

  /* ---- 规则 1：等待期（越短越好，按天数分档） ---- */
  if (key === 'waitPeriod') {
    var ms = filled.map(function(p){ return { id:p.id, w:waitMonths(p.txt) }; }).filter(function(o){ return o.w !== null; });
    if (ms.length < 2) return res;
    var min = Math.min.apply(null, ms.map(function(o){ return o.w; }));
    ms.forEach(function(o){
      if (o.w === min) { res[o.id] = { level:1, weight:5, reason:'等待期最短（' + Math.round(o.w*30) + '天）' }; }
      else if (o.w >= min + 2) { res[o.id] = { level:-1, weight:3, reason:'等待期更长' }; }
    });
    return res;
  }

  /* ---- 规则 2：带有「是否 / 有无」性质的字段，看关键词极性 ---- */
  /* 注意：guaranteed 不在此列，它要按年限比较，见规则 6 */
  if (key === 'afterCritical' || key === 'waiver' || key === 'optPolicyWaiver' ||
      key === 'review' || key === 'fullDisable' || key === 'optDeath') {
    var scored = filled.map(function(p){
      var pos = hasAny(p.txt, POS_WORDS);
      var neg = hasAny(p.txt, NEG_WORDS);
      var s = (pos && !neg) ? 1 : (neg && !pos ? -1 : 0);
      if (key === 'optDeath') {
        if (/不含|无/.test(p.txt)) s = -1;
        else if (/含|包含/.test(p.txt)) s = 1;
      }
      return { id:p.id, s:s, txt:p.txt };
    });
    var posN = scored.filter(function(o){ return o.s === 1; }).length;
    var negN = scored.filter(function(o){ return o.s === -1; }).length;
    scored.forEach(function(o){
      if (o.s === 1 && negN > 0) res[o.id] = { level:1, weight:4, reason:'具备该责任/功能' };
      else if (o.s === -1 && posN > 0) res[o.id] = { level:-1, weight:3, reason:'该项缺失或受限' };
    });
    return res;
  }

  /* ---- 规则 3：结节关爱金是否占保额（不占更好） ---- */
  if (key === 'noduleOccupy') {
    filled.forEach(function(p){
      if (/不占|不影响/.test(p.txt)) res[p.id] = { level:1, weight:4, reason:'不占用基本保额' };
      else if (/占/.test(p.txt) && !/不占/.test(p.txt)) res[p.id] = { level:-1, weight:2, reason:'占用基本保额' };
    });
    return res;
  }

  /* ---- 规则 4：健康告知（宽松更好） ---- */
  if (key === 'healthNotice') {
    var hn = filled.map(function(p){
      var s = 0;
      if (/宽松|仅\d+条|少|简单|\b[1-3]条/.test(p.txt)) s = 1;
      else if (/严格|严格|复杂|\d{2}条|多/.test(p.txt)) s = -1;
      var cnt = String(p.txt).match(/(\d+)\s*条/);
      return { id:p.id, s:s, cnt: cnt ? parseInt(cnt[1],10) : null };
    });
    var cnts = hn.filter(function(o){ return o.cnt !== null; });
    if (cnts.length >= 2) {
      var mn = Math.min.apply(null, cnts.map(function(o){ return o.cnt; }));
      var mx = Math.max.apply(null, cnts.map(function(o){ return o.cnt; }));
      if (mx !== mn) {
        hn.forEach(function(o){
          if (o.cnt === mn) res[o.id] = { level:1, weight:4, reason:'健告仅 ' + mn + ' 条，更宽松' };
          else if (o.cnt === mx) res[o.id] = { level:-1, weight:2, reason:'健告 ' + mx + ' 条，较严格' };
        });
        return res;
      }
    }
    hn.forEach(function(o){
      if (o.s === 1) res[o.id] = { level:1, weight:3, reason:'健康告知较宽松' };
      else if (o.s === -1) res[o.id] = { level:-1, weight:2, reason:'健康告知较严格' };
    });
    return res;
  }

  /* ---- 规则 5：是否限社保（不限更好） ---- */
  if (key === 'socialLimit') {
    filled.forEach(function(p){
      var t = p.txt;
      if (/不限|不限制|社保内外均可/.test(t)) {
        res[p.id] = { level:1, weight:4, reason:'不限社保，报销范围更广' };
      } else if (/仅限社保|限社保|社保内/.test(t)) {
        res[p.id] = { level:-1, weight:3, reason:'限社保范围内' };
      }
    });
    return res;
  }

  /* ---- 规则 6：保证续保（年限越长越好） ---- */
  if (key === 'guaranteed') {
    var gs = filled.map(function(p){
      var y = String(p.txt).match(/(\d+)\s*年/);
      var life = /终身|长期/.test(p.txt);
      return { id:p.id, y: life ? 999 : (y ? parseInt(y[1],10) : (/不保证|无/.test(p.txt) ? 0 : null)) };
    }).filter(function(o){ return o.y !== null; });
    if (gs.length < 2) return res;
    var gy = Math.max.apply(null, gs.map(function(o){ return o.y; }));
    gs.forEach(function(o){
      if (o.y === gy) res[o.id] = { level:1, weight:5, reason: o.y === 999 ? '终身保证续保' : '保证续保最长 ' + o.y + ' 年' };
      else if (o.y < gy) res[o.id] = { level:-1, weight:2, reason:'保证续保期限更短' };
    });
    return res;
  }

  /* ---- 规则 7：赔付比例（比例高、次数多更好） ---- */
  if (['criticalPay','mediumPay','mildPay','reimburseRate','disableRatio','medicalRate'].indexOf(key) >= 0) {
    var rs = filled.map(function(p){
      var r = ratios(p.txt);
      var cnt = String(p.txt).match(/(\d+)\s*次/);
      return { id:p.id, r: r.length ? Math.max.apply(null, r) : null, c: cnt ? parseInt(cnt[1],10) : null };
    });
    var withR = rs.filter(function(o){ return o.r !== null; });
    if (withR.length >= 2) {
      var hi = Math.max.apply(null, withR.map(function(o){ return o.r; }));
      var lo = Math.min.apply(null, withR.map(function(o){ return o.r; }));
      if (hi !== lo) {
        withR.forEach(function(o){
          if (o.r === hi) res[o.id] = { level:1, weight:5, reason:'赔付比例最高 ' + hi + '%' };
          else res[o.id] = { level:-1, weight:2, reason:'赔付比例 ' + o.r + '%，偏低' };
        });
        return res;
      }
    }
    // 比例相同，比次数
    var withC = rs.filter(function(o){ return o.c !== null; });
    if (withC.length >= 2) {
      var hc = Math.max.apply(null, withC.map(function(o){ return o.c; }));
      var lc = Math.min.apply(null, withC.map(function(o){ return o.c; }));
      if (hc !== lc) {
        withC.forEach(function(o){
          if (o.c === hc) res[o.id] = { level:1, weight:4, reason:'可赔 ' + hc + ' 次，次数最多' };
          else res[o.id] = { level:-1, weight:2, reason:'仅可赔 ' + o.c + ' 次' };
        });
        return res;
      }
    }
    return res;
  }

  /* ---- 规则 8：病种数量（越多越好） ---- */
  if (/(\d+)\s*种/.test(filled[0].txt) || filled.some(function(p){ return /\d+\s*种/.test(p.txt); })) {
    var kinds = filled.map(function(p){
      var m = String(p.txt).match(/(\d+)\s*种/);
      return { id:p.id, n: m ? parseInt(m[1],10) : null };
    }).filter(function(o){ return o.n !== null; });
    if (kinds.length >= 2) {
      var kn = Math.max.apply(null, kinds.map(function(o){ return o.n; }));
      var kx = Math.min.apply(null, kinds.map(function(o){ return o.n; }));
      if (kn !== kx) {
        kinds.forEach(function(o){
          if (o.n === kn) res[o.id] = { level:1, weight:3, reason:'覆盖 ' + kn + ' 种，范围最广' };
          else res[o.id] = { level:-1, weight:1, reason:'覆盖 ' + o.n + ' 种，偏少' };
        });
        return res;
      }
    }
  }

  /* ---- 规则 9：金额类（保额越高越好 / 保费越低越好） ---- */
  var amountKeys = ['maxSumInsured','sumInsured','accidentDeath','accidentDisable','medical',
                    'price','deductible','medicalDeduct','payoutAmount','irr','guaranteedRate','cashValueYear','effective'];
  if (amountKeys.indexOf(key) >= 0 && fd.better) {
    // 保费/免赔额这类「元」级金额，用原始数值比较，不做万换算，避免显示成 0.03万
    var isYuan = (key === 'price' || key === 'deductible' || key === 'medicalDeduct');
    var as = filled.map(function(p){
      var n = isYuan ? extractNum(p.txt) : toWan(p.txt);
      return { id:p.id, n:n, raw:String(p.txt).replace(/\s+/g,'') };
    }).filter(function(o){ return o.n !== null; });
    if (as.length < 2) return res;
    var mxv = Math.max.apply(null, as.map(function(o){ return o.n; }));
    var mnv = Math.min.apply(null, as.map(function(o){ return o.n; }));
    if (mxv === mnv) return res;
    as.forEach(function(o){
      var best = fd.better === 'high' ? (o.n === mxv) : (o.n === mnv);
      var worst = fd.better === 'high' ? (o.n === mnv) : (o.n === mxv);
      var unit = (key === 'irr' || key === 'guaranteedRate') ? '%' : '';
      var shown = isYuan ? o.raw : (o.n + unit);
      var word = fd.better === 'high' ? '最高' : '最低';
      if (best) res[o.id] = { level:1, weight:5, reason: word + ' ' + shown };
      else if (worst) res[o.id] = { level:-1, weight:2, reason:'该项不占优' };
    });
    return res;
  }

  /* ---- 规则 10：通用文字字段——关键词极性 + 内容详略 ---- */
  if (fd.type === 'text' || fd.type === 'long') {
    var texts = filled.map(function(p){
      var pos = hasAny(p.txt, POS_WORDS);
      var neg = hasAny(p.txt, NEG_WORDS);
      var s = 0;
      if (pos && !neg) s = 1;
      else if (neg && !pos) s = -1;
      return { id:p.id, s:s, len:p.txt.length };
    });
    var pN = texts.filter(function(o){ return o.s === 1; }).length;
    var nN = texts.filter(function(o){ return o.s === -1; }).length;
    var marked = false;
    if (pN > 0 && nN > 0) {
      texts.forEach(function(o){
        if (o.s === 1) { res[o.id] = { level:1, weight:3, reason:'条款更有利' }; marked = true; }
        else if (o.s === -1) { res[o.id] = { level:-1, weight:2, reason:'条款相对受限' }; marked = true; }
      });
    }
    return res;
  }

  return res;
}

/* 综合评估一组产品，输出每个产品的优势/劣势统计 + 亮点清单 */
function evaluateGroup(list) {
  var out = {};
  list.forEach(function(p){ out[p.id] = { win:0, lose:0, score:0, pros:[], cons:[], totalW:0 }; });
  if (list.length < 2) return out;

  // 按字段汇总（同类型才有可比性，混合类型用字段并集）
  var kmap = {}, ordered = [];
  list.forEach(function(p){
    getFields(p.type).forEach(function(fd){
      if (!kmap[fd.key]) { kmap[fd.key] = fd; ordered.push(fd.key); }
    });
  });

  ordered.forEach(function(k){
    var fd = kmap[k];
    var peers = list.map(function(p){
      return { id:p.id, txt: valueToText((p.fields||{})[k]) };
    });
    if (peers.filter(function(x){ return x.txt !== ''; }).length < 2) return;
    var judged = judgeField(fd, peers);
    Object.keys(judged).forEach(function(id){
      var j = judged[id];
      if (!j || !j.level) return;
      var w = j.weight || 1;
      out[id].score += j.level * w;
      out[id].totalW += w;
      if (j.level > 0) {
        out[id].win++;
        if (j.reason) out[id].pros.push({ label: fd.label, reason: j.reason, w: w });
      } else {
        out[id].lose++;
        if (j.reason) out[id].cons.push({ label: fd.label, reason: j.reason, w: w });
      }
    });
  });

  // 亮点按权重排序，最多留 5 条
  Object.keys(out).forEach(function(id){
    out[id].pros.sort(function(a,b){ return b.w - a.w; });
    out[id].cons.sort(function(a,b){ return b.w - a.w; });
    out[id].prosTop = out[id].pros.slice(0, 5);
    out[id].consTop = out[id].cons.slice(0, 3);
    var tot = out[id].win + out[id].lose;
    out[id].winRate = tot ? Math.round(out[id].win / tot * 100) : 0;
  });
  return out;
}

/* ============================================================
   v3.9.34 字段别名归一化
   同一含义存成了不同 key 的，读取时自动合并到标准 key
   ============================================================ */
var FIELD_ALIAS = {
  // 年度保额
  sumInsured:        ['maxSumInsured','guaranteed','accidentDeath'],
  // 免赔额
  deductible:        ['medicalDeduct','opt'],
  // 报销比例
  reimburseRate:     ['socialRule','socialLimit','medicalRate'],
  // 医院范围
  hospitalRange:     ['hospital','accidentHospital'],
  // 续保条件
  renewal:           ['guaranteed','renewalBonus'],
  // 增值服务
  services:          ['增值服务','service'],
  // 意外医疗额度
  medical:           ['generalMed'],
  // 生效时间
  effective:         ['effectiveTime']
};
// 建立反向索引：别名 → 标准名
var __ALIAS_REV = {};
Object.keys(FIELD_ALIAS).forEach(function(std){
  FIELD_ALIAS[std].forEach(function(al){ if (al !== std) __ALIAS_REV[al] = std; });
});

// 按标准 key 取字段值（自动合并别名 + 去重拼接）
function fieldVal(fields, key) {
  if (!fields) return undefined;
  var v = fields[key];
  var has = (v !== undefined && v !== null && v !== '' && !(Array.isArray(v) && !v.length));
  var extra = [];
  var aliasList = FIELD_ALIAS[key] || [];
  aliasList.forEach(function(al){
    if (al === key) return;
    var av = fields[al];
    if (av === undefined || av === null || av === '') return;
    if (Array.isArray(av) ? !av.length : false) return;
    extra.push(av);
  });
  if (!extra.length) return v;
  // 合并：主值 + 别名值（去除重复文字）
  var out = [];
  function push(x){
    if (Array.isArray(x)) { x.forEach(push); return; }
    var s = String(x).trim();
    if (!s) return;
    // 若新值已被已有值包含，跳过（避免重复）
    for (var i=0;i<out.length;i++){
      if (out[i].indexOf(s) >= 0) return;
      if (s.indexOf(out[i]) >= 0) { out[i] = s; return; }
    }
    out.push(s);
  }
  if (has) push(v);
  extra.forEach(push);
  if (!out.length) return v;
  return out.length === 1 ? out[0] : out;
}

function findField(type, key) {
  var fs = getFields(type);
  for (var i=0;i<fs.length;i++) if (fs[i].key === key) return fs[i];
  return null;
}

function saveData(d) {
  try { d._savedAt = Date.now(); } catch(e) {}
  idbSet(STORAGE_KEY, d);                   // 主存储
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
  } catch(e) {
    // 配额满：删旧值重试一次（自愈）
    if (e && (e.name === 'QuotaExceededError' || (e.code && e.code === 22))) {
      try { localStorage.removeItem(STORAGE_KEY); localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch(e2) {}

/* 启动协调：以 _savedAt 为准取最新，绝不用滞后数据覆盖新数据 */
function idbBoot() {
  var localRaw = null;
  try { localRaw = localStorage.getItem(STORAGE_KEY); } catch(e) {}
  var localTs = 0;
  if (localRaw) { try { localTs = (JSON.parse(localRaw)._savedAt || 0); } catch(e) {} }

  idbGet(STORAGE_KEY).then(function(existing){
    var idbHasReal = !!(existing && Array.isArray(existing.products) && existing.products.length > 0);
    var idbTs = (existing && existing._savedAt) || 0;
    if (!localRaw) {
      if (idbHasReal) { appData = existing; saveData(appData); renderAll(); }
      else { saveData(appData); }
    } else if (idbHasReal && idbTs > localTs) {
      appData = existing;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch(e) {}
      renderAll();
    } else {
      idbSet(STORAGE_KEY, appData);
    }
  }).catch(function(){});
}

/* ---------- 工具 ---------- */
function esc(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 1800);
}
function fmtNum(v) {
  if (v === '' || v === undefined || v === null) return '';
  var n = Number(v);
  if (isNaN(n)) return String(v);
  return (Math.round(n * 100) / 100).toString();
}
/* 从文本里提取第一个数字，用于打分（如 "100%" → 100，"20年" → 20） */
function extractNum(v) {
  if (v === '' || v === undefined || v === null) return null;
  // 多条描述：取第一条能提取到数字的
  if (Array.isArray(v)) {
    for (var i = 0; i < v.length; i++) {
      var n = extractNum(v[i]);
      if (n !== null) return n;
    }
    return null;
  }
  var m = String(v).match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
/* 把字段值渲染成显示用 HTML：数组→带圆点的多行，字符串→原样 */
function renderValueHTML(v) {
  if (v === undefined || v === null || v === '') return '';
  if (Array.isArray(v)) {
    var items = v.filter(function(x){ return x !== '' && x !== null && x !== undefined; });
    if (items.length === 0) return '';
    if (items.length === 1) return esc(items[0]);
    return '<div class="multi-view">' + items.map(function(x){
      return '<div class="mv-item">' + esc(x) + '</div>';
    }).join('') + '</div>';
  }
  return esc(v);
}
/* 值转纯文本（对比表里用，保留换行分隔） */
function valueToText(v) {
  if (v === undefined || v === null || v === '') return '';
  if (Array.isArray(v)) return v.filter(function(x){ return x !== ''; }).join('\n');
  return String(v);
}
/* 值转单元格 HTML：数组逐条渲染，条与条之间浅灰虚线分隔 */
function cellHtml(v) {
  if (Array.isArray(v)) {
    return v.filter(function(x){ return x !== ''; })
            .map(function(x){ return '<div class="td-line">' + esc(x) + '</div>'; }).join('');
  }
  var t = valueToText(v);
  return t === '' ? '' : esc(t).replace(/\n/g, '<br>');
}
/* 判断字段值是否为空 */
function valueEmpty(v) {
  if (v === undefined || v === null) return true;
  if (Array.isArray(v)) return v.filter(function(x){ return x !== ''; }).length === 0;
  return String(v).trim() === '';
}
function getProduct(id) {

}

function renderList() {
  // 类型筛选
  var counts = { all: appData.products.length };
  appData.products.forEach(function(p){ counts[p.type] = (counts[p.type]||0) + 1; });
  var fb = document.getElementById('type-filter');
  var html = '<div class="chip' + (state.listType==='all'?' active':'') + '" data-t="all">全部<span class="cnt">' + counts.all + '</span></div>';
  Object.keys(TYPES).forEach(function(t){
    var c = counts[t] || 0;
    if (c === 0 && state.listType !== t) return;   // 没有产品的类型不显示
    html += '<div class="chip' + (state.listType===t?' active':'') + '" data-t="' + t + '">' + TYPES[t].icon + ' ' + TYPES[t].short + '<span class="cnt">' + c + '</span></div>';
  });
  fb.innerHTML = html;
  fb.querySelectorAll('.chip').forEach(function(el){
    el.addEventListener('click', function(){
      state.listType = this.dataset.t;
      renderList();
    });
  });

  // 公司 / 层级 / 搜索 筛选面板
  function tierOfP(p){ return tierName(p.tier); }
  var TIERS = ['惠民保','普通百万医疗','中端医疗','高端医疗'];

  var coOpts = '<option value="all">公司</option>' + Object.keys(coMap).sort().map(function(c){
    return '<option value="' + esc(c) + '"' + (state.listCo===c?' selected':'') + '>' + esc(c) + ' (' + coMap[c] + ')</option>';
  }).join('');

    var n = appData.products.filter(function(p){ return p.type==='yl' && tierOfP(p)===tr; }).length;

/* ============================================================
   打分：按用户设置的权重，对各产品参与打分的字段归一化后加权
   ============================================================ */
function calcScore(p) {
  var fields = getFields(p.type).filter(function(f){ return f.score && f.better; });
  if (fields.length === 0) return null;
  var totalW = 0, totalS = 0, any = false;
  fields.forEach(function(f){
    var w = getWeight(p.type, f.key);
    if (w <= 0) return;
    var myVal = extractNum((p.fields||{})[f.key]);
    if (myVal === null) return;
    // 在同类型产品里归一化
    var peers = appData.products.filter(function(x){ return x.type === p.type; });
    var vals = peers.map(function(x){ return extractNum((x.fields||{})[f.key]); }).filter(function(v){ return v !== null; });
    if (vals.length < 2) return;
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    var ratio;
    if (mx === mn) ratio = 1;
    else ratio = (myVal - mn) / (mx - mn);
    if (f.better === 'low') ratio = 1 - ratio;   // 越小越好则反转
    totalS += ratio * w;
    totalW += w;
    any = true;
  });
  if (!any || totalW === 0) return null;
  return (totalS / totalW) * 100;
}
function weightKey(type, key) { return type + '.' + key; }
function getWeight(type, key) {
  var k = weightKey(type, key);
  if (appData.weights && appData.weights[k] !== undefined) return appData.weights[k];
  return 3;   // 默认权重
}
function setWeight(type, key, v) {
  if (!appData.weights) appData.weights = {};
  appData.weights[weightKey(type, key)] = v;
  saveData(appData);
}

  function gMark(s) {
    var raw = String(s);
    var PH = [], N = 0;
    function ph(html){ PH.push(html); return '\u0001' + (N++) + '\u0001'; }
    raw = raw.replace(/[*＊]{2}([^*＊]+)[*＊]{2}/g, function(_, x){ return ph('<b class="u-b">' + esc(x) + '</b>'); });
    raw = raw.replace(/[#＃]{2}([^#＃]+)[#＃]{2}/g, function(_, x){ return ph('<span class="u-hl">' + esc(x) + '</span>'); });
    raw = raw.replace(/[!！]{2}([^!！]+)[!！]{2}/g, function(_, x){ return ph('<span class="u-warn">' + esc(x) + '</span>'); });
    var out = gHl(raw);
    out = out.replace(/\u0001(\d+)\u0001/g, function(_, i){ return PH[+i]; });

        Array.prototype.forEach.call(document.querySelectorAll('.gc-gb'), function(x){ x.classList.remove('on'); });
        btn.classList.add('on');
        calc.g = btn.getAttribute('data-g');
        gcUpdate();
      });
    });
    document.getElementById('gc-age').addEventListener('change', function(){ calc.age = +this.value; gcUpdate(); });
    document.getElementById('gc-sum').addEventListener('change', function(){ calc.sum = this.value; gcUpdate(); });
    document.getElementById('gc-pay').addEventListener('change', function(){ calc.pay = this.value; gcUpdate(); });
    Array.prototype.forEach.call(document.querySelectorAll('.gc-rider'), function(chip){
      chip.addEventListener('click', function(){
        var i = chip.getAttribute('data-i');
        calc.riders[i] = !calc.riders[i];
        chip.classList.toggle('on', !!calc.riders[i]);
        gcUpdate();
      });
    });
    gcUpdate();
  } else if (document.getElementById('gc-total') && window.__calcMode === 'combo') {
    var __noCombo = !!document.getElementById('gc-plan');
    function gcUpdate() {
      var plan, base, detailTxt;
      if (__noCombo) {
        var sel = document.getElementById('gc-plan');
        plan = sel ? sel.value : null;
        base = plan ? premFor(plan, calc.age, calc.g) : null;
        detailTxt = (calc.g === '男' ? '男性' : '女性') + ' · ' + calc.age + '岁 · ' + plan +
          (base == null ? '（该方案暂无此年龄费率）' : '（官方费率·有等待期）');
      } else {
        plan = comboPlan(calc.sum, calc.pay);
        base = plan ? premFor(plan, calc.age, calc.g) : null;
        var scale = (+calc.sum || 30) / 30;
        var total = base || 0, parts = [];
        riders.forEach(function(rd, i){
          var el = document.getElementById('gc-rider-' + i);
          if (!el) return;
          var rp = premFor(rd.plan, calc.age, calc.g);
          var bp = premFor(calcBase, calc.age, calc.g);
          var delta = (rp != null && bp != null) ? Math.round((rp - bp) * scale) : null;
          var pr = el.querySelector('.gc-price');
          if (pr) pr.innerText = delta != null ? '+' + delta.toLocaleString('zh-CN') : '暂无费率';
          el.style.opacity = delta != null ? '' : '.45';
          if (calc.riders[i] && delta != null && base != null) { total += delta; parts.push('+' + delta.toLocaleString('zh-CN')); }
        });
        detailTxt = (calc.g === '男' ? '男性' : '女性') + ' · ' + calc.age + '岁 · ' + calc.sum + '万保额·' + calc.pay + '年交' +
          (base == null ? '（该组合暂无费率数据）' : (parts.length ? '（附加' + parts.join(' + ') + '）' : ''));
        base = base != null ? total : null;
      }
      document.getElementById('gc-total').innerText = base != null ? '¥' + Number(base).toLocaleString('zh-CN') : '暂无费率';
      document.getElementById('gc-detail').innerText = detailTxt;
    }
    Array.prototype.forEach.call(document.querySelectorAll('.gc-gb'), function(btn){
      btn.addEventListener('click', function(){
        Array.prototype.forEach.call(document.querySelectorAll('.gc-gb'), function(x){ x.classList.remove('on'); });
        btn.classList.add('on');
        calc.g = btn.getAttribute('data-g');
        gcUpdate();
      });
    });
    document.getElementById('gc-age').addEventListener('change', function(){ calc.age = +this.value; gcUpdate(); });
    var __planSel = document.getElementById('gc-plan');
    if (__planSel) __planSel.addEventListener('change', gcUpdate);
    document.getElementById('gc-sum') && document.getElementById('gc-sum').addEventListener('change', function(){ calc.sum = this.value; gcUpdate(); });
    document.getElementById('gc-pay') && document.getElementById('gc-pay').addEventListener('change', function(){ calc.pay = this.value; gcUpdate(); });
    Array.prototype.forEach.call(document.querySelectorAll('.gc-rider'), function(chip){
      chip.addEventListener('click', function(){
        var i = chip.getAttribute('data-i');
        calc.riders[i] = !calc.riders[i];
        chip.classList.toggle('on', !!calc.riders[i]);
        gcUpdate();
      });
    });
    gcUpdate();
  }

  // ===== v3.9.31 模块级内联编辑 =====
  box.querySelectorAll('.g-edit').forEach(function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      openModuleEdit(p.id, el.getAttribute('data-ek').split(','), el.getAttribute('data-et'));
    });
  });
  // ===== 一键存图 =====
  var shotBtn = document.getElementById('btn-shot-current');
  if (shotBtn) shotBtn.addEventListener('click', function(){ shotDetail(p.id); });

  document.getElementById('btn-edit-current').addEventListener('click', function(){
    state.editingId = p.id;
    switchPage('edit');
  });
  document.getElementById('btn-dup-current').addEventListener('click', function(){
    var copy = JSON.parse(JSON.stringify(p));
    copy.id = uid();
    copy.name = p.name + '（副本）';
    copy.createdAt = Date.now();
    copy.updatedAt = Date.now();
    appData.products.push(copy);
    saveData(appData);
    toast('已复制');
    state.detailId = copy.id;
    renderDetail();
  });
}

/* ============================================================
   v3.9.31 模块级内联编辑（点铅笔 → 底部面板 → 原地刷新）
   ============================================================ */
function openModuleEdit(pid, keys, title) {
  var p = getProduct(pid);
  if (!p) return;
  var fields = getFields(p.type);
  var f = p.fields || {};
  var mask = document.createElement('div');
  mask.className = 'me-mask';
  var rows = '';
  keys.forEach(function(k){
    var def = null;
    for (var i = 0; i < fields.length; i++) { if (fields[i].key === k) { def = fields[i]; break; } }
    var label = def ? def.label : k;
    var val = f[k];
    var isArr = Array.isArray(val);
    var lines = isArr ? val.slice() : (val ? String(val).split('\n') : []);
    if (!lines.length) lines = [''];
    rows += '<div class="me-row" data-k="' + esc(k) + '"><div class="me-lbl">' + esc(label) + '</div><div class="me-lines">';
    lines.forEach(function(ln, i){
      rows += '<div class="me-row-rel" style="margin-bottom:6px"><textarea class="me-ta" rows="1">' + esc(ln) + '</textarea>' +
        (lines.length > 1 ? '<span class="me-del">×</span>' : '') + '</div>';
    });
    rows += '</div><div class="me-add">＋ 增加一行</div></div>';
  });
  mask.innerHTML = '<div class="me-panel">' +
    '<div class="me-head"><b>✏️ 编辑 · ' + esc(title || '') + '</b><span class="me-x">✕</span></div>' +
    '<div class="me-tip">标记语法：<code>**加粗**</code> <code>##绿底高亮（优势）##</code> <code>!!红字（风险提醒）!!</code><br>一行一条 · 保存后原地生效</div>' +
    '<div class="me-body">' + rows + '</div>' +
    '<div class="me-foot"><button class="btn btn-ghost me-cancel">取消</button><button class="btn btn-primary me-save">保存</button></div>' +
    '</div>';
  document.body.appendChild(mask);

  function growAll(){
    mask.querySelectorAll('.me-ta').forEach(function(ta){
      ta.style.height = 'auto';
      ta.style.height = Math.max(38, ta.scrollHeight) + 'px';
    });
  }
  setTimeout(growAll, 30);
  mask.addEventListener('input', function(e){ if (e.target.classList.contains('me-ta')) growAll(); });

  function close(){ mask.remove(); }
  mask.querySelector('.me-x').addEventListener('click', close);
  mask.querySelector('.me-cancel').addEventListener('click', close);
  mask.addEventListener('click', function(e){ if (e.target === mask) close(); });

  // 增删行
  mask.addEventListener('click', function(e){
    var add = e.target.closest('.me-add');
    if (add) {
      var row = add.closest('.me-row');
      var lines = row.querySelector('.me-lines');
      var d = document.createElement('div');
      d.className = 'me-row-rel';
      d.style.marginBottom = '6px';
      d.innerHTML = '<textarea class="me-ta" rows="1" placeholder="再填一条…"></textarea><span class="me-del">×</span>';
      lines.appendChild(d);
      row.querySelectorAll('.me-del').forEach(function(x){ x.style.display = 'flex'; });
      growAll();
      d.querySelector('textarea').focus();
      return;
    }
    var del = e.target.closest('.me-del');
    if (del) {
      var wrap = del.closest('.me-row-rel');
      var linesBox = del.closest('.me-lines');
      wrap.remove();
      if (linesBox.querySelectorAll('.me-row-rel').length === 1) {
        linesBox.querySelectorAll('.me-del').forEach(function(x){ x.style.display = 'none'; });
      }
    }
  });

  mask.querySelector('.me-save').addEventListener('click', function(){
    p.fields = p.fields || {};
    mask.querySelectorAll('.me-row').forEach(function(row){
      var k = row.getAttribute('data-k');
      var arr = [];
      row.querySelectorAll('.me-ta').forEach(function(ta){
        var v = (ta.value || '').trim();
        if (v) arr.push(v);
      });
      if (!arr.length) { delete p.fields[k]; }
      else if (arr.length === 1) { p.fields[k] = arr[0]; }
      else { p.fields[k] = arr; }
    });
    p.updatedAt = Date.now();
    saveData(appData);
    close();
    renderDetail();
    toast('已保存');
  });
}

/* ============================================================
   v3.9.31 产品详情一键存图（用 SVG foreignObject 渲染 DOM）
   ============================================================ */
function shotDetail(pid) {
  var p = getProduct(pid);
  if (!p) return;
  var poster = document.querySelector('#page-detail .g-poster');
  if (!poster) { toast('页面还没渲染好'); return; }
  if (typeof html2canvas !== 'function') { toast('渲染库未加载'); return; }
  toast('正在生成图片…');
  document.body.classList.add('shot-mode');
  setTimeout(function(){
    html2canvas(poster, {
      scale: 2,
      backgroundColor: '#eef7ef',
      useCORS: true,
      logging: false,
      windowWidth: poster.offsetWidth,
      windowHeight: poster.scrollHeight
    }).then(function(cv){
      document.body.classList.remove('shot-mode');
      showShotResult(cv);
    }).catch(function(e){
      document.body.classList.remove('shot-mode');
      toast('生成失败：' + (e && e.message || e));
    });
  }, 150);
}

function showShotResult(cv) {
  var mask = document.createElement('div');
  mask.className = 'me-mask';
  mask.innerHTML = '<div class="me-panel" style="max-height:92vh">' +
    '<div class="me-head"><b>📸 已生成图片</b><span class="me-x">✕</span></div>' +
    '<div class="me-body" style="text-align:center"><img style="max-width:100%;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15)" src="' + cv.toDataURL('image/png') + '"></div>' +
    '<div class="me-foot"><button class="btn btn-ghost" id="shot-save">保存到相册</button><button class="btn btn-primary" id="shot-share">分享</button></div>' +
    '</div>';
  document.body.appendChild(mask);
  var dataUrl = cv.toDataURL('image/png');
  mask.querySelector('.me-x').addEventListener('click', function(){ mask.remove(); });
  mask.addEventListener('click', function(e){ if (e.target === mask) mask.remove(); });
  mask.querySelector('#shot-save').addEventListener('click', function(){
    var a = document.createElement('a');
    a.href = dataUrl;
    a.download = '保险产品_' + Date.now() + '.png';
    a.click();
    toast('已保存（长按图片也可保存到相册）');
  });
  mask.querySelector('#shot-share').addEventListener('click', function(){
    try {
      cv.toBlob(function(blob){
        var file = new File([blob], 'product.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: '产品详情' });
        } else {
          toast('请长按图片保存后分享');
        }
      });
    } catch(e) { toast('请长按图片保存后分享'); }
  });
}

/* ============================================================
   视图一：对比表 + 差异高亮
   ============================================================ */
function renderTable() {
  var box = document.getElementById('page-table');

  // 类型筛选
  var counts = {};
  appData.products.forEach(function(p){ counts[p.type] = (counts[p.type]||0)+1; });
  var usedTypes = Object.keys(counts);
  if (usedTypes.length === 0) {
    box.innerHTML = '<div class="empty"><p>还没有产品可以对比</p><div class="hint">先到「产品库」添加两三个产品吧</div></div>';
    return;
  }
  // 若当前选中的类型没有产品，回退到 all
  if (state.tableType !== 'all' && !counts[state.tableType]) state.tableType = 'all';

  var fb = '<div class="filter-bar">';
  fb += '<div class="chip' + (state.tableType==='all'?' active':'') + '" data-t="all">全部<span class="cnt">' + appData.products.length + '</span></div>';
  usedTypes.forEach(function(t){
    fb += '<div class="chip' + (state.tableType===t?' active':'') + '" data-t="' + t + '">' + TYPES[t].icon + ' ' + TYPES[t].short + '<span class="cnt">' + counts[t] + '</span></div>';
  });
  fb += '</div>';

  // 公司 / 医疗层级：下拉式筛选（一排两个，不占空间）
  var TIERS = ['惠民保','普通百万医疗','中端医疗','高端医疗'];
  function tierOf(p){ return tierName(p.tier); }
  var allYl = appData.products.filter(function(p){ return p.type === 'yl'; });
  var coMap = {};
  allYl.forEach(function(p){ var c = (function(c){return (Array.isArray(c)?c.join(""):String(c||"")).trim();})(((p.fields||{})).company); if (c) coMap[c] = (coMap[c]||0)+1; });
  var coList = Object.keys(coMap).sort();
  if (state.tableCo !== 'all' && !coMap[state.tableCo]) state.tableCo = 'all';
  if (state.tableTier !== 'all' && TIERS.indexOf(state.tableTier) < 0 && state.tableTier !== '未标注') state.tableTier = 'all';

  fb += '<div class="filter-bar" id="ct-bar">';
  fb += '<span class="fsel-wrap"><select class="fsel' + (state.tableCo!=='all'?' active':'') + '" id="co-sel">' +
    '<option value="all">公司：全部 (' + allYl.length + ')</option>' +
    coList.map(function(c){ return '<option value="' + esc(c) + '"' + (state.tableCo===c?' selected':'') + '>' + esc(c) + ' (' + coMap[c] + ')</option>'; }).join('') +
    '</select></span>';
  fb += '<span class="fsel-wrap"><select class="fsel' + (state.tableTier!=='all'?' active':'') + '" id="tier-sel">' +
    '<option value="all">档次：全部</option>' +
    TIERS.map(function(tr){
      var n = allYl.filter(function(p){ return tierOf(p) === tr; }).length;
      return '<option value="' + tr + '"' + (state.tableTier===tr?' selected':'') + '>' + tr + ' (' + n + ')</option>';
    }).join('') +
    (allYl.some(function(p){ return tierOf(p)==='未标注'; }) ? '<option value="未标注"' + (state.tableTier==='未标注'?' selected':'') + '>未标注</option>' : '') +
    '</select></span>';
  fb += '</div>';

  var scope = appData.products.filter(function(p){
    if (state.tableType !== 'all' && p.type !== state.tableType) return false;
    var c = (function(c){return (Array.isArray(c)?c.join(""):String(c||"")).trim();})(((p.fields||{})).company);
    if (state.tableCo !== 'all' && c !== state.tableCo) return false;
    if (state.tableTier !== 'all' && (p.type !== 'yl' || tierOf(p) !== state.tableTier)) return false;
    return true;
  });
  if (scope.length === 0) { box.innerHTML = fb + '<div class="empty"><p>该筛选条件下暂无产品</p></div>'; bindTypeChips(box, 'tableType', renderTable); bindCoTierChips(box); return; }

  // 清理过期的勾选（产品已删除或不在当前类型范围内）
  var scopeIds = {};
  scope.forEach(function(p){ scopeIds[p.id] = true; });
  state.tableIds = state.tableIds.filter(function(id){ return scopeIds[id]; });

  // ===== 产品勾选条（按产品系列分组，组内按年份从旧到新；超过 6 个折叠）=====
  var G_CLS = [
    {c:'#b25e00',bg:'#fff3e0'},{c:'#1a56b0',bg:'#e8f0fe'},{c:'#7a2fbf',bg:'#f3e8fd'},
    {c:'#137333',bg:'#e6f4ea'},{c:'#c5221f',bg:'#fce8e6'},{c:'#5f6368',bg:'#f1f3f6'}
  ];
  function seriesOf(name){
    var m = name.match(/(众民保|尊享e生|明爱安保|欣生人生|星相守|心相守|好医保|蓝医保|长相安|医安心|e享保|臻选|中高端|百万医疗)/);
    if (m) return m[1];
    var s = name.replace(/（[^）]*）|\([^)]*\)/g, '').replace(/20\d{2}[\s\S]*$/, '').replace(/[（(].*/, '').trim();
    return s || name;
  }
  // 公司配色：每个公司固定一组颜色（组头深色，产品浅色）
  var coColors = {}, coCi = 0;
  scope.forEach(function(p){
    var c = (function(c){return (Array.isArray(c)?c.join(""):String(c||"")).trim();})(((p.fields||{})).company);
    if (c && !coColors[c]) coColors[c] = G_CLS[coCi++ % G_CLS.length];
  });
  var gOrder = [], gMap = {};
  scope.forEach(function(p){
    var s = seriesOf(p.name);
    if (!gMap[s]) { gMap[s] = []; gOrder.push(s); }
    gMap[s].push(p);
  });
  gOrder.forEach(function(s){
    gMap[s].sort(function(a, b){
      var ya = (a.name.match(/20\d{2}/) || [9999])[0] * 1;
      var yb = (b.name.match(/20\d{2}/) || [9999])[0] * 1;
      if (ya !== yb) return ya - yb;
      return a.name.length - b.name.length || a.name.localeCompare(b.name, 'zh');
    });
  });
  var pillHtml = '';
  gOrder.forEach(function(s){
    var cc = coColors[((gMap[s][0].fields||{}).company||'').trim()] || G_CLS[G_CLS.length-1];
    var pills = '';
    gMap[s].forEach(function(p){
      var on = state.tableIds.indexOf(p.id) >= 0;
      pills += '<div class="sel-pill' + (on ? ' on' : '') + '"' + (on ? '' : ' style="background:' + cc.bg + ';color:' + cc.c + '"') + ' data-sel="' + esc(p.id) + '">' +
              (on ? '✓ ' : '') + esc(p.name) + '</div>';
    });
    if (gOrder.length > 1) {
      pillHtml += '<div class="sel-gwrap"><div class="sel-group" style="background:' + cc.c + ';color:#fff">' + esc(s) + '</div>' +
                  '<div class="sel-gpills">' + pills + '</div></div>';
    } else {
      pillHtml += pills;
    }
  });
  var needFold = scope.length > 6;
  fb += '<div class="sel-bar"><div class="sel-head">' +
          '<span class="sel-t">勾选要对比的产品</span>' +
          '<span class="sel-n">' + (state.tableIds.length ? '已选 ' + state.tableIds.length + ' 个' : '未勾选，先选 ' + scope.length + ' 个里的几个') + '</span>' +
          (state.tableIds.length ? '<span class="sel-clear" id="sel-clear">清空</span>' : '') +
        '</div><div class="sel-pills' + (needFold ? ' collapsed' : '') + '">' +
          pillHtml +
        '</div>' +
        (needFold ? '<div class="sel-more" id="sel-more">展开全部 ' + scope.length + ' 个 ▾</div>' : '') +
        '</div>';

  // 勾选过滤：勾了哪些就只对比哪些（未勾选 = 不显示，等待选择）
  var list = scope.filter(function(p){
    return state.tableIds.indexOf(p.id) >= 0;
  });
  if (state.tableIds.length === 0) {
    box.innerHTML = fb + '<div class="empty"><p>👆 在上方勾选想对比的产品</p><div class="hint">勾选几个，下面就会显示它们的对比表</div></div>';
    bindTypeChips(box, 'tableType', renderTable);
    bindCoTierChips(box);
    bindSelPills(box);
    return;
  }
  if (list.length === 0) {
    box.innerHTML = fb + '<div class="empty"><p>勾选的产品都不在当前类型里</p><div class="hint">点上面的「清空」重新选择</div></div>';
    bindTypeChips(box, 'tableType', renderTable);
    bindCoTierChips(box);
    bindSelPills(box);
    return;
  }

  // 字段：全部类型统一显示（不同字段用「—」）
  var isMixed = state.tableType === 'all';
  var fields;
  if (isMixed) {
    // 混合模式：用所有出现过的字段并集，按通用优先排序
    var kmap = {}, ordered = [];
    list.forEach(function(p){
      getFields(p.type).forEach(function(fd){
        var k = fd.key;
        if (!kmap[k]) { kmap[k] = fd; ordered.push(k); }
      });
    });
    fields = ordered.map(function(k){ return kmap[k]; });
  } else {
    fields = getFields(state.tableType);
  }
  // 只显示至少一个产品填过的字段
  fields = fields.filter(function(fd){
    return list.some(function(p){
      var ff = p.fields || {};
      return !valueEmpty(ff[fd.key]);
    });
  });

  var topId = null;
  // ===== 表格（v3.3：优势榜已按需求移除，只看勾选的产品）=====
  var h = fb;

  // 表头
  h += '<div class="cmp-wrap"><div class="cmp-scroll"><table class="cmp-table"><thead><tr><th style="min-width:76px;max-width:88px">产品名称 <span style="color:#c0c5cc">→</span></th>';
  list.forEach(function(p){
    var t = TYPES[p.type] || TYPES.qt;
    h += '<th data-p="' + esc(p.id) + '" style="cursor:pointer"' + (p.id === topId ? ' class="top-col"' : '') + '>' + esc(p.name) + '<span class="hsub">' + esc((p.fields||{}).company || t.short) + '</span></th>';
  });
  h += '</tr></thead><tbody>';

  // 表体（按大组分段：一、投保规则 / 二、必选责任 / …）
  var lastGroup = null;
  fields.forEach(function(fd){
    var g = fd.group || '其他';
    if (g !== lastGroup) {
      // 统计该组内已填字段数
      var cnt = 0;
      fields.forEach(function(x){ if ((x.group||'其他') === g) cnt++; });
      h += '<tr class="group-row"><th colspan="' + (list.length + 1) + '">' + esc(g) + '<span class="gcnt">' + cnt + ' 项</span></th></tr>';
      lastGroup = g;
    }
    var vals = list.map(function(p){
      return valueToText((p.fields||{})[fd.key]);
    });
    // 差异判断：值不全相同
    var filledVals = vals.filter(function(v){ return v !== ''; });
    var isDiff = new Set(filledVals).size > 1;

    // 用语义引擎判断本行谁优谁劣
    var rowJudge = judgeField(fd, list.map(function(p, i){ return { id: p.id, txt: vals[i] }; }));

  h += '<tr><th>' + esc(fd.label) + '</th>';
  vals.forEach(function(v, i){
    var raw = (list[i].fields || {})[fd.key];
    var j = rowJudge[list[i].id] || { level:0, reason:'' };
    var cls = '';
    if (isDiff) cls = 'diff';
    if (j.level > 0) cls += ' adv';
    else if (j.level < 0) cls += ' dis';
    var show = v === '' ? '<span style="color:#c0c5cc">—</span>' : cellHtml(raw);
    var tag = j.level > 0 ? '<span class="adv-mark" title="' + esc(j.reason) + '">优</span>'
            : (j.level < 0 ? '<span class="dis-mark">弱</span>' : '');
    // 优势理由：仅在该行唯一优势时显示，避免刷屏
    var advCount = Object.keys(rowJudge).filter(function(k){ return rowJudge[k].level > 0; }).length;
    var reason = (j.level > 0 && advCount === 1 && j.reason) ? '<span class="adv-reason">' + esc(j.reason) + '</span>' : '';
    h += '<td class="' + cls + '" data-p="' + esc(list[i].id) + '" data-k="' + esc(fd.key) + '">' + show + tag + reason + '</td>';
  });
  h += '</tr>';
});

  h += '</tbody></table></div>';
  h += '<div class="cmp-note">🟢 优＝该项条款更有利　🔴 弱＝相对不利　淡黄＝各产品有差异<br>✏️ 点击任意单元格可直接修改；点产品名进完整编辑页。</div>';
  h += '</div>';

  box.innerHTML = h;
  bindTypeChips(box, 'tableType', renderTable);
  bindCoTierChips(box);

/* iOS Safari 上表格内 sticky 偶发失效的兜底：
   首次滚动时实测左上角有没有钉住；若失效，改用 transform 补偿把表头/左列/角落拉回原位 */
function initFreezeFix(scroller) {
  if (!scroller || scroller._freezeInit) return;
  scroller._freezeInit = true;
  scroller._freezeMode = 'auto';
  scroller._jsTouched = false;

  // 进入 JS 补偿模式：先把 sticky 降级为 static（每个表头只做一次）
  function enterJs(table) {
    if (scroller._jsTouched) return;
    scroller._jsTouched = true;
    scroller._freezeMode = 'js';
    var all = table.querySelectorAll('thead th, tbody th');
    for (var i = 0; i < all.length; i++) {
      all[i].style.position = 'static';
    }
  }

  function paint() {
    if (scroller._jsTouched) {
      // 表格被重新渲染过（表头数量变化）→ 重新标记
      var t2 = scroller.querySelector('.cmp-table');
      if (t2 && t2.querySelectorAll('thead th').length !== scroller._thCount) {
        scroller._jsTouched = false;
        enterJs(t2);
      }
    }
    var sl = scroller.scrollLeft, st = scroller.scrollTop;
    var table = scroller.querySelector('.cmp-table');
    if (!table) return;
    if (scroller._freezeMode === 'js') {
      var ths = table.querySelectorAll('thead th');
      var rths = table.querySelectorAll('tbody th');
      for (var i = 0; i < ths.length; i++) {
        ths[i].style.transform = (i === 0) ? 'translate(' + sl + 'px,' + st + 'px)' : 'translateY(' + st + 'px)';
      }
      for (var j = 0; j < rths.length; j++) rths[j].style.transform = 'translateX(' + sl + 'px)';
      scroller._thCount = ths.length;
    } else if (sl < 6 && st < 6) {
      var th3 = table.querySelectorAll('thead th'), r3 = table.querySelectorAll('tbody th');
      for (var k = 0; k < th3.length; k++) th3[k].style.transform = '';
      for (var m = 0; m < r3.length; m++) r3[m].style.transform = '';
    }
  }

  // 实测：滚过之后左列/表头是否真的钉住了（iOS 上 sticky 常被 transform 破坏）
  function verify() {
    var table = scroller.querySelector('.cmp-table');
    if (!table) return;
    var sl = scroller.scrollLeft, st = scroller.scrollTop;
    var corner = table.querySelector('thead th:first-child');
    var bodyTh = table.querySelector('tbody tr:not(.group-row) th');
    if (!corner) return;
    var cb = corner.getBoundingClientRect(), sb = scroller.getBoundingClientRect();
    var driftX = sl > 6 ? Math.abs(cb.left - sb.left) : 0;
    var driftY = st > 6 ? Math.abs(cb.top - sb.top) : 0;
    var bDriftX = 0;
    if (bodyTh) {
      var bb = bodyTh.getBoundingClientRect();
      bDriftX = sl > 6 ? Math.abs(bb.left - sb.left) : 0;
    }
    if (scroller._freezeMode !== 'js' && (driftX > 4 || driftY > 4 || bDriftX > 4)) {
      enterJs(table);
      paint();
    }
  }

  var raf = 0;
  scroller.addEventListener('scroll', function(){
    if (raf) return;
    raf = requestAnimationFrame(function(){
      raf = 0;
      if (scroller._freezeMode === 'js') paint();
      verify();
    });
  }, { passive: true });

  scroller.addEventListener('touchend', function(){
    setTimeout(function(){ if (scroller._freezeMode === 'js') paint(); verify(); }, 150);
  }, { passive: true });
  scroller._freezePaint = paint;
}
