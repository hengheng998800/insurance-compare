function openCellEditor(pid, key, view) {
  var p = getProduct(pid);
  if (!p) return;
  var fd = findField(p.type, key);
  var label = fd ? fd.label : key;
  var isMulti = !!(fd && fd.multi);
  var cur = valueToText((p.fields || {})[key]);
  var m = document.getElementById('cell-modal');
  if (!m) {
    m = document.createElement('div');
    m.className = 'modal';
    m.id = 'cell-modal';
    document.body.appendChild(m);
  }

  // 多条字段：一行一个框 + ＋增加一条（与产品编辑页一致）
  var bodyHtml;
  if (isMulti) {
    var lines = Array.isArray((p.fields||{})[key]) ? (p.fields||{})[key].slice()
              : (cur ? [cur] : ['']);
    if (!lines.length) lines = [''];
    bodyHtml = '<div id="ce-multi">';
    lines.forEach(function(ln, li){
      bodyHtml += '<div class="ce-mrow">' +
        '<textarea class="finput ce-line" rows="2" style="width:100%;font-size:14px" placeholder="' + esc(li === 0 ? (fd.note || '填写一条描述…') : '再填一条…') + '">' + esc(ln) + '</textarea>' +
        (lines.length > 1 ? '<div class="ce-mdel" data-i="' + li + '">✕</div>' : '') +
      '</div>';
    });
    bodyHtml += '<div id="ce-add" style="font-size:13px;color:#2f6fed;font-weight:600;padding:10px 2px;cursor:pointer;text-align:center;background:#f5f8ff;border-radius:8px;margin-top:6px">＋ 增加一条</div></div>' +
      '<div style="font-size:11.5px;color:#9aa1ab;margin-top:7px;line-height:1.5">每行一条描述，保存后同步到产品库和所有对比视图。</div>';
  } else {
    bodyHtml = '<textarea id="ce-input" class="finput" rows="7" style="width:100%;font-size:14px" placeholder="输入内容…"></textarea>' +
      '<div style="font-size:11.5px;color:#9aa1ab;margin-top:7px;line-height:1.5">保存后自动同步到产品库和所有对比视图。</div>';
  }

  m.innerHTML = '<div class="modal-box">' +
    '<div class="modal-head"><div class="mt">✏️ ' + esc(label) + '<span style="font-weight:400;color:#8a919b;font-size:12px;margin-left:6px">' + esc(p.name) + '</span></div><div class="mc" id="ce-cancel">取消</div></div>' +
    '<div class="modal-body" style="padding:14px 16px">' + bodyHtml + '</div>' +
    '<div class="modal-foot"><button class="btn btn-primary" id="ce-save" style="width:100%">保存</button></div>' +
  '</div>';
  m.classList.add('show');

  var close = function(){ m.classList.remove('show'); };
  m.querySelector('#ce-cancel').addEventListener('click', close);
  m.addEventListener('click', function(e){ if (e.target === m) close(); });

  var collect;
  if (isMulti) {
    var wrap = m.querySelector('#ce-multi');
    // ＋增加一条 / ✕ 删除（事件委托，重复渲染不叠加监听）
    wrap.addEventListener('click', function(ev){
      if (ev.target.id === 'ce-add') {
        var row = document.createElement('div');
        row.className = 'ce-mrow';
        row.innerHTML = '<textarea class="finput ce-line" rows="2" style="width:100%;font-size:14px" placeholder="再填一条…"></textarea>' +
          '<div class="ce-mdel">✕</div>';
        wrap.insertBefore(row, wrap.querySelector('#ce-add'));
        row.querySelector('textarea').focus();
        refreshDelBtns();
      } else if (ev.target.classList.contains('ce-mdel')) {
        var rows = wrap.querySelectorAll('.ce-mrow');
        if (rows.length > 1) ev.target.closest('.ce-mrow').remove();
        else { var t = wrap.querySelector('.ce-line'); if (t) { t.value = ''; t.focus(); } }
        refreshDelBtns();
      }
    });
    function refreshDelBtns(){
      var rows = wrap.querySelectorAll('.ce-mrow');
      rows.forEach(function(r, i){
        var d = r.querySelector('.ce-mdel');
        if (d) d.style.display = rows.length > 1 ? '' : 'none';
      });
    }
    collect = function(){
      var arr = [];
      wrap.querySelectorAll('.ce-line').forEach(function(t){
        var v = t.value.trim();
        if (v !== '') arr.push(v);
      });
      return arr;
    };
    var first = wrap.querySelector('.ce-line');
    setTimeout(function(){ if (first) first.focus(); }, 250);
  } else {
    var input = m.querySelector('#ce-input');
    input.value = cur;
    setTimeout(function(){ input.focus(); }, 250);
    collect = function(){ return input.value; };
  }

  m.querySelector('#ce-save').addEventListener('click', function(){
    var got = collect();
    if (isMulti) {
      if (got.length) p.fields[key] = got; else delete p.fields[key];
    } else {
      var v = String(got).trim();
      if (v !== '') p.fields[key] = v; else delete p.fields[key];
    }
    p.updatedAt = Date.now();
    saveData(appData);
    close();
    rerenderCompareView(view);
    toast('已保存并同步到产品');
  });
}

/* 从当前数据里自动发现所有病种（含 IC 之外的），补进列表 */
function healthAllConds() {
  var seen = {}, out = [];
  HEALTH_CONDS.forEach(function(c){ seen[c.k] = 1; out.push(c); });
  var ps = (appData && Array.isArray(appData.products)) ? appData.products : [];
  ps.forEach(function(p){
    var hs = Array.isArray(p && p.health) ? p.health : [];
    hs.forEach(function(h){
      if (!h || typeof h !== 'object' || !h.cond) return;
      var k = String(h.cond);
      if (seen[k]) return;
      seen[k] = 1;
      out.push({ k:k, ic:'•' });
    });
  });
  return out;
}
var HEALTH_LV = { ok:0, caution:1, block:2 };

function healthData() {
  if (!appData.healthPick) appData.healthPick = { conds:[], free:'' };
  if (!appData.healthPick.conds) appData.healthPick.conds = [];
  if (appData.healthPick.free == null) appData.healthPick.free = '';
  return appData.healthPick;
}

/* 从自由文本里识别病种 */
function healthParseFree(txt) {
  var hit = [], t = String(txt || '');
  if (!t.trim()) return hit;
  Object.keys(HEALTH_KW).forEach(function(k){
    var kws = HEALTH_KW[k];
    for (var i = 0; i < kws.length; i++) {
      if (t.indexOf(kws[i]) >= 0) { hit.push(k); break; }
    }
  });
  return hit;
}

/* 返回某产品对某病种的判定 { level:'ok'|'caution'|'block'|'none', note } */
function healthJudge(p, cond) {
  var hs = p.health || [], best = null;
  for (var i = 0; i < hs.length; i++) {
    var h = hs[i];
    if (!h || typeof h !== 'object' || !h.cond) continue;
    if (String(h.cond).indexOf(cond) >= 0 || cond.indexOf(String(h.cond)) >= 0) {
      if (!best || (HEALTH_LV[h.level] || 0) > (HEALTH_LV[best.level] || 0)) best = h;
    }
  }
  if (!best) return { level:'none', note:'', raw:'' };
  return { level: best.level === 'block' ? 'block' : 'caution', note: best.note || '', raw: best.raw || '' };
}

/* 综合评估一款产品：{ level, items:[{cond,level,note}], hasData } */
function healthEval(p, conds) {
  var hasData = !!((p.health || []).length);
  if (!conds.length) return { level:'na', items:[], hasData:hasData };
  var items = [], level = 'ok';
  conds.forEach(function(c){
    var r = healthJudge(p, c);
    items.push({ cond:c, level:r.level, note:r.note, raw:r.raw || '' });
    if (r.level === 'block') level = 'block';
    else if (r.level === 'caution' && level !== 'block') level = 'caution';
  });
  return { level:level, items:items, hasData:hasData };
}

  /* ---- 结果分档 ---- */

  var buckets = { ok:[], caution:[], block:[], none:[] };

  h += '<div class="hc-note">⚠️ 匹配结果基于已录入的 ' + filled + '/' + ps.length + ' 款产品健康告知数据自动推断，<b>仅供参考</b>。' +
       '实际承保结论以保险公司智能核保 / 人工核保结论为准，投保前请逐条核对告知问卷。</div>';

/* ============================================================
   视图三：打分排序
   ============================================================ */
function renderScore() {
  var box = document.getElementById('page-score');
  var ps = appData.products;
  if (ps.length === 0) {
    box.innerHTML = '<div class="empty"><p>还没有产品</p><div class="hint">添加产品并填写数值型字段后<br>这里会自动算出综合分排名</div></div>';
    return;
  }

  // 类型筛选
  var counts = {};
  ps.forEach(function(p){ counts[p.type] = (counts[p.type]||0)+1; });
  var usedTypes = Object.keys(counts);
  if (state.scoreType && state.scoreType !== 'all' && !counts[state.scoreType]) state.scoreType = 'all';
  if (!state.scoreType) state.scoreType = 'all';

  var fb = '<div class="filter-bar">';
  fb += '<div class="chip' + (state.scoreType==='all'?' active':'') + '" data-t="all">全部</div>';
  usedTypes.forEach(function(t){
    fb += '<div class="chip' + (state.scoreType===t?' active':'') + '" data-t="' + t + '">' + TYPES[t].icon + ' ' + TYPES[t].short + '</div>';
  });
  fb += '</div>';

  var list = ps.filter(function(p){ return state.scoreType === 'all' || p.type === state.scoreType; });
  // 打分字段（取列表里第一个产品的类型作为权重调节对象；混合模式取所有类型并集）
  var scoreTypes = state.scoreType === 'all'
    ? Array.from(new Set(list.map(function(p){ return p.type; })))
    : [state.scoreType];

  var scoreFields = [];
  var sseen = {};
  scoreTypes.forEach(function(t){
    getFields(t).filter(function(f){ return f.score && f.better; }).forEach(function(f){
      if (!sseen[f.key]) { sseen[f.key] = { f:f, types:[t] }; scoreFields.push(sseen[f.key]); }
      else if (sseen[f.key].types.indexOf(t) < 0) sseen[f.key].types.push(t);
    });
  });

  var h = fb + '<div class="score-head">';

  // 权重调节
  if (scoreFields.length > 0) {
    h += '<div class="score-weights"><div class="sw-title">权重设置（0＝不参与，5＝最重要）</div>';
    scoreFields.forEach(function(o){
      var f = o.f;
      var w = getWeight(o.types[0], f.key);
      h += '<div class="sw-row">' +
        '<div class="sw-name">' + esc(f.label) + '</div>' +
        '<input type="range" class="sw-slider" min="0" max="5" step="1" value="' + w + '" data-k="' + f.key + '" data-t="' + o.types[0] + '">' +
        '<div class="sw-val">' + w + '</div>' +
      '</div>';
    });
    h += '</div>';
  }

  // 排名
  var ranked = list.map(function(p){ return { p:p, s: calcScore(p) }; })
    .filter(function(o){ return o.s !== null; })
    .sort(function(a,b){ return b.s - a.s; });

  if (ranked.length === 0) {
    h += '<div class="empty" style="padding:30px 20px"><p>还没有足够的数值字段</p><div class="hint">填写「保费」「保额」等数字字段后<br>就能算出综合分排名</div></div>';
  } else {
    // 各类型颜色
    var colors = ['#2f6fed','#137333','#e8710a','#8430ce','#d93025','#0b8043'];
    ranked.forEach(function(o, i){
      var p = o.p;
      var t = TYPES[p.type] || TYPES.qt;
      var sc = o.s;
      // 分项条
      var bars = '';
      var wsum = 0, ws = [];
      scoreFields.forEach(function(oo){
        var f = oo.f;
        var w = getWeight(oo.types[0], f.key);
        if (w <= 0) return;
        var v = extractNum((p.fields||{})[f.key]);
        if (v === null) return;
        var peers = ps.filter(function(x){ return x.type === p.type; });
        var vals = peers.map(function(x){ return extractNum((x.fields||{})[f.key]); }).filter(function(x){ return x !== null; });
        if (vals.length < 2) return;
        var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
        var r = (mx===mn) ? 1 : (v-mn)/(mx-mn);
        if (f.better === 'low') r = 1-r;
        ws.push({ r:r, w:w });
        wsum += w;
      });
      for (var bi=0; bi<ws.length; bi++){
        bars += '<div class="rank-bar" style="width:' + (ws[bi].w/wsum*100).toFixed(1) + '%;background:' + colors[bi%colors.length] + ';opacity:' + (0.35 + ws[bi].r*0.65).toFixed(2) + '"></div>';
      }

      h += '<div class="rank-item">' +
        '<div class="rank-no">' + (i+1) + '</div>' +
        '<div class="rank-body">' +
          '<div class="rank-name">' + esc(p.name) + '</div>' +
          '<div class="rank-sub">' + t.icon + ' ' + t.short + (p.fields && p.fields.company ? ' · ' + esc(p.fields.company) : '') + '</div>' +
          (bars ? '<div class="rank-bars">' + bars + '</div>' : '') +
        '</div>' +
        '<div class="rank-score">' + sc.toFixed(1) + '</div>' +
      '</div>';
    });
    h += '<div class="cmp-note">综合分 = 各字段在同类型产品中归一化后，按你设的权重加权平均（满分 100）。<br>分数只反映你关心的这几个数值字段，不替代条款阅读。</div>';
  }
  h += '</div>';

  box.innerHTML = h;

  bindTypeChips(box, 'scoreType', renderScore);

  // 权重滑块
  box.querySelectorAll('.sw-slider').forEach(function(el){
    el.addEventListener('input', function(){
      this.parentNode.querySelector('.sw-val').textContent = this.value;
    });
    el.addEventListener('change', function(){
      setWeight(this.dataset.t, this.dataset.k, parseInt(this.value, 10));
      renderScore();
    });
  });
}



/* ============================================================
   智能核保 & 费率匹配（v3.9）
   产品可挂：rates:[{min,max,premium,note}]  health:[{cond,level,note}]
   ============================================================ */
/* 常见健康异常关键词归一化 */
var HEALTH_CANON = [
  { key:'甲状腺结节', alias:['甲结节','甲状腺结节','甲状腺肿'] },
  { key:'乳腺结节',   alias:['乳腺结节','乳房结节','乳腺增生结节'] },
  { key:'肺结节',     alias:['肺结节','肺部结节','磨玻璃结节','磨玻璃影'] },
  { key:'乙肝',       alias:['乙肝','乙肝携带','乙型肝炎','小三阳','大三阳'] },
  { key:'高血压',     alias:['高血压','血压高','血压偏高'] },
  { key:'糖尿病',     alias:['糖尿病','血糖高','血糖偏高'] },
  { key:'尿酸高',     alias:['尿酸高','高尿酸','痛风'] },
  { key:'脂肪肝',     alias:['脂肪肝'] },
  { key:'肾结石',     alias:['肾结石','尿潜血'] },
  { key:'胆囊息肉',   alias:['胆囊息肉','胆息肉'] },
  { key:'胃部疾病',   alias:['胃炎','胃溃疡','胃息肉'] },
  { key:'住院史',     alias:['住院','手术史','动过手术'] }
];
function healthKeysOf(text) {
  var t = (text||''), out = [];
  HEALTH_CANON.forEach(function(c){
    for (var i=0;i<c.alias.length;i++){ if (t.indexOf(c.alias[i])>=0){ out.push(c.key); break; } }
  });
  return out;
}
/* 匹配产品健康规则：返回 {level:'block'|'caution', hits:[{cond,note}]} 或 null */
function healthCheck(product, member) {
  if (!product || !Array.isArray(product.health) || !product.health.length) return null;
  var keys = healthKeysOf(member.health || '');
  if (!keys.length) return null;
  var worst = null, hits = [];
  product.health.forEach(function(r){
    keys.forEach(function(k){
      if ((r.cond||'').indexOf(k) >= 0) {
        hits.push(r);
        var lv = r.level || 'caution';
        if (!worst || (worst === 'caution' && lv === 'block')) worst = lv;
      }
    });
  });
  return hits.length ? { level: worst, hits: hits } : null;
}
/* 按年龄匹配费率 */
function rateFor(product, age, gender, plan) {
  if (!product || !Array.isArray(product.rates) || !product.rates.length) return null;
  age = Number(age); if (!age && age !== 0) return null;
  var best = null, fallback = null;
  for (var i=0;i<product.rates.length;i++){
    var r = product.rates[i];
    var min = (r.min===undefined||r.min===null||r.min==='') ? 0 : Number(r.min);
    var max = (r.max===undefined||r.max===null||r.max==='') ? 200 : Number(r.max);
    if (age < min || age > max) continue;
    if (fallback === null) fallback = r;                       // 第一个年龄段匹配
    if (gender && r.gender && r.gender !== gender) continue;   // 性别不匹配
    if (plan && r.plan && r.plan !== plan) continue;           // 方案不匹配
    if (best === null) best = r;
  }
  return best || fallback;
}

  // 方案下拉：随所选产品重建
  var planSel = document.getElementById('fi-plan');
  function famFillPlans(prodName, keep){
    var prod0 = famProdByName(prodName);
    var plans = [];
    if (prod0 && Array.isArray(prod0.rates)) prod0.rates.forEach(function(r){ if (r.plan && plans.indexOf(r.plan)<0) plans.push(r.plan); });
    planSel.innerHTML = '<option value="">默认</option>';
    var wrap = planSel.parentNode;
    if (plans.length) {
      plans.forEach(function(pl){
        var o = document.createElement('option'); o.value = pl; o.textContent = pl;
        planSel.appendChild(o);

      planSel.value = (keep && plans.indexOf(keep) >= 0) ? keep : '';
      wrap.style.display = '';

  famFillPlans(isEdit ? it.prodName : '', isEdit ? it.plan : '');
  function famUwPreview(name){
    var prod = famProdByName(name);
    var box = document.getElementById('fi-uw');

    } else { box.style.display = 'none'; }
    // 费率自动匹配（性别+方案）
    var planV = document.getElementById('fi-plan') ? document.getElementById('fi-plan').value : '';
    var r = rateFor(prod, mem.age, mem.gender, planV);
    var pre = document.getElementById('fi-premium');
    if (r) {
      pre.value = r.premium;
      var tip = document.getElementById('fi-rate-tip');
      if (!tip) {
        tip = document.createElement('div');
        tip.id = 'fi-rate-tip'; tip.className = 'fam-uw fam-uw-ok';
        pre.parentNode.parentNode.insertBefore(tip, pre.parentNode);
      }
      tip.style.display = 'block';
      tip.innerHTML = '💰 已按 ' + esc(mem.name) + ' ' + (mem.gender?esc(mem.gender)+' ':'') + esc(mem.age) + '岁' + (planV ? ' · ' + esc(planV) : '') + ' 自动填入保费' + (r.note ? '（' + esc(r.note) + '）' : '') + '，可手动修改';
    } else {
      var tip2 = document.getElementById('fi-rate-tip'); if (tip2) tip2.style.display = 'none';
    }
  }
  document.getElementById('fi-pick').onchange = function(){
    var v = this.value; if (v) document.getElementById('fi-name').value = v;
    famFillPlans(v, '');
    famUwPreview(v);
  };
  planSel.onchange = function(){ famUwPreview(document.getElementById('fi-name').value); };
  // 编辑态初始也预检一次
  if (isEdit && it.prodName) famUwPreview(it.prodName);
  document.getElementById('fi-save').onclick = function(){
    var obj = {
      id: isEdit ? it.id : famUid(),
      type: document.getElementById('fi-type').value,
      plan: (function(){ var ps = document.getElementById('fi-plan'); return (ps && ps.value) ? ps.value : (it.plan||''); })(),
      prodName: document.getElementById('fi-name').value.trim(),
      prodNote: document.getElementById('fi-note').value.trim(),
      premium: Number(document.getElementById('fi-premium').value) || 0
    };
    if (!obj.prodName) { toast('请填写产品名称'); return; }
    if (isEdit) mem.items[ii] = obj; else { if (!mem.items) mem.items = []; mem.items.push(obj); }
    saveData(appData);
    close(); renderFam(); toast(isEdit ? '已保存' : '已添加保障');
  };
}

function exportData() {
  var payload = {
    app: 'insurance-compare',
    version: 1,
    exportedAt: new Date().toISOString(),
    products: appData.products,
    weights: appData.weights || {}
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var pad = function(n){ return (n<10?'0':'')+n; };
  a.href = url;
  var hh = pad(d.getHours()), mm = pad(d.getMinutes());
  a.download = '保险对比备份-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) +
               '-' + hh + mm + '-' + appData.products.length + '个产品.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  toast('已导出 ' + appData.products.length + ' 个产品');
}

        '</div>' +
        '<div style="margin-top:12px;font-size:13px;color:#8a919b">' +
          '产品数：<b style="color:#202124">' + appData.products.length + '</b>　已填字段：<b style="color:#202124">' + totalFields + '</b>' +
          (appData.dataTag ? '<br>数据包：<b style="color:#c5221f">' + esc(appData.dataTag) + '</b>' : '') +

  if (__restoreBtn) __restoreBtn.addEventListener('click', function(){
    var bk = appData.lastBackup;
    if (!bk || !bk.products) { toast('没有可恢复的备份'); return; }
    if (!confirm('恢复「' + String(bk.at||'').slice(0,16).replace('T',' ') + '」替换前的本机数据？\n\n当前 ' + appData.products.length + ' 个产品将变回 ' + bk.products.length + ' 个。')) return;
    appData.products = JSON.parse(JSON.stringify(bk.products));
    if (bk.dataTag !== undefined) appData.dataTag = bk.dataTag;
    delete appData.lastBackup;
    saveData(appData);
    m.classList.remove('show');
    renderAll();
    toast('已恢复：' + appData.products.length + ' 个产品');

    __importMode = 'replace';
    m.querySelector('#st-file').click();
  });
  m.querySelector('#st-file').addEventListener('change', function(){
    var file = this.files && this.files[0];
    this.value = '';   // 允许重复选同一个文件
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var d;
      try {
        d = JSON.parse(reader.result);
      } catch(e) {
        toast('文件无法解析，请确认是导出的 JSON 备份');
        return;
      }
      if (!d || !Array.isArray(d.products)) { toast('文件格式不对'); return; }

      if (__importMode === 'replace') {
        // 先备份本机数据（万一替换后想找回手改内容）
        try {
          appData.lastBackup = {
            at: new Date().toISOString(),
            dataTag: appData.dataTag || '',
            products: JSON.parse(JSON.stringify(appData.products))
          };
        } catch(e) {}
        // 找出「新包里没有、但本机有」的产品（你手动添加的），默认保留
        var inNew = {};
        d.products.forEach(function(x){ inNew[x.id] = 1; });
        var mine = appData.products.filter(function(x){ return !inNew[x.id]; });
        var keepMine = true;
        if (mine.length) {
          keepMine = confirm('本机有 ' + mine.length + ' 个产品不在新数据包里：\n\n' +
            mine.slice(0,8).map(function(x){ return '· ' + x.name; }).join('\n') +
            (mine.length > 8 ? '\n... 等' + mine.length + '个' : '') +
            '\n\n【确定】保留这些产品（推荐）\n【取消】连它们一起清掉');
        }
        var restored = d.products.slice();
        if (keepMine && mine.length) restored = restored.concat(mine);
        appData.products = restored;
        appData.dataTag = d.dataTag || d.tag || '';
        if (d.weights) appData.weights = JSON.parse(JSON.stringify(d.weights));
        saveData(appData);
        m.classList.remove('show');
        renderAll();
        toast('已替换：现有 ' + appData.products.length + ' 个产品' + (keepMine && mine.length ? '（保留你自建' + mine.length + '个）' : ''));
        return;
      }

      // 合并预览：按 id 判断新增 / 更新 / 保持不变
      var cur = {};
      appData.products.forEach(function(x){ cur[x.id] = x; });
      var willAdd = 0, willUpdate = 0, willKeep = 0;
      d.products.forEach(function(np){
        var op = cur[np.id];
        if (!op) { willAdd++; }
        else if ((np.updatedAt || 0) > (op.updatedAt || 0)) { willUpdate++; }
        else { willKeep++; }
      });
      var sameName = d.products.filter(function(np){
        return !cur[np.id] && appData.products.some(function(x){ return x.name === np.name; });
      }).length;

      var msg = '备份文件里有 ' + d.products.length + ' 个产品：\n\n' +
                '· 新增 ' + willAdd + ' 个\n' +
                '· 更新 ' + willUpdate + ' 个（备份里的版本更新）\n' +
                '· 保留 ' + willKeep + ' 个（本机版本较新，只补缺失字段，不覆盖你的修改）\n\n' +
                '合并后不会丢失任何一边的数据。确定合并吗？';
      if (sameName > 0) {
        msg += '\n\n提示：其中有 ' + sameName + ' 个产品名称与本机已有产品相同，可能是同一款重复录入，合并后可在列表里删掉多余的那份。';
      }
      if (!confirm(msg)) return;

      // 执行合并：按 id 去重，updatedAt 更新者胜出
      var merged = appData.products.slice();
      var idxById = {};
      merged.forEach(function(x, i){ idxById[x.id] = i; });
      d.products.forEach(function(np){
        var i = idxById[np.id];
        if (i === undefined) {
          merged.push(np);
          idxById[np.id] = merged.length - 1;
        } else if ((np.updatedAt || 0) > (merged[i].updatedAt || 0)) {
          merged[i] = np;
        } else {
          // v3.9.43：本机较新或相同 → 不整条跳过，改为「只补缺」：
          // 备份里有而本机没有的字段补进来，本机已有的一律不覆盖
          var cp = merged[i];
          Object.keys(np).forEach(function(k){
            if (k === 'updatedAt') return;
            if (k === 'fields') {
              cp.fields = cp.fields || {};
              Object.keys(np.fields || {}).forEach(function(fk){
                if (cp.fields[fk] === undefined || cp.fields[fk] === '' ) cp.fields[fk] = np.fields[fk];
              });
            } else if (cp[k] === undefined || cp[k] === '' ||
                (Array.isArray(np[k]) && (!Array.isArray(cp[k]) || cp[k].length === 0))) {
              cp[k] = np[k];
            }
          });
        }
      });
      appData.products = merged;
      // 权重：备份里有而本机没有的键才补进来（不覆盖你已经调好的）
      if (d.weights) {
        if (!appData.weights) appData.weights = {};
        Object.keys(d.weights).forEach(function(k){
          if (appData.weights[k] === undefined) appData.weights[k] = d.weights[k];
        });
      }
      saveData(appData);
      m.classList.remove('show');
      renderAll();
      toast('已合并：新增 ' + willAdd + '，更新 ' + willUpdate + '，共 ' + appData.products.length + ' 个产品');
    };
    reader.readAsText(file);
  });

  m.querySelector('#st-clear').addEventListener('click', function(){
    if (!confirm('确定清空所有产品数据？此操作不可恢复，建议先导出备份。')) return;
    if (!confirm('再次确认：所有产品与条款记录都将被删除。')) return;
    appData = getDefaultData();
    saveData(appData);
    m.classList.remove('show');
    state.detailId = null; state.editingId = null;
    switchPage('list');
    toast('已清空');
  });
}

/* ============================================================
   对比结果分享图：用 canvas 画一张长图，可保存/分享
   ============================================================ */
function shareCompareImage() {
  // 取当前对比表正在比的产品
  var scope = appData.products.filter(function(p){
    return state.tableType === 'all' || p.type === state.tableType;
  });
  var list = scope.filter(function(p){
    return state.tableIds.length === 0 || state.tableIds.indexOf(p.id) >= 0;
  });
  if (list.length < 2) { toast('至少需要 2 个产品才能生成对比图'); return; }

  var ev = evaluateGroup(list);
  var ranked = list.slice().sort(function(a,b){
    return (ev[b.id].score||0) - (ev[a.id].score||0);
  });

  // 画布尺寸
  var W = 750, PAD = 34;
  var titleH = 130;
  var cardH = 150;
  var cardsH = ranked.length * (cardH + 14);
  var footH = 76;
  var H = titleH + cardsH + footH + 20;

  var cv = document.createElement('canvas');
  var scale = 2;
  cv.width = W * scale;
  cv.height = H * scale;
  var g = cv.getContext('2d');
  g.scale(scale, scale);

  // 背景
  g.fillStyle = '#f5f6f8';
  g.fillRect(0, 0, W, H);

  function rr(x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function wrapText(text, maxW, fontSize) {
    var lines = [], cur = '';
    for (var i = 0; i < text.length; i++) {
      var test = cur + text[i];
      if (g.measureText(test).width > maxW && cur) { lines.push(cur); cur = text[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ===== 标题区 =====
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, W, titleH - 18);
  g.fillStyle = '#1a5fd0';
  g.font = 'bold 34px -apple-system,"PingFang SC",sans-serif';
  g.fillText('🏆 保险对比结果', PAD, 58);
  g.fillStyle = '#8a919b';
  g.font = '19px -apple-system,"PingFang SC",sans-serif';
  var ts = new Date();
  var dateStr = ts.getFullYear() + '-' + String(ts.getMonth()+1).padStart(2,'0') + '-' + String(ts.getDate()).padStart(2,'0');
  g.fillText('共 ' + list.length + ' 款产品 · ' + dateStr, PAD, 92);
  g.fillStyle = '#b8bec7';
  g.font = '16px -apple-system,"PingFang SC",sans-serif';
  g.fillText('按条款内容自动评估', PAD, 116);

  // ===== 产品卡片 =====
  var y = titleH;
  ranked.forEach(function(p, ri){
    var e = ev[p.id] || { win:0, lose:0, prosTop:[], consTop:[], winRate:0 };
    var isTop = ri === 0 && e.score > 0;

    // 卡片底
    g.fillStyle = isTop ? '#fffdf5' : '#ffffff';
    rr(PAD - 6, y, W - (PAD - 6) * 2, cardH, 16);
    g.fill();
    if (isTop) {
      g.strokeStyle = '#f0c060';
      g.lineWidth = 2.5;
      rr(PAD - 6, y, W - (PAD - 6) * 2, cardH, 16);
      g.stroke();
    }

    // 名次圆
    var cx = PAD + 22, cy = y + 40;
    var grad = g.createLinearGradient(cx - 18, cy - 18, cx + 18, cy + 18);
    if (ri === 0) { grad.addColorStop(0, '#f5b301'); grad.addColorStop(1, '#e08b00'); }
    else if (ri === 1) { grad.addColorStop(0, '#b8c0cc'); grad.addColorStop(1, '#9aa1ab'); }
    else if (ri === 2) { grad.addColorStop(0, '#d09a6a'); grad.addColorStop(1, '#b57b4a'); }
    else { grad.addColorStop(0, '#d4d8de'); grad.addColorStop(1, '#c2c7ce'); }
    g.fillStyle = grad;
    g.beginPath(); g.arc(cx, cy, 19, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff';
    g.font = 'bold 21px -apple-system,sans-serif';
    g.textAlign = 'center';
    g.fillText(String(ri + 1), cx, cy + 7);
    g.textAlign = 'left';

    // 产品名
    g.fillStyle = '#202124';
    g.font = 'bold 26px -apple-system,"PingFang SC",sans-serif';
    var nameX = cx + 32;
    var nameLines = wrapText(p.name, isTop ? 330 : 420, 26);
    g.fillText(nameLines[0], nameX, cy + 9);

    // 综合最优标
    if (isTop) {
      var bw = g.measureText(nameLines[0]).width;
      var bx = nameX + Math.min(bw, 330) + 12;
      g.fillStyle = '#f5b301';
      rr(bx, cy - 14, 92, 28, 8); g.fill();
      g.fillStyle = '#fff';
      g.font = 'bold 16px -apple-system,"PingFang SC",sans-serif';
      g.fillText('综合最优', bx + 10, cy + 6);
    }

    // 公司名
    var co = (p.fields||{}).company || '';
    if (co) {
      g.fillStyle = '#9aa1ab';
      g.font = '17px -apple-system,"PingFang SC",sans-serif';
      g.fillText(co, nameX, cy + 34);
    }

    // 右侧优/劣
    g.textAlign = 'right';
    g.fillStyle = '#137333';
    g.font = 'bold 32px -apple-system,sans-serif';
    g.fillText(String(e.win), W - PAD - 52, cy + 12);
    g.fillStyle = '#8a919b';
    g.font = '17px -apple-system,"PingFang SC",sans-serif';
    g.fillText('优', W - PAD - 26, cy + 12);
    if (e.lose) {
      g.fillStyle = '#b06a63';
      g.font = '15px -apple-system,"PingFang SC",sans-serif';
      g.fillText(e.lose + ' 劣', W - PAD - 26, cy + 34);
    }
    g.textAlign = 'left';

    // 优势条
    var barY = y + 76, barW = W - PAD * 2 - 4;
    g.fillStyle = '#f1f3f6';
    rr(PAD + 4, barY, barW, 22, 11); g.fill();
    var inner = Math.max(0.04, Math.min(1, e.winRate / 100));
    var bg2 = g.createLinearGradient(PAD, 0, PAD + barW * inner, 0);
    if (ri === 0) { bg2.addColorStop(0, '#6ec48b'); bg2.addColorStop(1, '#34a853'); }
    else { bg2.addColorStop(0, '#b4bcc8'); bg2.addColorStop(1, '#9aa3af'); }
    g.fillStyle = bg2;
    rr(PAD + 4, barY, barW * inner, 22, 11); g.fill();
    g.fillStyle = '#3f4650';
    g.font = 'bold 14px -apple-system,"PingFang SC",sans-serif';
    g.textAlign = 'center';
    g.fillText('优势率 ' + e.winRate + '%', PAD + 4 + barW / 2, barY + 16);
    g.textAlign = 'left';

    // 亮点（最多 2 条）
    var py = y + 112;
    (e.prosTop || []).slice(0, 2).forEach(function(x){
      var txt = '✓ ' + x.label + '：' + x.reason;
      g.fillStyle = '#eef9f1';
      rr(PAD + 4, py - 13, W - PAD * 2 - 8, 26, 7); g.fill();
      g.fillStyle = '#1c7a3e';
      g.font = '16px -apple-system,"PingFang SC",sans-serif';
      var t = txt.length > 30 ? txt.slice(0, 30) + '…' : txt;
      g.fillText(t, PAD + 14, py + 5);
      py += 31;
    });
    if (!e.prosTop || !e.prosTop.length) {
      g.fillStyle = '#9aa1ab';
      g.font = '16px -apple-system,"PingFang SC",sans-serif';
      g.fillText('填写更多条款后自动给出亮点', PAD + 8, py + 4);
    }

    y += cardH + 14;
  });

  // ===== 页脚 =====
  g.fillStyle = '#b8bec7';
  g.font = '15px -apple-system,"PingFang SC",sans-serif';
  g.textAlign = 'center';
  g.fillText('由「保险对比工作台」生成 · 判断仅供参考，条款请自行核实', W / 2, H - 34);
  g.textAlign = 'left';

  // 输出
  cv.toBlob(function(blob){
    if (!blob) { toast('生成失败，请重试'); return; }
    var url = URL.createObjectURL(blob);
    var fname = '保险对比-' + dateStr + '.png';
    showShareSheet(url, fname);
  }, 'image/png');
}

function showShareSheet(url, fname) {
  var m = document.getElementById('share-modal');
  if (!m) {
    m = document.createElement('div');
    m.className = 'modal';
    m.id = 'share-modal';
    document.body.appendChild(m);
  }
  m.innerHTML = '<div class="modal-box">' +
    '<div class="modal-head"><div class="mt">📤 对比结果图</div><div class="mc" id="sh-close">关闭</div></div>' +
    '<div class="modal-body" style="padding:12px 14px 6px;text-align:center">' +
      '<img src="' + url + '" style="width:100%;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)">' +
      '<div style="font-size:11.5px;color:#9aa1ab;margin-top:10px;line-height:1.6">长按图片可保存到相册<br>也可以点下面的按钮直接分享</div>' +
    '</div>' +
    '<div class="modal-foot" style="display:flex;gap:8px">' +
      '<button class="btn btn-ghost" id="sh-download" style="flex:1">保存图片</button>' +
      '<button class="btn btn-primary" id="sh-share" style="flex:1">分享</button>' +
    '</div>' +
  '</div>';
  m.classList.add('show');

  m.querySelector('#sh-close').addEventListener('click', function(){ m.classList.remove('show'); });
  m.addEventListener('click', function(e){ if (e.target === m) m.classList.remove('show'); });

  m.querySelector('#sh-download').addEventListener('click', function(){
    var a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    toast('已保存，可到相册/下载里找');
  });

  m.querySelector('#sh-share').addEventListener('click', function(){
    fetch(url).then(function(r){ return r.blob(); }).then(function(blob){
      var file = new File([blob], fname, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: '保险对比结果' }).catch(function(){});
      } else {
        toast('当前环境不支持直接分享，请长按图片保存');
      }
    }).catch(function(){ toast('请长按图片保存'); });
  });
}

function forceCheckUpdate(btn, msgEl) {
  if (msgEl) { msgEl.textContent = '检查中…'; msgEl.style.color = '#8a919b'; }
  if (btn) btn.disabled = true;
  fetch('index.html?_force=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.text(); })
    .then(function(t){
      var m = t.match(/window\.__BUILD__\s*=\s*"(v[\d.]+)"/);
      var remote = m ? m[1] : '';
      if (remote && remote !== window.__BUILD__) {
        if (msgEl) { msgEl.textContent = '发现 ' + remote + '，正在更新…'; msgEl.style.color = '#1a7f37'; }
        try { sessionStorage.removeItem('__appVerChk'); } catch(e){}
        var go = function(){ location.replace(location.pathname + '?v=' + remote.replace(/[^\d]/g,'') + '&_r=' + Date.now()); };
        var chain = Promise.resolve();
        try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          chain = navigator.serviceWorker.getRegistrations().then(function(rs){
            return Promise.all(rs.map(function(r){ return r.unregister(); }));
          });
        } } catch(e){}
        chain.then(function(){
          if (caches && caches.keys) {
            return caches.keys().then(function(keys){
              return Promise.all(keys.map(function(kk){ return caches.delete(kk); }));
            });
          }
        }).then(go).catch(go);
      } else {
        if (btn) btn.disabled = false;
        if (msgEl) {
          msgEl.textContent = remote ? '已是最新 ' + remote : '取不到版本号（网络异常？）';
          msgEl.style.color = remote ? '#1a7f37' : '#c5221f';
        }
      }
    })
    .catch(function(){
      if (btn) btn.disabled = false;
      if (msgEl) { msgEl.textContent = '网络不通，稍后再试'; msgEl.style.color = '#c5221f'; }
    });
}
