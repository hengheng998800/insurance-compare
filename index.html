    coList.map(function(c){ return '<option value="' + esc(c) + '"' + (state.tableCo===c?' selected':'') + '>' + esc(c) + ' (' + coMap[c] + ')</option>'; }).join('') +
    '</select></span>';
  fb += '<span class="fsel-wrap"><select class="fsel' + (state.tableTier!=='all'?' active':'') + '" id="tier-sel">' +
    '<option value="all">档次：全部</option>' +
    TIERS.map(function(tr){
      var n = allYl.filter(function(p){ return tierOf(p) === tr; }).length;
      return '<option value="' + tr + '"' + (state.tableTier===tr?' selected':'') + '>' + tr + ' (' + n + ')</option>';
    }).join('') +
    (allYl.some(function(p){ return tierOf(p)==='未标注'; }) ? '<option value="未标注"' + (state.tableTier==='未标注'?' selected':'') + '>未标注</option>' : '') +
    '</select></span>';
  fb += '</div>';

  var scope = appData.products.filter(function(p){
    if (state.tableType !== 'all' && p.type !== state.tableType) return false;
    var c = (function(c){return (Array.isArray(c)?c.join(""):String(c||"")).trim();})(((p.fields||{})).company);
    if (state.tableCo !== 'all' && c !== state.tableCo) return false;
    if (state.tableTier !== 'all' && (p.type !== 'yl' || tierOf(p) !== state.tableTier)) return false;
    return true;
  });
  if (scope.length === 0) { box.innerHTML = fb + '<div class="empty"><p>该筛选条件下暂无产品</p></div>'; bindTypeChips(box, 'tableType', renderTable); bindCoTierChips(box); return; }

  // 清理过期的勾选（产品已删除或不在当前类型范围内）
  var scopeIds = {};
  scope.forEach(function(p){ scopeIds[p.id] = true; });
  state.tableIds = state.tableIds.filter(function(id){ return scopeIds[id]; });

  // ===== 产品勾选条（按产品系列分组，组内按年份从旧到新；超过 6 个折叠）=====
  var G_CLS = [
    {c:'#b25e00',bg:'#fff3e0'},{c:'#1a56b0',bg:'#e8f0fe'},{c:'#7a2fbf',bg:'#f3e8fd'},
    {c:'#137333',bg:'#e6f4ea'},{c:'#c5221f',bg:'#fce8e6'},{c:'#5f6368',bg:'#f1f3f6'}
  ];
  function seriesOf(name){
    var m = name.match(/(众民保|尊享e生|明爱安保|欣生人生|星相守|心相守|好医保|蓝医保|长相安|医安心|e享保|臻选|中高端|百万医疗)/);
    if (m) return m[1];
    var s = name.replace(/（[^）]*）|\([^)]*\)/g, '').replace(/20\d{2}[\s\S]*$/, '').replace(/[（(].*/, '').trim();
    return s || name;
  }
  // 公司配色：每个公司固定一组颜色（组头深色，产品浅色）
  var coColors = {}, coCi = 0;
  scope.forEach(function(p){
    var c = (function(c){return (Array.isArray(c)?c.join(""):String(c||"")).trim();})(((p.fields||{})).company);
    if (c && !coColors[c]) coColors[c] = G_CLS[coCi++ % G_CLS.length];
  });
  var gOrder = [], gMap = {};
  scope.forEach(function(p){
    var s = seriesOf(p.name);
    if (!gMap[s]) { gMap[s] = []; gOrder.push(s); }
    gMap[s].push(p);
  });
  gOrder.forEach(function(s){
    gMap[s].sort(function(a, b){
      var ya = (a.name.match(/20\d{2}/) || [9999])[0] * 1;
      var yb = (b.name.match(/20\d{2}/) || [9999])[0] * 1;
      if (ya !== yb) return ya - yb;
      return a.name.length - b.name.length || a.name.localeCompare(b.name, 'zh');
    });
  });
  var pillHtml = '';
  gOrder.forEach(function(s){
    var cc = coColors[((gMap[s][0].fields||{}).company||'').trim()] || G_CLS[G_CLS.length-1];
    var pills = '';
    gMap[s].forEach(function(p){
      var on = state.tableIds.indexOf(p.id) >= 0;
      pills += '<div class="sel-pill' + (on ? ' on' : '') + '"' + (on ? '' : ' style="background:' + cc.bg + ';color:' + cc.c + '"') + ' data-sel="' + esc(p.id) + '">' +
              (on ? '✓ ' : '') + esc(p.name) + '</div>';
    });
    if (gOrder.length > 1) {
      pillHtml += '<div class="sel-gwrap"><div class="sel-group" style="background:' + cc.c + ';color:#fff">' + esc(s) + '</div>' +
                  '<div class="sel-gpills">' + pills + '</div></div>';
    } else {
      pillHtml += pills;
    }
  });
  var needFold = scope.length > 6;
  fb += '<div class="sel-bar"><div class="sel-head">' +
          '<span class="sel-t">勾选要对比的产品</span>' +
          '<span class="sel-n">' + (state.tableIds.length ? '已选 ' + state.tableIds.length + ' 个' : '未勾选，先选 ' + scope.length + ' 个里的几个') + '</span>' +
          (state.tableIds.length ? '<span class="sel-clear" id="sel-clear">清空</span>' : '') +
        '</div><div class="sel-pills' + (needFold ? ' collapsed' : '') + '">' +
          pillHtml +
        '</div>' +
        (needFold ? '<div class="sel-more" id="sel-more">展开全部 ' + scope.length + ' 个 ▾</div>' : '') +
        '</div>';

  // 勾选过滤：勾了哪些就只对比哪些（未勾选 = 不显示，等待选择）
  var list = scope.filter(function(p){
    return state.tableIds.indexOf(p.id) >= 0;
  });
  if (state.tableIds.length === 0) {
    box.innerHTML = fb + '<div class="empty"><p>👆 在上方勾选想对比的产品</p><div class="hint">勾选几个，下面就会显示它们的对比表</div></div>';
    bindTypeChips(box, 'tableType', renderTable);
    bindCoTierChips(box);
    bindSelPills(box);
    return;
  }
  if (list.length === 0) {
    box.innerHTML = fb + '<div class="empty"><p>勾选的产品都不在当前类型里</p><div class="hint">点上面的「清空」重新选择</div></div>';
    bindTypeChips(box, 'tableType', renderTable);
    bindCoTierChips(box);
    bindSelPills(box);
    return;
  }

  // 字段：全部类型统一显示（不同字段用「—」）
  var isMixed = state.tableType === 'all';
  var fields;
  if (isMixed) {
    // 混合模式：用所有出现过的字段并集，按通用优先排序
    var kmap = {}, ordered = [];
    list.forEach(function(p){
      getFields(p.type).forEach(function(fd){
        var k = fd.key;
        if (!kmap[k]) { kmap[k] = fd; ordered.push(k); }
      });
    });
    fields = ordered.map(function(k){ return kmap[k]; });
  } else {
    fields = getFields(state.tableType);
  }
  // 只显示至少一个产品填过的字段
  fields = fields.filter(function(fd){
    return list.some(function(p){
      var ff = p.fields || {};
      return !valueEmpty(ff[fd.key]);
    });
  });

  var topId = null;
  // ===== 表格（v3.3：优势榜已按需求移除，只看勾选的产品）=====
  var h = fb;

  // 表头
  h += '<div class="cmp-wrap"><div class="cmp-scroll"><table class="cmp-table"><thead><tr><th style="min-width:76px;max-width:88px">产品名称 <span style="color:#c0c5cc">→</span></th>';
  list.forEach(function(p){
    var t = TYPES[p.type] || TYPES.qt;
    h += '<th data-p="' + esc(p.id) + '" style="cursor:pointer"' + (p.id === topId ? ' class="top-col"' : '') + '>' + esc(p.name) + '<span class="hsub">' + esc((p.fields||{}).company || t.short) + '</span></th>';
  });
  h += '</tr></thead><tbody>';

  // 表体（按大组分段：一、投保规则 / 二、必选责任 / …）
  var lastGroup = null;
  fields.forEach(function(fd){
    var g = fd.group || '其他';
    if (g !== lastGroup) {
      // 统计该组内已填字段数
      var cnt = 0;
      fields.forEach(function(x){ if ((x.group||'其他') === g) cnt++; });
      h += '<tr class="group-row"><th colspan="' + (list.length + 1) + '">' + esc(g) + '<span class="gcnt">' + cnt + ' 项</span></th></tr>';
      lastGroup = g;
    }
    var vals = list.map(function(p){
      return valueToText((p.fields||{})[fd.key]);
    });
    // 差异判断：值不全相同
    var filledVals = vals.filter(function(v){ return v !== ''; });
    var isDiff = new Set(filledVals).size > 1;

    // 用语义引擎判断本行谁优谁劣
    var rowJudge = judgeField(fd, list.map(function(p, i){ return { id: p.id, txt: vals[i] }; }));

  h += '<tr><th>' + esc(fd.label) + '</th>';
  vals.forEach(function(v, i){
    var raw = (list[i].fields || {})[fd.key];
    var j = rowJudge[list[i].id] || { level:0, reason:'' };
    var cls = '';
    if (isDiff) cls = 'diff';
    if (j.level > 0) cls += ' adv';
    else if (j.level < 0) cls += ' dis';
    var show = v === '' ? '<span style="color:#c0c5cc">—</span>' : cellHtml(raw);
    var tag = j.level > 0 ? '<span class="adv-mark" title="' + esc(j.reason) + '">优</span>'
            : (j.level < 0 ? '<span class="dis-mark">弱</span>' : '');
    // 优势理由：仅在该行唯一优势时显示，避免刷屏
    var advCount = Object.keys(rowJudge).filter(function(k){ return rowJudge[k].level > 0; }).length;
    var reason = (j.level > 0 && advCount === 1 && j.reason) ? '<span class="adv-reason">' + esc(j.reason) + '</span>' : '';
    h += '<td class="' + cls + '" data-p="' + esc(list[i].id) + '" data-k="' + esc(fd.key) + '">' + show + tag + reason + '</td>';
  });
  h += '</tr>';
});

  h += '</tbody></table></div>';
  h += '<div class="cmp-note">🟢 优＝该项条款更有利　🔴 弱＝相对不利　淡黄＝各产品有差异<br>✏️ 点击任意单元格可直接修改；点产品名进完整编辑页。</div>';
  h += '</div>';

  box.innerHTML = h;
  bindTypeChips(box, 'tableType', renderTable);
  bindCoTierChips(box);
  bindSelPills(box);
  initFreezeFix(box.querySelector('.cmp-scroll'));
  bindCellEdit(box, 'table');
}

/* 产品勾选条：点 pill 切换勾选，点清空恢复全部 */
function bindSelPills(box) {
  if (!box || box._selPillsBound) return;
  box._selPillsBound = true;
  box.addEventListener('click', function(ev){
    var clr = ev.target.closest('#sel-clear');
    if (clr) { state.tableIds = []; renderTable(); toast('已恢复全部'); return; }
    var more = ev.target.closest('#sel-more');
    if (more) {
      var pills = box.querySelector('.sel-pills');
      var folded = pills.classList.toggle('collapsed');
      more.textContent = folded ? ('展开全部 ' + pills.children.length + ' 个 ▾') : '收起 ▴';
      return;
    }
    var pill = ev.target.closest('.sel-pill');
    if (!pill) return;
    var id = pill.dataset.sel;
    var i = state.tableIds.indexOf(id);
    if (i >= 0) {
      state.tableIds.splice(i, 1);
    } else {
      state.tableIds.push(id);
      if (state.tableIds.length === 1) {
        toast('已按勾选过滤，再点几个一起对比');
      }
    }
    renderTable();
  });
}

/* iOS Safari 上表格内 sticky 偶发失效的兜底：
   首次滚动时实测左上角有没有钉住；若失效，改用 transform 补偿把表头/左列/角落拉回原位 */
function initFreezeFix(scroller) {
  if (!scroller || scroller._freezeInit) return;
  scroller._freezeInit = true;
  scroller._freezeMode = 'auto';
  scroller._jsTouched = false;

  // 进入 JS 补偿模式：先把 sticky 降级为 static（每个表头只做一次）
  function enterJs(table) {
    if (scroller._jsTouched) return;
    scroller._jsTouched = true;
    scroller._freezeMode = 'js';
    var all = table.querySelectorAll('thead th, tbody th');
    for (var i = 0; i < all.length; i++) {
      all[i].style.position = 'static';
    }
  }

  function paint() {
    if (scroller._jsTouched) {
      // 表格被重新渲染过（表头数量变化）→ 重新标记
      var t2 = scroller.querySelector('.cmp-table');
      if (t2 && t2.querySelectorAll('thead th').length !== scroller._thCount) {
        scroller._jsTouched = false;
        enterJs(t2);
      }
    }
    var sl = scroller.scrollLeft, st = scroller.scrollTop;
    var table = scroller.querySelector('.cmp-table');
    if (!table) return;
    if (scroller._freezeMode === 'js') {
      var ths = table.querySelectorAll('thead th');
      var rths = table.querySelectorAll('tbody th');
      for (var i = 0; i < ths.length; i++) {
        ths[i].style.transform = (i === 0) ? 'translate(' + sl + 'px,' + st + 'px)' : 'translateY(' + st + 'px)';
      }
      for (var j = 0; j < rths.length; j++) rths[j].style.transform = 'translateX(' + sl + 'px)';
      scroller._thCount = ths.length;
    } else if (sl < 6 && st < 6) {
      var th3 = table.querySelectorAll('thead th'), r3 = table.querySelectorAll('tbody th');
      for (var k = 0; k < th3.length; k++) th3[k].style.transform = '';
      for (var m = 0; m < r3.length; m++) r3[m].style.transform = '';
    }
  }

  // 实测：滚过之后左列/表头是否真的钉住了（iOS 上 sticky 常被 transform 破坏）
  function verify() {
    var table = scroller.querySelector('.cmp-table');
    if (!table) return;
    var sl = scroller.scrollLeft, st = scroller.scrollTop;
    var corner = table.querySelector('thead th:first-child');
    var bodyTh = table.querySelector('tbody tr:not(.group-row) th');
    if (!corner) return;
    var cb = corner.getBoundingClientRect(), sb = scroller.getBoundingClientRect();
    var driftX = sl > 6 ? Math.abs(cb.left - sb.left) : 0;
    var driftY = st > 6 ? Math.abs(cb.top - sb.top) : 0;
    var bDriftX = 0;
    if (bodyTh) {
      var bb = bodyTh.getBoundingClientRect();
      bDriftX = sl > 6 ? Math.abs(bb.left - sb.left) : 0;
    }
    if (scroller._freezeMode !== 'js' && (driftX > 4 || driftY > 4 || bDriftX > 4)) {
      enterJs(table);
      paint();
    }
  }

  var raf = 0;
  scroller.addEventListener('scroll', function(){
    if (raf) return;
    raf = requestAnimationFrame(function(){
      raf = 0;
      if (scroller._freezeMode === 'js') paint();
      verify();
    });
  }, { passive: true });

  scroller.addEventListener('touchend', function(){
    setTimeout(function(){ if (scroller._freezeMode === 'js') paint(); verify(); }, 150);
  }, { passive: true });
  scroller._freezePaint = paint;
}

/* 对比视图内直接编辑：点单元格弹出底部编辑框，保存后同步回产品数据 */
function bindCellEdit(box, view) {
  if (!box || box._cellEditBound) return;
  box._cellEditBound = true;
  box.addEventListener('click', function(ev){
    var th = ev.target.closest('thead th[data-p]');
    if (th) { state.editingId = th.dataset.p; switchPage('edit'); return; }
    var cell = ev.target.closest('td[data-p], .duo-cell[data-p]');
    if (cell && cell.dataset.k) openCellEditor(cell.dataset.p, cell.dataset.k, view);
  });
}

function rerenderCompareView(view) {
  if (view === 'table') {
    var sc = document.querySelector('.cmp-scroll');
    var sl = sc ? sc.scrollLeft : 0, st = sc ? sc.scrollTop : 0;
    renderTable();
    var sc2 = document.querySelector('.cmp-scroll');
    if (sc2) { sc2.scrollLeft = sl; sc2.scrollTop = st; }
  } else {
    renderDuo();
  }
}

function openCellEditor(pid, key, view) {
  var p = getProduct(pid);
  if (!p) return;
  var fd = findField(p.type, key);
  var label = fd ? fd.label : key;
  var isMulti = !!(fd && fd.multi);
  var cur = valueToText((p.fields || {})[key]);
  var m = document.getElementById('cell-modal');
  if (!m) {
    m = document.createElement('div');
    m.className = 'modal';
    m.id = 'cell-modal';
    document.body.appendChild(m);
  }

  // 多条字段：一行一个框 + ＋增加一条（与产品编辑页一致）
  var bodyHtml;
  if (isMulti) {
    var lines = Array.isArray((p.fields||{})[key]) ? (p.fields||{})[key].slice()
              : (cur ? [cur] : ['']);
    if (!lines.length) lines = [''];
    bodyHtml = '<div id="ce-multi">';
    lines.forEach(function(ln, li){
      bodyHtml += '<div class="ce-mrow">' +
        '<textarea class="finput ce-line" rows="2" style="width:100%;font-size:14px" placeholder="' + esc(li === 0 ? (fd.note || '填写一条描述…') : '再填一条…') + '">' + esc(ln) + '</textarea>' +
        (lines.length > 1 ? '<div class="ce-mdel" data-i="' + li + '">✕</div>' : '') +
      '</div>';
    });
    bodyHtml += '<div id="ce-add" style="font-size:13px;color:#2f6fed;font-weight:600;padding:10px 2px;cursor:pointer;text-align:center;background:#f5f8ff;border-radius:8px;margin-top:6px">＋ 增加一条</div></div>' +
      '<div style="font-size:11.5px;color:#9aa1ab;margin-top:7px;line-height:1.5">每行一条描述，保存后同步到产品库和所有对比视图。</div>';
  } else {
    bodyHtml = '<textarea id="ce-input" class="finput" rows="7" style="width:100%;font-size:14px" placeholder="输入内容…"></textarea>' +
      '<div style="font-size:11.5px;color:#9aa1ab;margin-top:7px;line-height:1.5">保存后自动同步到产品库和所有对比视图。</div>';
  }

  m.innerHTML = '<div class="modal-box">' +
    '<div class="modal-head"><div class="mt">✏️ ' + esc(label) + '<span style="font-weight:400;color:#8a919b;font-size:12px;margin-left:6px">' + esc(p.name) + '</span></div><div class="mc" id="ce-cancel">取消</div></div>' +
    '<div class="modal-body" style="padding:14px 16px">' + bodyHtml + '</div>' +
    '<div class="modal-foot"><button class="btn btn-primary" id="ce-save" style="width:100%">保存</button></div>' +
  '</div>';
  m.classList.add('show');

  var close = function(){ m.classList.remove('show'); };
  m.querySelector('#ce-cancel').addEventListener('click', close);
  m.addEventListener('click', function(e){ if (e.target === m) close(); });

  var collect;
  if (isMulti) {
    var wrap = m.querySelector('#ce-multi');
    // ＋增加一条 / ✕ 删除（事件委托，重复渲染不叠加监听）
    wrap.addEventListener('click', function(ev){
      if (ev.target.id === 'ce-add') {
        var row = document.createElement('div');
        row.className = 'ce-mrow';
        row.innerHTML = '<textarea class="finput ce-line" rows="2" style="width:100%;font-size:14px" placeholder="再填一条…"></textarea>' +
          '<div class="ce-mdel">✕</div>';
        wrap.insertBefore(row, wrap.querySelector('#ce-add'));
        row.querySelector('textarea').focus();
        refreshDelBtns();
      } else if (ev.target.classList.contains('ce-mdel')) {
        var rows = wrap.querySelectorAll('.ce-mrow');
        if (rows.length > 1) ev.target.closest('.ce-mrow').remove();
        else { var t = wrap.querySelector('.ce-line'); if (t) { t.value = ''; t.focus(); } }
        refreshDelBtns();
      }
    });
    function refreshDelBtns(){
      var rows = wrap.querySelectorAll('.ce-mrow');
      rows.forEach(function(r, i){
        var d = r.querySelector('.ce-mdel');
        if (d) d.style.display = rows.length > 1 ? '' : 'none';
      });
    }
    collect = function(){
      var arr = [];
      wrap.querySelectorAll('.ce-line').forEach(function(t){
        var v = t.value.trim();
        if (v !== '') arr.push(v);
      });
      return arr;
    };
    var first = wrap.querySelector('.ce-line');
    setTimeout(function(){ if (first) first.focus(); }, 250);
  } else {
    var input = m.querySelector('#ce-input');
    input.value = cur;
    setTimeout(function(){ input.focus(); }, 250);
    collect = function(){ return input.value; };
  }

  m.querySelector('#ce-save').addEventListener('click', function(){
    var got = collect();
    if (isMulti) {
      if (got.length) p.fields[key] = got; else delete p.fields[key];
    } else {
      var v = String(got).trim();
      if (v !== '') p.fields[key] = v; else delete p.fields[key];
    }
    p.updatedAt = Date.now();
    saveData(appData);
    close();
    rerenderCompareView(view);
    toast('已保存并同步到产品');
  });
}

function bindTypeChips(box, stateKey, rerender) {

    el.addEventListener('click', function(){
      state[stateKey] = this.dataset.t;
      rerender();
    });
  });
}

/* ============================================================
   视图二：两两对比
   ============================================================ */
function renderDuo() {
  var box = document.getElementById('page-duo');
  var ps = appData.products;
  if (ps.length < 2) {
    box.innerHTML = '<div class="empty"><p>至少需要两个产品</p><div class="hint">两两对比是拿两个产品逐条对照<br>先去添加第二个产品吧</div></div>';
    return;
  }
  // 默认选前两个
  if (!state.duoA || !getProduct(state.duoA)) state.duoA = ps[0].id;
  if (!state.duoB || !getProduct(state.duoB)) state.duoB = ps[1] ? ps[1].id : ps[0].id;
  if (state.duoA === state.duoB && ps.length > 1) {
    state.duoB = ps.filter(function(x){ return x.id !== state.duoA; })[0].id;
  }

  var A = getProduct(state.duoA), B = getProduct(state.duoB);

  function optHtml(sel) {
    return ps.map(function(p){
      var t = TYPES[p.type] || TYPES.qt;
      return '<option value="' + p.id + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.name) + '（' + t.short + '）</option>';
    }).join('');
  }

  var h = '<div class="duo-select">' +
    '<select id="duo-a">' + optHtml(state.duoA) + '</select>' +
    '<select id="duo-b">' + optHtml(state.duoB) + '</select>' +
  '</div>';

  // 顶部胜负小结
  var duoEval = evaluateGroup([A, B]);
  var ea = duoEval[A.id] || { win:0, lose:0, prosTop:[], consTop:[] };
  var eb = duoEval[B.id] || { win:0, lose:0, prosTop:[], consTop:[] };
  var leadA = ea.win - eb.win;
  var leadTxt = leadA > 0 ? ('A「' + A.name + '」领先 ' + leadA + ' 项')
              : (leadA < 0 ? ('B「' + B.name + '」领先 ' + (-leadA) + ' 项') : '两者各有优势，不相上下');
  h += '<div class="duo-summary">' +
    '<div class="ds-title">📊 ' + esc(leadTxt) + '</div>' +
    '<div class="ds-cols">' +
      '<div class="ds-col"><span class="ds-who">A</span>' + esc(A.name) +
        '<div class="ds-num"><b>' + ea.win + '</b> 项优势 / ' + ea.lose + ' 项劣势</div>' +
        (ea.prosTop[0] ? '<div class="ds-hl">✓ ' + esc(ea.prosTop[0].label) + '</div>' : '') + '</div>' +
      '<div class="ds-col"><span class="ds-who">B</span>' + esc(B.name) +
        '<div class="ds-num"><b>' + eb.win + '</b> 项优势 / ' + eb.lose + ' 项劣势</div>' +
        (eb.prosTop[0] ? '<div class="ds-hl">✓ ' + esc(eb.prosTop[0].label) + '</div>' : '') + '</div>' +
    '</div>' +
  '</div>';

  // 字段并集（A 与 B 类型可能不同）
  var kmap = {}, ordered = [];
  [A, B].forEach(function(p){
    getFields(p.type).forEach(function(fd){
      if (!kmap[fd.key]) { kmap[fd.key] = fd; ordered.push(fd.key); }
    });
  });
  var fields = ordered.map(function(k){ return kmap[k]; }).filter(function(fd){
    return !valueEmpty((A.fields||{})[fd.key]) || !valueEmpty((B.fields||{})[fd.key]);
  });

  // 差异统计
  var diffCount = 0;
  h += '<div class="duo-list">';
  var lastDuoGroup = null;
  fields.forEach(function(fd){
    // 分组标题（一、投保规则 / 二、必选责任 / …）
    var dg = fd.group || '其他';
    if (dg !== lastDuoGroup) {
      h += '<div class="duo-group">' + esc(dg) + '</div>';
      lastDuoGroup = dg;
    }
    var va = (A.fields||{})[fd.key], vb = (B.fields||{})[fd.key];
    var sa = valueToText(va);
    var sb = valueToText(vb);
    var same = sa === sb;

    // 优劣判断：走语义引擎
    var onlyA = false, onlyB = false;
    if (sa !== '' && sb === '') { onlyA = true; diffCount++; }
    else if (sb !== '' && sa === '') { onlyB = true; diffCount++; }
    else if (!same) diffCount++;

    var dj = judgeField(fd, [{ id: A.id, txt: sa }, { id: B.id, txt: sb }]);
    var ja = dj[A.id] || { level:0, reason:'' }, jb = dj[B.id] || { level:0, reason:'' };
    var winA = ja.level > 0, winB = jb.level > 0;

    var cA = 'duo-cell' + (winA ? ' win' : (winB ? ' lose' : (same ? ' same' : '')));
    var cB = 'duo-cell' + (winB ? ' win' : (winA ? ' lose' : (same ? ' same' : '')));
    var tagA = winA ? '<span class="adv-mark">优</span>' : (jb.level > 0 ? '<span class="dis-mark">弱</span>' : '');
    var tagB = winB ? '<span class="adv-mark">优</span>' : (ja.level > 0 ? '<span class="dis-mark">弱</span>' : '');
    var rsA = (winA && ja.reason) ? '<span class="adv-reason">' + esc(ja.reason) + '</span>' : '';
    var rsB = (winB && jb.reason) ? '<span class="adv-reason">' + esc(jb.reason) + '</span>' : '';

    var rowDiff = (!same) || onlyA || onlyB;
    h += '<div class="duo-row' + (rowDiff ? ' has-diff' : '') + '">' +
      '<div class="duo-label">' + esc(fd.label) + (rowDiff ? '<span class="diff-tag">异</span>' : '') + '</div>' +
      '<div class="duo-cells">' +
        '<div class="' + cA + '" data-p="' + esc(A.id) + '" data-k="' + esc(fd.key) + '">' + (sa === '' ? '<span style="color:#c0c5cc">未填（点这里填写）</span>' : cellHtml(va)) + (onlyA ? '<span class="duo-only">仅A</span>' : '') + tagA + rsA + '</div>' +
        '<div class="' + cB + '" data-p="' + esc(B.id) + '" data-k="' + esc(fd.key) + '">' + (sb === '' ? '<span style="color:#c0c5cc">未填（点这里填写）</span>' : cellHtml(vb)) + (onlyB ? '<span class="duo-only">仅B</span>' : '') + tagB + rsB + '</div>' +
      '</div>' +
    '</div>';
  });
  h += '</div>';
  h += '<div class="cmp-note">共 ' + fields.length + ' 项可比字段，其中 ' + diffCount + ' 项存在差异。<br>绿色＝该项更优；✏️ 点击任意格子可直接修改并保存。</div>';

  box.innerHTML = h;

  document.getElementById('duo-a').addEventListener('change', function(){
    state.duoA = this.value;
    renderDuo();
  });
  document.getElementById('duo-b').addEventListener('change', function(){
    state.duoB = this.value;
    renderDuo();
  });
  bindCellEdit(box, 'duo');
}

/* ============================================================
   视图三：打分排序
   ============================================================ */
function renderScore() {
  var box = document.getElementById('page-score');
  var ps = appData.products;
  if (ps.length === 0) {
    box.innerHTML = '<div class="empty"><p>还没有产品</p><div class="hint">添加产品并填写数值型字段后<br>这里会自动算出综合分排名</div></div>';
    return;
  }

  // 类型筛选
  var counts = {};
  ps.forEach(function(p){ counts[p.type] = (counts[p.type]||0)+1; });
  var usedTypes = Object.keys(counts);
  if (state.scoreType && state.scoreType !== 'all' && !counts[state.scoreType]) state.scoreType = 'all';
  if (!state.scoreType) state.scoreType = 'all';

  var fb = '<div class="filter-bar">';
  fb += '<div class="chip' + (state.scoreType==='all'?' active':'') + '" data-t="all">全部</div>';
  usedTypes.forEach(function(t){
    fb += '<div class="chip' + (state.scoreType===t?' active':'') + '" data-t="' + t + '">' + TYPES[t].icon + ' ' + TYPES[t].short + '</div>';
  });
  fb += '</div>';

  var list = ps.filter(function(p){ return state.scoreType === 'all' || p.type === state.scoreType; });
  // 打分字段（取列表里第一个产品的类型作为权重调节对象；混合模式取所有类型并集）
  var scoreTypes = state.scoreType === 'all'
    ? Array.from(new Set(list.map(function(p){ return p.type; })))
    : [state.scoreType];

  var scoreFields = [];
  var sseen = {};
  scoreTypes.forEach(function(t){
    getFields(t).filter(function(f){ return f.score && f.better; }).forEach(function(f){
      if (!sseen[f.key]) { sseen[f.key] = { f:f, types:[t] }; scoreFields.push(sseen[f.key]); }
      else if (sseen[f.key].types.indexOf(t) < 0) sseen[f.key].types.push(t);
    });
  });

  var h = fb + '<div class="score-head">';

  // 权重调节
  if (scoreFields.length > 0) {
    h += '<div class="score-weights"><div class="sw-title">权重设置（0＝不参与，5＝最重要）</div>';
    scoreFields.forEach(function(o){
      var f = o.f;
      var w = getWeight(o.types[0], f.key);
      h += '<div class="sw-row">' +
        '<div class="sw-name">' + esc(f.label) + '</div>' +
        '<input type="range" class="sw-slider" min="0" max="5" step="1" value="' + w + '" data-k="' + f.key + '" data-t="' + o.types[0] + '">' +
        '<div class="sw-val">' + w + '</div>' +
      '</div>';
    });
    h += '</div>';
  }

  // 排名
  var ranked = list.map(function(p){ return { p:p, s: calcScore(p) }; })
    .filter(function(o){ return o.s !== null; })
    .sort(function(a,b){ return b.s - a.s; });

  if (ranked.length === 0) {
    h += '<div class="empty" style="padding:30px 20px"><p>还没有足够的数值字段</p><div class="hint">填写「保费」「保额」等数字字段后<br>就能算出综合分排名</div></div>';
  } else {
    // 各类型颜色
    var colors = ['#2f6fed','#137333','#e8710a','#8430ce','#d93025','#0b8043'];
    ranked.forEach(function(o, i){
      var p = o.p;
      var t = TYPES[p.type] || TYPES.qt;
      var sc = o.s;
      // 分项条
      var bars = '';
      var wsum = 0, ws = [];
      scoreFields.forEach(function(oo){
        var f = oo.f;
        var w = getWeight(oo.types[0], f.key);
        if (w <= 0) return;
        var v = extractNum((p.fields||{})[f.key]);
        if (v === null) return;
        var peers = ps.filter(function(x){ return x.type === p.type; });
        var vals = peers.map(function(x){ return extractNum((x.fields||{})[f.key]); }).filter(function(x){ return x !== null; });
        if (vals.length < 2) return;
        var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
        var r = (mx===mn) ? 1 : (v-mn)/(mx-mn);
        if (f.better === 'low') r = 1-r;
        ws.push({ r:r, w:w });
        wsum += w;
      });
      for (var bi=0; bi<ws.length; bi++){
        bars += '<div class="rank-bar" style="width:' + (ws[bi].w/wsum*100).toFixed(1) + '%;background:' + colors[bi%colors.length] + ';opacity:' + (0.35 + ws[bi].r*0.65).toFixed(2) + '"></div>';
      }

      h += '<div class="rank-item">' +
        '<div class="rank-no">' + (i+1) + '</div>' +
        '<div class="rank-body">' +
          '<div class="rank-name">' + esc(p.name) + '</div>' +
          '<div class="rank-sub">' + t.icon + ' ' + t.short + (p.fields && p.fields.company ? ' · ' + esc(p.fields.company) : '') + '</div>' +
          (bars ? '<div class="rank-bars">' + bars + '</div>' : '') +
        '</div>' +
        '<div class="rank-score">' + sc.toFixed(1) + '</div>' +
      '</div>';
    });
    h += '<div class="cmp-note">综合分 = 各字段在同类型产品中归一化后，按你设的权重加权平均（满分 100）。<br>分数只反映你关心的这几个数值字段，不替代条款阅读。</div>';
  }
  h += '</div>';

  box.innerHTML = h;

  bindTypeChips(box, 'scoreType', renderScore);

  // 权重滑块
  box.querySelectorAll('.sw-slider').forEach(function(el){
    el.addEventListener('input', function(){
      this.parentNode.querySelector('.sw-val').textContent = this.value;
    });
    el.addEventListener('change', function(){
      setWeight(this.dataset.t, this.dataset.k, parseInt(this.value, 10));
      renderScore();
    });
  });
}



/* ============================================================
   智能核保 & 费率匹配（v3.9）
   产品可挂：rates:[{min,max,premium,note}]  health:[{cond,level,note}]
   ============================================================ */
/* 常见健康异常关键词归一化 */
var HEALTH_CANON = [
  { key:'甲状腺结节', alias:['甲结节','甲状腺结节','甲状腺肿'] },
  { key:'乳腺结节',   alias:['乳腺结节','乳房结节','乳腺增生结节'] },
  { key:'肺结节',     alias:['肺结节','肺部结节','磨玻璃结节','磨玻璃影'] },
  { key:'乙肝',       alias:['乙肝','乙肝携带','乙型肝炎','小三阳','大三阳'] },
  { key:'高血压',     alias:['高血压','血压高','血压偏高'] },
  { key:'糖尿病',     alias:['糖尿病','血糖高','血糖偏高'] },
  { key:'尿酸高',     alias:['尿酸高','高尿酸','痛风'] },
  { key:'脂肪肝',     alias:['脂肪肝'] },
  { key:'肾结石',     alias:['肾结石','尿潜血'] },
  { key:'胆囊息肉',   alias:['胆囊息肉','胆息肉'] },
  { key:'胃部疾病',   alias:['胃炎','胃溃疡','胃息肉'] },
  { key:'住院史',     alias:['住院','手术史','动过手术'] }
];
function healthKeysOf(text) {
  var t = (text||''), out = [];
  HEALTH_CANON.forEach(function(c){
    for (var i=0;i<c.alias.length;i++){ if (t.indexOf(c.alias[i])>=0){ out.push(c.key); break; } }
  });
  return out;
}
/* 匹配产品健康规则：返回 {level:'block'|'caution', hits:[{cond,note}]} 或 null */
function healthCheck(product, member) {
  if (!product || !Array.isArray(product.health) || !product.health.length) return null;
  var keys = healthKeysOf(member.health || '');
  if (!keys.length) return null;
  var worst = null, hits = [];
  product.health.forEach(function(r){
    keys.forEach(function(k){
      if ((r.cond||'').indexOf(k) >= 0) {
        hits.push(r);
        var lv = r.level || 'caution';
        if (!worst || (worst === 'caution' && lv === 'block')) worst = lv;
      }
    });
  });
  return hits.length ? { level: worst, hits: hits } : null;
}
/* 按年龄匹配费率 */
function rateFor(product, age, gender, plan) {
  if (!product || !Array.isArray(product.rates) || !product.rates.length) return null;
  age = Number(age); if (!age && age !== 0) return null;
  var best = null, fallback = null;
  for (var i=0;i<product.rates.length;i++){
    var r = product.rates[i];
    var min = (r.min===undefined||r.min===null||r.min==='') ? 0 : Number(r.min);
    var max = (r.max===undefined||r.max===null||r.max==='') ? 200 : Number(r.max);
    if (age < min || age > max) continue;
    if (fallback === null) fallback = r;                       // 第一个年龄段匹配
    if (gender && r.gender && r.gender !== gender) continue;   // 性别不匹配
    if (plan && r.plan && r.plan !== plan) continue;           // 方案不匹配
    if (best === null) best = r;
  }
  return best || fallback;
}

function exportData() {
  var payload = {
    app: 'insurance-compare',
    version: 1,
    exportedAt: new Date().toISOString(),
    products: appData.products,
    weights: appData.weights || {}
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var pad = function(n){ return (n<10?'0':'')+n; };
  a.href = url;
  var hh = pad(d.getHours()), mm = pad(d.getMinutes());
  a.download = '保险对比备份-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) +
               '-' + hh + mm + '-' + appData.products.length + '个产品.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  toast('已导出 ' + appData.products.length + ' 个产品');
}

  }
  var totalFields = 0;

  var h = '<div class="modal-box">' +
    '<div class="modal-head"><div class="mt">设置与数据</div><div class="mc" id="st-close">关闭</div></div>' +
    '<div class="modal-body">' +

        '<button class="btn btn-primary" id="st-import" style="width:100%;margin-bottom:9px;background:linear-gradient(135deg,#22a06b,#137333)">📥 导入并合并备份（选 JSON 文件）</button>' +

      '</div>' +
      '<div style="padding:10px 16px 0">' +
        '<div style="background:#f5f7ff;border-radius:10px;padding:13px 14px;font-size:13px;color:#5f6368;line-height:1.7">' +
          '数据全部保存在这台手机本地，<br>不上传、不联网、不需要账号。<br>' +
          '<span style="color:#c5221f;font-weight:600">⚠️ 清除 Safari 网站数据会清空产品，操作前先「导出数据」！</span>' +
        '</div>' +

          '产品数：<b style="color:#202124">' + appData.products.length + '</b>　已填字段：<b style="color:#202124">' + totalFields + '</b>' +

      '</div>' +
      '<div style="padding:16px">' +
        '<button class="btn btn-danger" id="st-clear">清空所有数据</button>' +
        '<input type="file" id="st-file" accept=".json,application/json" style="display:none">' +
      '</div>' +
      '<div style="padding:0 16px 20px;font-size:11.5px;color:#b0b6bf;line-height:1.7">' +
        '电脑与手机之间搬运数据：<br>在一端「导出」，把文件发到另一端「导入并合并」。<br>合并只新增/更新，不会覆盖你另一边新录的内容。' +
      '</div>' +
    '</div>' +
  '</div>';
  m.innerHTML = h;
  m.classList.add('show');

  m.querySelector('#st-close').addEventListener('click', function(){ m.classList.remove('show'); });
  m.addEventListener('click', function(e){ if (e.target === m) m.classList.remove('show'); });

  m.querySelector('#st-export').addEventListener('click', function(){
    exportData();
  });

  var __importMode = 'merge';
  m.querySelector('#st-import').addEventListener('click', function(){
    __importMode = 'merge';
    m.querySelector('#st-file').click();
  });
  m.querySelector('#st-replace').addEventListener('click', function(){
    __importMode = 'replace';
    m.querySelector('#st-file').click();
  });
  m.querySelector('#st-file').addEventListener('change', function(){
    var file = this.files && this.files[0];
    this.value = '';   // 允许重复选同一个文件
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var d;
      try {
        d = JSON.parse(reader.result);
      } catch(e) {
        toast('文件无法解析，请确认是导出的 JSON 备份');
        return;
      }
      if (!d || !Array.isArray(d.products)) { toast('文件格式不对'); return; }

      if (__importMode === 'replace') {
        if (!confirm('替换模式：\n\n本机现有 ' + appData.products.length + ' 个产品将被全部清除，替换为备份里的 ' + d.products.length + ' 个产品。\n\n本机数据不会保留，确定替换吗？')) return;
        appData.products = d.products.slice();
        if (d.weights) appData.weights = JSON.parse(JSON.stringify(d.weights));
        saveData(appData);
        m.classList.remove('show');
        renderAll();
        toast('已替换：现有 ' + appData.products.length + ' 个产品');
        return;
      }

      // 合并预览：按 id 判断新增 / 更新 / 保持不变
      var cur = {};
      appData.products.forEach(function(x){ cur[x.id] = x; });
      var willAdd = 0, willUpdate = 0, willKeep = 0;
      d.products.forEach(function(np){
        var op = cur[np.id];
        if (!op) { willAdd++; }
        else if ((np.updatedAt || 0) > (op.updatedAt || 0)) { willUpdate++; }
        else { willKeep++; }
      });
      var sameName = d.products.filter(function(np){
        return !cur[np.id] && appData.products.some(function(x){ return x.name === np.name; });
      }).length;

      var msg = '备份文件里有 ' + d.products.length + ' 个产品：\n\n' +
                '· 新增 ' + willAdd + ' 个\n' +
                '· 更新 ' + willUpdate + ' 个（备份里的版本更新）\n' +
                '· 保留 ' + willKeep + ' 个（当前设备的版本更新或相同）\n\n' +
                '合并后不会丢失任何一边的数据。确定合并吗？';
      if (sameName > 0) {
        msg += '\n\n提示：其中有 ' + sameName + ' 个产品名称与本机已有产品相同，可能是同一款重复录入，合并后可在列表里删掉多余的那份。';
      }
      if (!confirm(msg)) return;

      // 执行合并：按 id 去重，updatedAt 更新者胜出
      var merged = appData.products.slice();
      var idxById = {};
      merged.forEach(function(x, i){ idxById[x.id] = i; });
      d.products.forEach(function(np){
        var i = idxById[np.id];
        if (i === undefined) {
          merged.push(np);
          idxById[np.id] = merged.length - 1;
        } else if ((np.updatedAt || 0) > (merged[i].updatedAt || 0)) {
          merged[i] = np;
        }
      });
      appData.products = merged;
      // 权重：备份里有而本机没有的键才补进来（不覆盖你已经调好的）
      if (d.weights) {
        if (!appData.weights) appData.weights = {};
        Object.keys(d.weights).forEach(function(k){
          if (appData.weights[k] === undefined) appData.weights[k] = d.weights[k];
        });
      }
      saveData(appData);
      m.classList.remove('show');
      renderAll();
      toast('已合并：新增 ' + willAdd + '，更新 ' + willUpdate + '，共 ' + appData.products.length + ' 个产品');
    };
    reader.readAsText(file);
  });

  m.querySelector('#st-clear').addEventListener('click', function(){
    if (!confirm('确定清空所有产品数据？此操作不可恢复，建议先导出备份。')) return;
    if (!confirm('再次确认：所有产品与条款记录都将被删除。')) return;
    appData = getDefaultData();
    saveData(appData);
    m.classList.remove('show');
    state.detailId = null; state.editingId = null;
    switchPage('list');
    toast('已清空');
  });
}

/* ============================================================
   对比结果分享图：用 canvas 画一张长图，可保存/分享
   ============================================================ */
function shareCompareImage() {
  // 取当前对比表正在比的产品
  var scope = appData.products.filter(function(p){
    return state.tableType === 'all' || p.type === state.tableType;
  });
  var list = scope.filter(function(p){
    return state.tableIds.length === 0 || state.tableIds.indexOf(p.id) >= 0;
  });
  if (list.length < 2) { toast('至少需要 2 个产品才能生成对比图'); return; }

  var ev = evaluateGroup(list);
  var ranked = list.slice().sort(function(a,b){
    return (ev[b.id].score||0) - (ev[a.id].score||0);
  });

  // 画布尺寸
  var W = 750, PAD = 34;
  var titleH = 130;
  var cardH = 150;
  var cardsH = ranked.length * (cardH + 14);
  var footH = 76;
  var H = titleH + cardsH + footH + 20;

  var cv = document.createElement('canvas');
  var scale = 2;
  cv.width = W * scale;
  cv.height = H * scale;
  var g = cv.getContext('2d');
  g.scale(scale, scale);

  // 背景
  g.fillStyle = '#f5f6f8';
  g.fillRect(0, 0, W, H);

  function rr(x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function wrapText(text, maxW, fontSize) {
    var lines = [], cur = '';
    for (var i = 0; i < text.length; i++) {
      var test = cur + text[i];
      if (g.measureText(test).width > maxW && cur) { lines.push(cur); cur = text[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // ===== 标题区 =====
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, W, titleH - 18);
  g.fillStyle = '#1a5fd0';
  g.font = 'bold 34px -apple-system,"PingFang SC",sans-serif';
  g.fillText('🏆 保险对比结果', PAD, 58);
  g.fillStyle = '#8a919b';
  g.font = '19px -apple-system,"PingFang SC",sans-serif';
  var ts = new Date();
  var dateStr = ts.getFullYear() + '-' + String(ts.getMonth()+1).padStart(2,'0') + '-' + String(ts.getDate()).padStart(2,'0');
  g.fillText('共 ' + list.length + ' 款产品 · ' + dateStr, PAD, 92);
  g.fillStyle = '#b8bec7';
  g.font = '16px -apple-system,"PingFang SC",sans-serif';
  g.fillText('按条款内容自动评估', PAD, 116);

  // ===== 产品卡片 =====
  var y = titleH;
  ranked.forEach(function(p, ri){
    var e = ev[p.id] || { win:0, lose:0, prosTop:[], consTop:[], winRate:0 };
    var isTop = ri === 0 && e.score > 0;

    // 卡片底
    g.fillStyle = isTop ? '#fffdf5' : '#ffffff';
    rr(PAD - 6, y, W - (PAD - 6) * 2, cardH, 16);
    g.fill();
    if (isTop) {
      g.strokeStyle = '#f0c060';
      g.lineWidth = 2.5;
      rr(PAD - 6, y, W - (PAD - 6) * 2, cardH, 16);
      g.stroke();
    }

    // 名次圆
    var cx = PAD + 22, cy = y + 40;
    var grad = g.createLinearGradient(cx - 18, cy - 18, cx + 18, cy + 18);
    if (ri === 0) { grad.addColorStop(0, '#f5b301'); grad.addColorStop(1, '#e08b00'); }
    else if (ri === 1) { grad.addColorStop(0, '#b8c0cc'); grad.addColorStop(1, '#9aa1ab'); }
    else if (ri === 2) { grad.addColorStop(0, '#d09a6a'); grad.addColorStop(1, '#b57b4a'); }
    else { grad.addColorStop(0, '#d4d8de'); grad.addColorStop(1, '#c2c7ce'); }
    g.fillStyle = grad;
    g.beginPath(); g.arc(cx, cy, 19, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff';
    g.font = 'bold 21px -apple-system,sans-serif';
    g.textAlign = 'center';
    g.fillText(String(ri + 1), cx, cy + 7);
    g.textAlign = 'left';

    // 产品名
    g.fillStyle = '#202124';
    g.font = 'bold 26px -apple-system,"PingFang SC",sans-serif';
    var nameX = cx + 32;
    var nameLines = wrapText(p.name, isTop ? 330 : 420, 26);
    g.fillText(nameLines[0], nameX, cy + 9);

    // 综合最优标
    if (isTop) {
      var bw = g.measureText(nameLines[0]).width;
      var bx = nameX + Math.min(bw, 330) + 12;
      g.fillStyle = '#f5b301';
      rr(bx, cy - 14, 92, 28, 8); g.fill();
      g.fillStyle = '#fff';
      g.font = 'bold 16px -apple-system,"PingFang SC",sans-serif';
      g.fillText('综合最优', bx + 10, cy + 6);
    }

    // 公司名
    var co = (p.fields||{}).company || '';
    if (co) {
      g.fillStyle = '#9aa1ab';
      g.font = '17px -apple-system,"PingFang SC",sans-serif';
      g.fillText(co, nameX, cy + 34);
    }

    // 右侧优/劣
    g.textAlign = 'right';
    g.fillStyle = '#137333';
    g.font = 'bold 32px -apple-system,sans-serif';
    g.fillText(String(e.win), W - PAD - 52, cy + 12);
    g.fillStyle = '#8a919b';
    g.font = '17px -apple-system,"PingFang SC",sans-serif';
    g.fillText('优', W - PAD - 26, cy + 12);
    if (e.lose) {
      g.fillStyle = '#b06a63';
      g.font = '15px -apple-system,"PingFang SC",sans-serif';
      g.fillText(e.lose + ' 劣', W - PAD - 26, cy + 34);
    }
    g.textAlign = 'left';

    // 优势条
    var barY = y + 76, barW = W - PAD * 2 - 4;
    g.fillStyle = '#f1f3f6';
    rr(PAD + 4, barY, barW, 22, 11); g.fill();
    var inner = Math.max(0.04, Math.min(1, e.winRate / 100));
    var bg2 = g.createLinearGradient(PAD, 0, PAD + barW * inner, 0);
    if (ri === 0) { bg2.addColorStop(0, '#6ec48b'); bg2.addColorStop(1, '#34a853'); }
    else { bg2.addColorStop(0, '#b4bcc8'); bg2.addColorStop(1, '#9aa3af'); }
    g.fillStyle = bg2;
    rr(PAD + 4, barY, barW * inner, 22, 11); g.fill();
    g.fillStyle = '#3f4650';
    g.font = 'bold 14px -apple-system,"PingFang SC",sans-serif';
    g.textAlign = 'center';
    g.fillText('优势率 ' + e.winRate + '%', PAD + 4 + barW / 2, barY + 16);
    g.textAlign = 'left';

    // 亮点（最多 2 条）
    var py = y + 112;
    (e.prosTop || []).slice(0, 2).forEach(function(x){
      var txt = '✓ ' + x.label + '：' + x.reason;
      g.fillStyle = '#eef9f1';
      rr(PAD + 4, py - 13, W - PAD * 2 - 8, 26, 7); g.fill();
      g.fillStyle = '#1c7a3e';
      g.font = '16px -apple-system,"PingFang SC",sans-serif';
      var t = txt.length > 30 ? txt.slice(0, 30) + '…' : txt;
      g.fillText(t, PAD + 14, py + 5);
      py += 31;
    });
    if (!e.prosTop || !e.prosTop.length) {
      g.fillStyle = '#9aa1ab';
      g.font = '16px -apple-system,"PingFang SC",sans-serif';
      g.fillText('填写更多条款后自动给出亮点', PAD + 8, py + 4);
    }

    y += cardH + 14;
  });

  // ===== 页脚 =====
  g.fillStyle = '#b8bec7';
  g.font = '15px -apple-system,"PingFang SC",sans-serif';
  g.textAlign = 'center';
  g.fillText('由「保险对比工作台」生成 · 判断仅供参考，条款请自行核实', W / 2, H - 34);
  g.textAlign = 'left';

  // 输出
  cv.toBlob(function(blob){
    if (!blob) { toast('生成失败，请重试'); return; }
    var url = URL.createObjectURL(blob);
    var fname = '保险对比-' + dateStr + '.png';
    showShareSheet(url, fname);
  }, 'image/png');
}

function showShareSheet(url, fname) {
  var m = document.getElementById('share-modal');
  if (!m) {
    m = document.createElement('div');
    m.className = 'modal';
    m.id = 'share-modal';
    document.body.appendChild(m);
  }
  m.innerHTML = '<div class="modal-box">' +
    '<div class="modal-head"><div class="mt">📤 对比结果图</div><div class="mc" id="sh-close">关闭</div></div>' +
    '<div class="modal-body" style="padding:12px 14px 6px;text-align:center">' +
      '<img src="' + url + '" style="width:100%;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)">' +
      '<div style="font-size:11.5px;color:#9aa1ab;margin-top:10px;line-height:1.6">长按图片可保存到相册<br>也可以点下面的按钮直接分享</div>' +
    '</div>' +
    '<div class="modal-foot" style="display:flex;gap:8px">' +
      '<button class="btn btn-ghost" id="sh-download" style="flex:1">保存图片</button>' +
      '<button class="btn btn-primary" id="sh-share" style="flex:1">分享</button>' +
    '</div>' +
  '</div>';
  m.classList.add('show');

  m.querySelector('#sh-close').addEventListener('click', function(){ m.classList.remove('show'); });
  m.addEventListener('click', function(e){ if (e.target === m) m.classList.remove('show'); });

  m.querySelector('#sh-download').addEventListener('click', function(){
    var a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    toast('已保存，可到相册/下载里找');
  });

  m.querySelector('#sh-share').addEventListener('click', function(){
    fetch(url).then(function(r){ return r.blob(); }).then(function(blob){
      var file = new File([blob], fname, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: '保险对比结果' }).catch(function(){});
      } else {
        toast('当前环境不支持直接分享，请长按图片保存');
      }
    }).catch(function(){ toast('请长按图片保存'); });
  });
}

document.getElementById('btn-settings').addEventListener('click', openSettings);
document.getElementById('btn-share').addEventListener('click', shareCompareImage);

// 注册 Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(e){
      console.warn('SW 注册失败', e);
    });
  });
}
</script>
