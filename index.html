<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>保险对比</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="保险对比">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;max-width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f6f8;color:#333;-webkit-tap-highlight-color:transparent;margin:0;padding:0;overflow:hidden;overscroll-behavior-x:contain;height:100vh;height:100dvh}
.app{display:flex;flex-direction:column;max-width:430px;margin:0 auto;background:#f5f6f8;height:100vh;height:100dvh;overflow:hidden;position:relative}

/* ===== 顶栏 ===== */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid #eee;flex-shrink:0;z-index:100}
.header .title{font-size:17px;font-weight:600;letter-spacing:.3px}
.header .icons{display:flex;gap:14px;align-items:center}
.header .icons .icon-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#666}
.header .icons .icon-btn svg{width:20px;height:20px}

/* ===== 主内容 ===== */
.pages{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:70px}
.page{display:none}
.page.active{display:block}

/* ===== 底部导航 ===== */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #eee;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0}
.nav-item svg{width:22px;height:22px;color:#b0b6bf;transition:color .2s}
.nav-item span{font-size:11px;color:#b0b6bf;transition:color .2s}
.nav-item.active svg,.nav-item.active span{color:#2f6fed}

/* ===== 筛选栏 ===== */
.filter-bar{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid #eee;scrollbar-width:none;flex-shrink:0}
.filter-bar::-webkit-scrollbar{display:none}
.chip{padding:5px 13px;border-radius:16px;font-size:13px;white-space:nowrap;cursor:pointer;background:#f0f1f4;color:#666;transition:.2s;border:1px solid transparent}
.chip.active{background:#2f6fed;color:#fff;border-color:#2f6fed}
.chip .cnt{opacity:.7;font-size:11px;margin-left:2px}
/* 下拉式筛选 pill（v2.6） */
.fsel-wrap{position:relative;display:inline-flex;align-items:center}
.fsel{appearance:none;-webkit-appearance:none;border:1px solid #e2e6ec;background:#f0f1f4;border-radius:16px;padding:5px 26px 5px 13px;font-size:13px;color:#555;outline:none;max-width:170px;font-family:inherit}
.fsel.active{border-color:#2f6fed;color:#2f6fed;background:#e8f0fe;font-weight:600}
.fsel-wrap::after{content:'▾';position:absolute;right:11px;font-size:11px;color:#9aa1ab;pointer-events:none}
/* 产品库筛选面板（v2.6） */
.list-filter{display:block;padding:9px 12px;background:#fff;border-bottom:1px solid #eee;flex-shrink:0}
.lf-row{display:flex;gap:7px;align-items:center}
.lf-row + .lf-row{margin-top:8px}
.list-filter .fsel{max-width:150px;flex:1}
.list-search{flex:1;min-width:0;width:100%;border:1px solid #e2e6ec;border-radius:16px;padding:7px 14px;font-size:13px;background:#f7f8fa;outline:none;font-family:inherit;box-sizing:border-box}
.list-search:focus{border-color:#2f6fed;background:#fff}
/* 勾选产品折叠（v2.6） */
.sel-pills{transition:max-height .25s ease}
.sel-pills.collapsed{max-height:92px;overflow:hidden}
.sel-more{font-size:12px;color:#2f6fed;cursor:pointer;padding:7px 2px 0;text-align:center;font-weight:600}

/* ===== 产品卡片 ===== */
.list{padding:10px 12px}
.pcard{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;position:relative;transition:box-shadow .15s;border:1px solid #e8ebf0}
.pcard:active{box-shadow:0 1px 6px rgba(0,0,0,.12)}
.pcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pcard-name{font-size:15px;font-weight:600;line-height:1.35;flex:1;min-width:0;word-break:break-all}
.pcard-company{font-size:12px;color:#8a919b;margin-top:3px}
/* 卡片数据三格 */
.pcard-stats{display:flex;gap:7px;margin-top:10px}
.pcard-stats .stat{flex:1;background:#fafbfc;border:1px solid #f0f2f5;border-radius:8px;padding:6px 4px;text-align:center;line-height:1.2}
.pcard-stats .stat b{display:block;font-size:15px;font-weight:700;color:#5f6368}
.pcard-stats .stat span{font-size:9.5px;color:#9aa1ab;display:block;margin-top:2px}
.pcard-stats .stat.hi{background:#eef9f1;border-color:#d3efdc}
.pcard-stats .stat.hi b{color:#137333}
.pcard-stats .stat.mid{background:#fffbf0;border-color:#fdeecd}
.pcard-stats .stat.mid b{color:#c77700}
.pcard-stats .stat.lo b{color:#b06a63}
.pcard-stats .stat.rank b{color:#2f6fed}
/* 关键条款 */
.pcard-kv{display:flex;flex-direction:column;gap:3px;margin-top:9px;padding-top:9px;border-top:1px dashed #eef0f3}
.pcard-kv .kv{display:flex;font-size:11.5px;line-height:1.4}
.pcard-kv .kv-k{color:#a0a6ae;width:44px;flex-shrink:0}
.pcard-kv .kv-v{color:#3c4043;flex:1;min-width:0;word-break:break-word}
/* 优势亮点 */
.pcard-pros{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.pglass{font-size:10.5px;color:#1c7a3e;background:#eef9f1;border-radius:5px;padding:3px 7px;line-height:1.4;display:block}
.pcard-badge{font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;font-weight:500}
.badge-cz{background:#ffeaea;color:#d93025}
.badge-yl{background:#e8f0fe;color:#1a73e8}
.badge-yw{background:#fff3e0;color:#e8710a}
.badge-sx{background:#e6f4ea;color:#137333}
.badge-nj{background:#f3e8fd;color:#8430ce}
.badge-qt{background:#f0f1f4;color:#5f6368}
.pcard-meta{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;font-size:12px;color:#8a919b}
.pcard-meta span{display:flex;align-items:center;gap:3px}
.pcard-score{position:absolute;right:12px;bottom:11px;font-size:12px;color:#2f6fed;font-weight:600}
.pcard-tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.ptag{font-size:11px;padding:1px 6px;border-radius:4px;background:#f0f1f4;color:#6b7280}

/* ===== 空状态 ===== */
.empty{text-align:center;padding:60px 30px;color:#9aa1ab}
.empty svg{width:56px;height:56px;opacity:.35;margin-bottom:14px}
.empty p{font-size:14px;margin-bottom:6px}
.empty .hint{font-size:12px;color:#b0b6bf;line-height:1.6}

/* ===== 表单 ===== */
.form-wrap{padding:12px 12px 20px}
.fgroup{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden}
.fgroup-title{font-size:12px;font-weight:600;color:#8a919b;padding:11px 14px 7px;letter-spacing:.4px}
.frow{display:flex;align-items:flex-start;padding:10px 14px;border-top:1px solid #f2f3f5;gap:10px}
.frow:first-of-type{border-top:none}
.flabel{font-size:13px;color:#5f6368;width:92px;flex-shrink:0;padding-top:7px;line-height:1.35}
.fnote{font-size:10px;color:#b0b6bf;margin-top:2px;line-height:1.3;font-weight:400}
/* 多条描述 */
.multi-wrap{flex:1;min-width:0}
.multi-row{display:flex;align-items:flex-start;gap:4px}
.multi-row + .multi-row{margin-top:6px;padding-top:8px;border-top:1px dashed #dfe3ea}
.td-line + .td-line{margin-top:7px;padding-top:9px;border-top:1px dashed #dfe3ea}
.multi-input{flex:1;min-width:0;min-height:26px;line-height:1.5}
.multi-del{width:22px;height:26px;display:flex;align-items:center;justify-content:center;color:#c0c5cc;font-size:17px;cursor:pointer;flex-shrink:0;border-radius:5px;line-height:1}
.multi-del:active{background:#fef2f2;color:#d93025}
.multi-add{font-size:12px;color:#2f6fed;padding:7px 0 1px;cursor:pointer;display:inline-block;font-weight:500}
.multi-add:active{opacity:.6}
/* 详情/对比里的多条显示 */
.multi-view{display:flex;flex-direction:column;gap:3px}
.multi-view .mv-item{position:relative;padding-left:11px;line-height:1.5}
.multi-view .mv-item::before{content:'';position:absolute;left:0;top:.62em;width:4px;height:4px;border-radius:50%;background:#c0c5cc}
.finput{flex:1;min-width:0;border:none;outline:none;font-size:14px;color:#202124;background:transparent;padding:6px 0;font-family:inherit;line-height:1.45;resize:none}
.finput::placeholder{color:#c0c5cc}
textarea.finput{min-height:38px;overflow:hidden}
.frow-select{position:relative}
.frow-select select{flex:1;border:none;outline:none;font-size:14px;color:#202124;background:transparent;padding:7px 0;font-family:inherit;appearance:none;-webkit-appearance:none}
.frow-select::after{content:'›';position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(90deg);font-size:16px;color:#c0c5cc;pointer-events:none}

/* ===== 按钮 ===== */
.btn{display:block;width:100%;padding:13px;border-radius:10px;border:none;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-primary{background:#2f6fed;color:#fff}
.btn-ghost{background:#fff;color:#5f6368;border:1px solid #e3e5e9}
.btn-danger{background:#fff;color:#d93025;border:1px solid #f5c6c2}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{width:auto;flex:1}

/* ===== 底部固定操作 ===== */
.fixed-actions{position:sticky;bottom:0;background:linear-gradient(to top,#f5f6f8 60%,rgba(245,246,248,0));padding:12px 12px 14px;margin:0 -12px -20px}

/* ===== 对比表 ===== */
.cmp-wrap{padding:10px 0 20px}
.cmp-scroll{overflow:auto;scrollbar-width:thin;max-height:calc(100dvh - 175px);border-radius:10px;margin:0 8px;box-shadow:0 1px 4px rgba(0,0,0,.06);background:#fff;overscroll-behavior:contain}
.cmp-table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.cmp-table th,.cmp-table td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid #f0f1f4;background:#fff;line-height:1.45}
.cmp-table thead th{position:-webkit-sticky;position:sticky;top:0;background:#fafbfc;-webkit-transform:translateZ(0);transform:translateZ(0);font-weight:600;font-size:12.5px;color:#202124;border-bottom:2px solid #e8eaed;z-index:2;min-width:132px;max-width:150px}
.cmp-table thead th:first-child{position:-webkit-sticky;position:sticky;left:0;top:0;z-index:4;background:#f3f6fb}
/* 分组行：一、投保规则 / 二、必选责任 … */
.cmp-table tr.group-row th{position:-webkit-sticky;position:sticky;left:0;background:linear-gradient(90deg,#e8f0fe,#f4f8ff);color:#1a5fd0;font-weight:700;font-size:12px;letter-spacing:.5px;padding:7px 10px;text-align:left;border-top:1px solid #d6e4ff;border-bottom:1px solid #d6e4ff;z-index:3}
.cmp-table tr.group-row th .gcnt{font-weight:400;font-size:11px;color:#5b8def;margin-left:6px}
.cmp-table tbody th{position:-webkit-sticky;position:sticky;left:0;background:#fafbfc;-webkit-transform:translateZ(0);transform:translateZ(0);font-weight:500;color:#5f6368;font-size:12px;min-width:84px;max-width:96px;z-index:1;border-right:1px solid #f0f1f4}
.cmp-table td{min-width:132px;max-width:170px;color:#3c4043;word-break:break-word;border-left:1px solid #e2e6ec}
.cmp-table thead th:not(:first-child){border-left:1px solid #dfe3ea}
.cmp-table td[data-p]{cursor:pointer}
.cmp-table td[data-p]:active{box-shadow:inset 0 0 0 999px rgba(47,111,237,.09)}
.cmp-table td.diff{background:#fffdf5}
.cmp-table td.best{background:#f0fdf4;color:#137333;font-weight:600}
.cmp-table td.worst{background:#fef7f7;color:#c5221f}
/* 语义引擎标注 */
.cmp-table td.adv{background:#eef9f1;box-shadow:inset 3px 0 0 #34a853;color:#0f6c33;font-weight:600}
.cmp-table td.dis{background:#fdf3f3;color:#a2504a}
.cmp-table td.adv.diff{background:#e9f7ee}
.adv-mark{display:inline-block;font-size:9.5px;font-weight:700;background:#34a853;color:#fff;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle;letter-spacing:.5px}
.dis-mark{display:inline-block;font-size:9.5px;background:#e8a09a;color:#fff;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle;letter-spacing:.5px}
.adv-reason{display:block;font-size:10px;font-weight:400;color:#3f8f5c;margin-top:4px;line-height:1.35}
.cmp-table thead th.top-col{background:linear-gradient(180deg,#fff6e5,#ffeccc);box-shadow:inset 0 -2px 0 #f0a500}

/* ===== 优势榜 ===== */
.verdict{margin:0 8px 10px;background:#fff;border-radius:12px;padding:12px 12px 8px;box-shadow:0 1px 5px rgba(0,0,0,.07);border:1px solid #eef0f4}
.verdict-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.verdict-head .vt{font-size:14.5px;font-weight:700;color:#202124;letter-spacing:.3px}
.verdict-head .vs{font-size:11px;color:#9aa1ab}
.vcard{border:1px solid #eef0f4;border-radius:10px;padding:9px 10px 10px;margin-bottom:8px;background:#fcfcfd;position:relative;transition:.15s}
.vcard.is-top{border-color:#f0c060;background:linear-gradient(180deg,#fffdf5,#fff9ec);box-shadow:0 2px 8px rgba(240,165,0,.13)}
.vcard:last-child{margin-bottom:2px}
.vcard-top{display:flex;align-items:center;gap:8px}
.vrank{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:#c8ccd2}
.vcard.r1 .vrank{background:linear-gradient(135deg,#f5b301,#e08b00)}
.vcard.r2 .vrank{background:linear-gradient(135deg,#b8c0cc,#9aa1ab)}
.vcard.r3 .vrank{background:linear-gradient(135deg,#d09a6a,#b57b4a)}
.vname{flex:1;font-size:13.5px;font-weight:600;color:#202124;line-height:1.3;word-break:break-all;min-width:0}
.crown{font-size:9.5px;background:linear-gradient(135deg,#f5b301,#e08b00);color:#fff;border-radius:4px;padding:1.5px 6px;margin-left:6px;font-weight:700;vertical-align:middle;white-space:nowrap}
.vscore{flex-shrink:0;font-size:11px;color:#7a828c;text-align:right;line-height:1.3}
.vscore b{font-size:17px;color:#137333;font-weight:700}
.vscore span{font-size:10px;margin-left:1px}
.vscore i{display:block;font-style:normal;font-size:10px;color:#b06a63}
.vbar{position:relative;height:16px;border-radius:8px;background:#f1f3f6;margin:7px 0 6px;overflow:hidden}
.vbar-in{height:100%;border-radius:8px;background:linear-gradient(90deg,#6ec48b,#34a853);transition:width .35s ease}
.vcard.r2 .vbar-in,.vcard.r3 .vbar-in{background:linear-gradient(90deg,#a9b3c1,#8d97a5)}
.vcard.rn .vbar-in{background:linear-gradient(90deg,#c9ced6,#b4bac3)}
.vbar-t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:#3f4650;font-weight:600;letter-spacing:.3px}
.vpros{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.vtag{font-size:10.5px;line-height:1.45;padding:3px 7px;border-radius:5px;display:block}
.vtag.good{background:#eef9f1;color:#1c7a3e}
.vtag.bad{background:#fdf1f0;color:#a0504a}
.vtag.neutral{background:#f5f6f8;color:#9aa1ab}
.cmp-table thead th .hsub{display:block;font-size:11px;color:#8a919b;font-weight:400;margin-top:2px}
.cmp-table thead th .hdel{color:#c0c5cc;font-size:14px;margin-left:4px;cursor:pointer}
.cmp-note{padding:8px 14px;font-size:11.5px;color:#9aa1ab;line-height:1.6}
/* 产品勾选条 */
.sel-bar{background:#fff;border-radius:11px;margin:0 8px 10px;padding:9px 11px 11px;box-shadow:0 1px 4px rgba(0,0,0,.05);border:1px solid #eef0f4}
.sel-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sel-t{font-size:12px;font-weight:600;color:#5f6368}
.sel-n{font-size:10.5px;color:#2f6fed;background:#eef3ff;border-radius:8px;padding:1px 7px;font-weight:600}
.sel-clear{font-size:11px;color:#8a919b;margin-left:auto;text-decoration:underline;cursor:pointer;padding:2px 4px}
.sel-pills{display:flex;flex-wrap:wrap;gap:6px}
.sel-pill{font-size:11.5px;color:#5f6368;background:#f5f6f8;border:1.5px solid transparent;border-radius:16px;padding:5px 11px;cursor:pointer;line-height:1.3;word-break:break-all;max-width:100%}
.sel-pill:active{background:#eef3ff}
.sel-pill.on{color:#1a5fd0;background:#e8f0fe;border-color:#2f6fed;font-weight:600}
.best-mark{display:inline-block;font-size:10px;background:#137333;color:#fff;border-radius:3px;padding:0 3px;margin-left:3px;vertical-align:middle}

/* ===== 两两对比 ===== */
.duo-group{display:flex;align-items:center;gap:7px;padding:16px 4px 8px;font-size:13px;font-weight:700;color:#1a5fd0;letter-spacing:.5px}
.duo-group::before{content:'';width:4px;height:15px;border-radius:2px;background:#2f6fed}
.duo-group:first-child{padding-top:6px}
.duo-select{display:flex;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #eee}
.duo-select select{flex:1;border:1px solid #e3e5e9;border-radius:8px;padding:9px;font-size:13px;font-family:inherit;background:#fff;color:#202124;outline:none;min-width:0}
.duo-list{padding:10px 12px}
.duo-row{background:#fff;border-radius:10px;margin-bottom:7px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid #f0f1f4}
.duo-row.has-diff{border-color:#ffe1a8;background:#fffdf7}
.duo-label{font-size:11.5px;color:#8a919b;padding:8px 12px 0;font-weight:500;letter-spacing:.3px;display:flex;align-items:center;gap:5px}
.diff-tag{font-size:9px;color:#c77700;background:#ffefdb;border-radius:3px;padding:1px 4px;font-weight:600}
.duo-cells{display:flex}
.duo-cell{flex:1;padding:7px 12px 11px;font-size:13px;color:#3c4043;line-height:1.45;word-break:break-word;min-width:0}
.duo-cell:first-child{border-right:1.5px solid #dfe3ea}
.duo-cell[data-p]{cursor:pointer}
.duo-cell[data-p]:active{box-shadow:inset 0 0 0 999px rgba(47,111,237,.09)}
.duo-cell.win{color:#137333;font-weight:600;background:#f6fdf8}
.duo-cell.lose{color:#8a919b}
.duo-cell.same{color:#5f6368}
.duo-only{font-size:10px;color:#d93025;margin-left:3px}
/* 就地编辑多条模式 */
.ce-mrow{display:flex;gap:7px;align-items:flex-start;margin-bottom:7px}
.ce-mrow textarea{flex:1;min-width:0}
.ce-mdel{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:#fdeeec;color:#d93025;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:3px;user-select:none}
/* 两两对比顶部胜负小结 */
.duo-summary{margin:10px 12px 0;background:#fff;border-radius:11px;padding:11px 12px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #eef0f4}
.ds-title{font-size:13.5px;font-weight:700;color:#202124;margin-bottom:9px;letter-spacing:.2px}
.ds-cols{display:flex;gap:8px}
.ds-col{flex:1;background:#fafbfc;border-radius:8px;padding:8px 9px;font-size:11.5px;color:#5f6368;line-height:1.45;min-width:0;border:1px solid #f0f2f5}
.ds-who{display:inline-block;background:#2f6fed;color:#fff;border-radius:4px;padding:0 5px;font-size:10px;font-weight:700;margin-right:5px}
.ds-col:last-child .ds-who{background:#e8710a}
.ds-num{margin-top:5px;color:#8a919b;font-size:10.5px}

   保险对比工具 v2.7
   纯本地 PWA：IndexedDB 主存储 + localStorage 兜底，数据不出手机
   ============================================================ */

var STORAGE_KEY = 'ins_v1';
var IDB_NAME = 'insurance-compare', IDB_STORE = 'kv', idbInst = null;

/* ---------- IndexedDB 层 ---------- */
function idbOpen() {
  return new Promise(function(resolve, reject){
    if (idbInst) return resolve(idbInst);
    if (!window.indexedDB) return reject(new Error('no-idb'));
    var req = window.indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(){
      var db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = function(){ idbInst = req.result; resolve(idbInst); };
    req.onerror = function(){ reject(req.error); };
  });
}
function idbSet(key, value) {
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  }).catch(function(){ /* 静默降级到 localStorage */ });
}
function idbGet(key) {
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, 'readonly');
      var r = tx.objectStore(IDB_STORE).get(key);
      r.onsuccess = function(){ resolve(r.result); };
      r.onerror = function(){ reject(r.error); };
    });
  });
}

/* ============================================================
   条款语义判断引擎
   对每个字段按「条款常识」打分，而不是只比数字大小。
   返回 -1(劣势) / 0(中性/不可比) / 1(优势)，权重 1~5
   ============================================================ */

// 正向词：出现即有利
var POS_WORDS = ['不限','不占','继续有效','依然有效','含','支持','可附加','保证','宽松','终身','全额','0免赔','无免赔','不分组','额外赔','递增','返还','不限制'];
// 负向词：出现即不利
var NEG_WORDS = ['不支持','无此功能','无','不含','不保','终止','失效','严格','占基本保额','占保额','限制','除外','不赔','需满足','仅限','单次','不变'];

function hasAny(txt, words) {
  for (var i = 0; i < words.length; i++) if (txt.indexOf(words[i]) >= 0) return words[i];
  return null;
}

/* 等待期：180天 → 6个月，统一成月数 */
function waitMonths(txt) {
  var m = String(txt).match(/(\d+(?:\.\d+)?)\s*(天|日|个月|月|年)/);
  if (!m) return null;
  var n = parseFloat(m[1]);
  var u = m[2];
  if (u === '天' || u === '日') return n / 30;
  if (u === '年') return n * 12;
  return n;
}

/* 赔付比例：取百分比，多个取最大 */
function ratios(txt) {
  var out = [], re = /(\d+(?:\.\d+)?)\s*%/g, m;
  while ((m = re.exec(String(txt))) !== null) out.push(parseFloat(m[1]));
  return out;
}

/* 金额统一成「万」，用于保额类比较 */
function toWan(txt) {
  var m = String(txt).match(/(\d+(?:\.\d+)?)\s*(万|千|元|块)?/);
  if (!m) return null;
  var n = parseFloat(m[1]);
  if (m[2] === '千') return n / 10;
  if (m[2] === '元' || m[2] === '块') return n / 10000;
  return n;
}

/* 判断某字段上，候选产品们谁更优。
   peers: [{id, txt}]  txt 已转成纯文本
   返回 { [id]: {level:-1|0|1, weight:n, reason:'…'} } */
function judgeField(fd, peers) {
  var res = {};
  var filled = peers.filter(function(p){ return p.txt !== ''; });
  peers.forEach(function(p){ res[p.id] = { level:0, weight:0, reason:'' }; });
  if (filled.length < 2) return res;   // 只有一个填了，谈不上对比

  var key = fd.key;

  /* ---- 规则 1：等待期（越短越好，按天数分档） ---- */
  if (key === 'waitPeriod') {
    var ms = filled.map(function(p){ return { id:p.id, w:waitMonths(p.txt) }; }).filter(function(o){ return o.w !== null; });
    if (ms.length < 2) return res;
    var min = Math.min.apply(null, ms.map(function(o){ return o.w; }));
    ms.forEach(function(o){
      if (o.w === min) { res[o.id] = { level:1, weight:5, reason:'等待期最短（' + Math.round(o.w*30) + '天）' }; }
      else if (o.w >= min + 2) { res[o.id] = { level:-1, weight:3, reason:'等待期更长' }; }
    });
    return res;
  }

  /* ---- 规则 2：带有「是否 / 有无」性质的字段，看关键词极性 ---- */
  /* 注意：guaranteed 不在此列，它要按年限比较，见规则 6 */
  if (key === 'afterCritical' || key === 'waiver' || key === 'optPolicyWaiver' ||
      key === 'review' || key === 'fullDisable' || key === 'optDeath') {
    var scored = filled.map(function(p){
      var pos = hasAny(p.txt, POS_WORDS);
      var neg = hasAny(p.txt, NEG_WORDS);
      var s = (pos && !neg) ? 1 : (neg && !pos ? -1 : 0);
      if (key === 'optDeath') {
        if (/不含|无/.test(p.txt)) s = -1;
        else if (/含|包含/.test(p.txt)) s = 1;
      }
      return { id:p.id, s:s, txt:p.txt };
    });
    var posN = scored.filter(function(o){ return o.s === 1; }).length;
    var negN = scored.filter(function(o){ return o.s === -1; }).length;
    scored.forEach(function(o){
      if (o.s === 1 && negN > 0) res[o.id] = { level:1, weight:4, reason:'具备该责任/功能' };
      else if (o.s === -1 && posN > 0) res[o.id] = { level:-1, weight:3, reason:'该项缺失或受限' };
    });
    return res;
  }

  /* ---- 规则 3：结节关爱金是否占保额（不占更好） ---- */
  if (key === 'noduleOccupy') {
    filled.forEach(function(p){
      if (/不占|不影响/.test(p.txt)) res[p.id] = { level:1, weight:4, reason:'不占用基本保额' };
      else if (/占/.test(p.txt) && !/不占/.test(p.txt)) res[p.id] = { level:-1, weight:2, reason:'占用基本保额' };
    });
    return res;
  }

  /* ---- 规则 4：健康告知（宽松更好） ---- */
  if (key === 'healthNotice') {
    var hn = filled.map(function(p){
      var s = 0;
      if (/宽松|仅\d+条|少|简单|\b[1-3]条/.test(p.txt)) s = 1;
      else if (/严格|严格|复杂|\d{2}条|多/.test(p.txt)) s = -1;
      var cnt = String(p.txt).match(/(\d+)\s*条/);
      return { id:p.id, s:s, cnt: cnt ? parseInt(cnt[1],10) : null };
    });
    var cnts = hn.filter(function(o){ return o.cnt !== null; });
    if (cnts.length >= 2) {
      var mn = Math.min.apply(null, cnts.map(function(o){ return o.cnt; }));
      var mx = Math.max.apply(null, cnts.map(function(o){ return o.cnt; }));
      if (mx !== mn) {
        hn.forEach(function(o){
          if (o.cnt === mn) res[o.id] = { level:1, weight:4, reason:'健告仅 ' + mn + ' 条，更宽松' };
          else if (o.cnt === mx) res[o.id] = { level:-1, weight:2, reason:'健告 ' + mx + ' 条，较严格' };
        });
        return res;
      }
    }
    hn.forEach(function(o){
      if (o.s === 1) res[o.id] = { level:1, weight:3, reason:'健康告知较宽松' };
      else if (o.s === -1) res[o.id] = { level:-1, weight:2, reason:'健康告知较严格' };
    });
    return res;
  }

  /* ---- 规则 5：是否限社保（不限更好） ---- */
  if (key === 'socialLimit') {
    filled.forEach(function(p){
      var t = p.txt;
      if (/不限|不限制|社保内外均可/.test(t)) {
        res[p.id] = { level:1, weight:4, reason:'不限社保，报销范围更广' };
      } else if (/仅限社保|限社保|社保内/.test(t)) {
        res[p.id] = { level:-1, weight:3, reason:'限社保范围内' };
      }
    });
    return res;
  }

  /* ---- 规则 6：保证续保（年限越长越好） ---- */
  if (key === 'guaranteed') {
    var gs = filled.map(function(p){
      var y = String(p.txt).match(/(\d+)\s*年/);
      var life = /终身|长期/.test(p.txt);
      return { id:p.id, y: life ? 999 : (y ? parseInt(y[1],10) : (/不保证|无/.test(p.txt) ? 0 : null)) };
    }).filter(function(o){ return o.y !== null; });
    if (gs.length < 2) return res;
    var gy = Math.max.apply(null, gs.map(function(o){ return o.y; }));
    gs.forEach(function(o){
      if (o.y === gy) res[o.id] = { level:1, weight:5, reason: o.y === 999 ? '终身保证续保' : '保证续保最长 ' + o.y + ' 年' };
      else if (o.y < gy) res[o.id] = { level:-1, weight:2, reason:'保证续保期限更短' };
    });
    return res;
  }

  /* ---- 规则 7：赔付比例（比例高、次数多更好） ---- */
  if (['criticalPay','mediumPay','mildPay','reimburseRate','disableRatio','medicalRate'].indexOf(key) >= 0) {
    var rs = filled.map(function(p){
      var r = ratios(p.txt);
      var cnt = String(p.txt).match(/(\d+)\s*次/);
      return { id:p.id, r: r.length ? Math.max.apply(null, r) : null, c: cnt ? parseInt(cnt[1],10) : null };
    });
    var withR = rs.filter(function(o){ return o.r !== null; });
    if (withR.length >= 2) {
      var hi = Math.max.apply(null, withR.map(function(o){ return o.r; }));
      var lo = Math.min.apply(null, withR.map(function(o){ return o.r; }));
      if (hi !== lo) {
        withR.forEach(function(o){
          if (o.r === hi) res[o.id] = { level:1, weight:5, reason:'赔付比例最高 ' + hi + '%' };
          else res[o.id] = { level:-1, weight:2, reason:'赔付比例 ' + o.r + '%，偏低' };
        });
        return res;
      }
    }
    // 比例相同，比次数
    var withC = rs.filter(function(o){ return o.c !== null; });
    if (withC.length >= 2) {
      var hc = Math.max.apply(null, withC.map(function(o){ return o.c; }));
      var lc = Math.min.apply(null, withC.map(function(o){ return o.c; }));
      if (hc !== lc) {
        withC.forEach(function(o){
          if (o.c === hc) res[o.id] = { level:1, weight:4, reason:'可赔 ' + hc + ' 次，次数最多' };
          else res[o.id] = { level:-1, weight:2, reason:'仅可赔 ' + o.c + ' 次' };
        });
        return res;
      }
    }
    return res;
  }

  /* ---- 规则 8：病种数量（越多越好） ---- */
  if (/(\d+)\s*种/.test(filled[0].txt) || filled.some(function(p){ return /\d+\s*种/.test(p.txt); })) {
    var kinds = filled.map(function(p){
      var m = String(p.txt).match(/(\d+)\s*种/);
      return { id:p.id, n: m ? parseInt(m[1],10) : null };
    }).filter(function(o){ return o.n !== null; });
    if (kinds.length >= 2) {
      var kn = Math.max.apply(null, kinds.map(function(o){ return o.n; }));
      var kx = Math.min.apply(null, kinds.map(function(o){ return o.n; }));
      if (kn !== kx) {
        kinds.forEach(function(o){
          if (o.n === kn) res[o.id] = { level:1, weight:3, reason:'覆盖 ' + kn + ' 种，范围最广' };
          else res[o.id] = { level:-1, weight:1, reason:'覆盖 ' + o.n + ' 种，偏少' };
        });
        return res;
      }
    }
  }

  /* ---- 规则 9：金额类（保额越高越好 / 保费越低越好） ---- */
  var amountKeys = ['maxSumInsured','sumInsured','accidentDeath','accidentDisable','medical',
                    'price','deductible','medicalDeduct','payoutAmount','irr','guaranteedRate','cashValueYear','effective'];
  if (amountKeys.indexOf(key) >= 0 && fd.better) {
    // 保费/免赔额这类「元」级金额，用原始数值比较，不做万换算，避免显示成 0.03万
    var isYuan = (key === 'price' || key === 'deductible' || key === 'medicalDeduct');
    var as = filled.map(function(p){
      var n = isYuan ? extractNum(p.txt) : toWan(p.txt);
      return { id:p.id, n:n, raw:String(p.txt).replace(/\s+/g,'') };
    }).filter(function(o){ return o.n !== null; });
    if (as.length < 2) return res;
    var mxv = Math.max.apply(null, as.map(function(o){ return o.n; }));
    var mnv = Math.min.apply(null, as.map(function(o){ return o.n; }));
    if (mxv === mnv) return res;
    as.forEach(function(o){
      var best = fd.better === 'high' ? (o.n === mxv) : (o.n === mnv);
      var worst = fd.better === 'high' ? (o.n === mnv) : (o.n === mxv);
      var unit = (key === 'irr' || key === 'guaranteedRate') ? '%' : '';
      var shown = isYuan ? o.raw : (o.n + unit);
      var word = fd.better === 'high' ? '最高' : '最低';
      if (best) res[o.id] = { level:1, weight:5, reason: word + ' ' + shown };
      else if (worst) res[o.id] = { level:-1, weight:2, reason:'该项不占优' };
    });
    return res;
  }

  /* ---- 规则 10：通用文字字段——关键词极性 + 内容详略 ---- */
  if (fd.type === 'text' || fd.type === 'long') {
    var texts = filled.map(function(p){
      var pos = hasAny(p.txt, POS_WORDS);
      var neg = hasAny(p.txt, NEG_WORDS);
      var s = 0;
      if (pos && !neg) s = 1;
      else if (neg && !pos) s = -1;
      return { id:p.id, s:s, len:p.txt.length };
    });
    var pN = texts.filter(function(o){ return o.s === 1; }).length;
    var nN = texts.filter(function(o){ return o.s === -1; }).length;
    var marked = false;
    if (pN > 0 && nN > 0) {
      texts.forEach(function(o){
        if (o.s === 1) { res[o.id] = { level:1, weight:3, reason:'条款更有利' }; marked = true; }
        else if (o.s === -1) { res[o.id] = { level:-1, weight:2, reason:'条款相对受限' }; marked = true; }
      });
    }
    return res;
  }

  return res;
}

/* 综合评估一组产品，输出每个产品的优势/劣势统计 + 亮点清单 */
function evaluateGroup(list) {
  var out = {};
  list.forEach(function(p){ out[p.id] = { win:0, lose:0, score:0, pros:[], cons:[], totalW:0 }; });
  if (list.length < 2) return out;

  // 按字段汇总（同类型才有可比性，混合类型用字段并集）
  var kmap = {}, ordered = [];
  list.forEach(function(p){
    getFields(p.type).forEach(function(fd){
      if (!kmap[fd.key]) { kmap[fd.key] = fd; ordered.push(fd.key); }
    });
  });

  ordered.forEach(function(k){
    var fd = kmap[k];
    var peers = list.map(function(p){
      return { id:p.id, txt: valueToText((p.fields||{})[k]) };
    });
    if (peers.filter(function(x){ return x.txt !== ''; }).length < 2) return;
    var judged = judgeField(fd, peers);
    Object.keys(judged).forEach(function(id){
      var j = judged[id];
      if (!j || !j.level) return;
      var w = j.weight || 1;
      out[id].score += j.level * w;
      out[id].totalW += w;
      if (j.level > 0) {
        out[id].win++;
        if (j.reason) out[id].pros.push({ label: fd.label, reason: j.reason, w: w });
      } else {
        out[id].lose++;
        if (j.reason) out[id].cons.push({ label: fd.label, reason: j.reason, w: w });
      }
    });
  });

  // 亮点按权重排序，最多留 5 条
  Object.keys(out).forEach(function(id){
    out[id].pros.sort(function(a,b){ return b.w - a.w; });
    out[id].cons.sort(function(a,b){ return b.w - a.w; });
    out[id].prosTop = out[id].pros.slice(0, 5);
    out[id].consTop = out[id].cons.slice(0, 3);
    var tot = out[id].win + out[id].lose;
    out[id].winRate = tot ? Math.round(out[id].win / tot * 100) : 0;
  });
  return out;
}


function getFields(type) {
  return TYPE_FIELDS[type] || TYPE_FIELDS.qt;
}

function findField(type, key) {
  var fs = getFields(type);
  for (var i=0;i<fs.length;i++) if (fs[i].key === key) return fs[i];
  return null;
}

/* ---------- 数据 ---------- */
function uid() {
  return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function getDefaultData() {
  return {
    version: 1,
    products: [],     // [{id, type, name, fields:{...}, createdAt, updatedAt}]
    weights: {},      // 打分权重 { 'cz.price': 3, ... }
    _savedAt: 0
  };
}
var appData = getDefaultData();

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var d = JSON.parse(raw);
      if (d && Array.isArray(d.products)) return d;
    }
  } catch(e) {}
  return getDefaultData();
}

function saveData(d) {
  try { d._savedAt = Date.now(); } catch(e) {}
  idbSet(STORAGE_KEY, d);                   // 主存储
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
  } catch(e) {
    // 配额满：删旧值重试一次（自愈）
    if (e && (e.name === 'QuotaExceededError' || (e.code && e.code === 22))) {
      try { localStorage.removeItem(STORAGE_KEY); localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch(e2) {}
    }
  }
}

/* 启动协调：以 _savedAt 为准取最新，绝不用滞后数据覆盖新数据 */
function idbBoot() {
  var localRaw = null;
  try { localRaw = localStorage.getItem(STORAGE_KEY); } catch(e) {}
  var localTs = 0;
  if (localRaw) { try { localTs = (JSON.parse(localRaw)._savedAt || 0); } catch(e) {} }

  idbGet(STORAGE_KEY).then(function(existing){
    var idbHasReal = !!(existing && Array.isArray(existing.products) && existing.products.length > 0);
    var idbTs = (existing && existing._savedAt) || 0;
    if (!localRaw) {
      if (idbHasReal) { appData = existing; saveData(appData); renderAll(); }
      else { saveData(appData); }
    } else if (idbHasReal && idbTs > localTs) {
      appData = existing;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch(e) {}
      renderAll();
    } else {
      idbSet(STORAGE_KEY, appData);
    }
  }).catch(function(){});
}

/* ---------- 工具 ---------- */
function esc(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 1800);
}
function fmtNum(v) {
  if (v === '' || v === undefined || v === null) return '';
  var n = Number(v);
  if (isNaN(n)) return String(v);
  return (Math.round(n * 100) / 100).toString();
}
/* 从文本里提取第一个数字，用于打分（如 "100%" → 100，"20年" → 20） */
function extractNum(v) {
  if (v === '' || v === undefined || v === null) return null;
  // 多条描述：取第一条能提取到数字的
  if (Array.isArray(v)) {
    for (var i = 0; i < v.length; i++) {
      var n = extractNum(v[i]);
      if (n !== null) return n;
    }
    return null;
  }
  var m = String(v).match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
/* 把字段值渲染成显示用 HTML：数组→带圆点的多行，字符串→原样 */
function renderValueHTML(v) {
  if (v === undefined || v === null || v === '') return '';
  if (Array.isArray(v)) {
    var items = v.filter(function(x){ return x !== '' && x !== null && x !== undefined; });
    if (items.length === 0) return '';
    if (items.length === 1) return esc(items[0]);
    return '<div class="multi-view">' + items.map(function(x){
      return '<div class="mv-item">' + esc(x) + '</div>';
    }).join('') + '</div>';
  }
  return esc(v);
}
/* 值转纯文本（对比表里用，保留换行分隔） */
function valueToText(v) {
  if (v === undefined || v === null || v === '') return '';
  if (Array.isArray(v)) return v.filter(function(x){ return x !== ''; }).join('\n');
  return String(v);
}
/* 值转单元格 HTML：数组逐条渲染，条与条之间浅灰虚线分隔 */
function cellHtml(v) {
  if (Array.isArray(v)) {
    return v.filter(function(x){ return x !== ''; })
            .map(function(x){ return '<div class="td-line">' + esc(x) + '</div>'; }).join('');
  }
  var t = valueToText(v);
  return t === '' ? '' : esc(t).replace(/\n/g, '<br>');
}
/* 判断字段值是否为空 */
function valueEmpty(v) {
  if (v === undefined || v === null) return true;
  if (Array.isArray(v)) return v.filter(function(x){ return x !== ''; }).length === 0;
  return String(v).trim() === '';
}
function getProduct(id) {
  return appData.products.find(function(p){ return p.id === id; });
}

/* ============================================================
   打分：按用户设置的权重，对各产品参与打分的字段归一化后加权
   ============================================================ */
function calcScore(p) {
  var fields = getFields(p.type).filter(function(f){ return f.score && f.better; });
  if (fields.length === 0) return null;
  var totalW = 0, totalS = 0, any = false;
  fields.forEach(function(f){
    var w = getWeight(p.type, f.key);
    if (w <= 0) return;
    var myVal = extractNum((p.fields||{})[f.key]);
    if (myVal === null) return;
    // 在同类型产品里归一化
    var peers = appData.products.filter(function(x){ return x.type === p.type; });
    var vals = peers.map(function(x){ return extractNum((x.fields||{})[f.key]); }).filter(function(v){ return v !== null; });
    if (vals.length < 2) return;
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    var ratio;
    if (mx === mn) ratio = 1;
    else ratio = (myVal - mn) / (mx - mn);
    if (f.better === 'low') ratio = 1 - ratio;   // 越小越好则反转
    totalS += ratio * w;
    totalW += w;
    any = true;
  });
  if (!any || totalW === 0) return null;
  return (totalS / totalW) * 100;
}
function weightKey(type, key) { return type + '.' + key; }
function getWeight(type, key) {
  var k = weightKey(type, key);
  if (appData.weights && appData.weights[k] !== undefined) return appData.weights[k];
  return 3;   // 默认权重
}
function setWeight(type, key, v) {
  if (!appData.weights) appData.weights = {};
  appData.weights[weightKey(type, key)] = v;
  saveData(appData);
}

    '<div class="frow"><div class="flabel">产品名称<span style="color:#d93025">*</span></div>' +
    '<input class="finput" id="f-name" placeholder="如 某某福终身重疾险" value="' + esc(p.name) + '"></div>' +
    (type === 'yl' ? '<div class="frow"><div class="flabel">医疗档次<div class="fnote">用于按档次筛选对比：基础百万医疗 / 中端医疗 / 高端医疗</div></div>' +
      '<select class="finput" id="f-tier">' +
      ['','基础百万医疗','中端医疗','高端医疗'].map(function(o){
        var lb = o === '' ? '未标注' : o;
        return '<option value="' + o + '"' + ((p.tier||'') === o ? ' selected' : '') + '>' + lb + '</option>';
      }).join('') +
      '</select></div>' : '') +
    '</div>';

  // 各分组字段
  groups.forEach(function(g){
    // 跳过只有 name 的组
    h += '<div class="fgroup"><div class="fgroup-title">' + esc(g) + '</div>';
    gmap[g].forEach(function(f){
      var val = (p.fields && p.fields[f.key] !== undefined) ? p.fields[f.key] : '';
      h += '<div class="frow">';
      h += '<div class="flabel">' + esc(f.label) + (f.note ? '<div class="fnote">' + esc(f.note) + '</div>' : '') + '</div>';
      if (f.type === 'long' && f.multi) {
        // 多条描述：每行一条，可增删
        var lines = Array.isArray(val) ? val.slice() : (val ? [String(val)] : []);
        if (lines.length === 0) lines = [''];
        h += '<div class="multi-wrap" data-k="' + f.key + '">';
        lines.forEach(function(ln, li){
          h += '<div class="multi-row">' +
            '<textarea class="finput multi-input" data-k="' + f.key + '" data-t="long" rows="1" ' +
            'placeholder="' + esc(li === 0 ? (f.note || '填写一条描述…') : '再填一条…') + '">' + esc(ln) + '</textarea>' +
            (lines.length > 1 ? '<div class="multi-del" data-k="' + f.key + '" data-i="' + li + '">×</div>' : '') +
          '</div>';
        });
        h += '<div class="multi-add" data-k="' + f.key + '">＋ 增加一条</div>';
        h += '</div>';
      } else if (f.type === 'long') {
        h += '<textarea class="finput" data-k="' + f.key + '" data-t="long" rows="2" placeholder="' + esc(f.note || '点击填写…') + '">' + esc(val) + '</textarea>';
      } else {
        h += '<input class="finput" data-k="' + f.key + '" data-t="text" ' +
             'placeholder="' + esc(f.note || '') + '" value="' + esc(val) + '">';
      }
      h += '</div>';
    });
    h += '</div>';
  });

  // 操作区
  h += '<div class="fixed-actions">' +
    '<button class="btn btn-primary" id="btn-save-product">' + (isNew ? '保存产品' : '保存修改') + '</button>';
  if (!isNew) {
    h += '<div class="btn-row"><button class="btn btn-danger" id="btn-del-product">删除此产品</button></div>';
  }
  h += '</div>';

  h += '</div>';
  box.innerHTML = h;

  // 长文本框自动撑高（非多条字段）
  box.querySelectorAll('textarea.finput:not(.multi-input)').forEach(function(ta){
    function autoGrow(){ ta.style.height = 'auto'; ta.style.height = Math.max(38, ta.scrollHeight) + 'px'; }
    ta.addEventListener('input', autoGrow);
    setTimeout(autoGrow, 0);
  });
  bindMulti();

  // 收集当前填写内容（多条字段收集为数组，过滤空行）
  function collect() {
    var nameEl = document.getElementById('f-name');
    var obj = {
      name: (nameEl.value || '').trim(),
      type: type,
      fields: {}
    };
    var tierEl = document.getElementById('f-tier');
    if (tierEl) obj.tier = tierEl.value || '';
    // 先处理多条字段
    box.querySelectorAll('.multi-wrap').forEach(function(wrap){
      var k = wrap.dataset.k;
      var arr = [];
      wrap.querySelectorAll('.multi-input').forEach(function(ta){
        var v = (ta.value || '').trim();
        if (v) arr.push(v);
      });
      if (arr.length > 0) obj.fields[k] = arr;
    });
    // 再处理单值字段（跳过多条字段内的 textarea）
    box.querySelectorAll('[data-k]').forEach(function(el){
      if (el.classList.contains('multi-input')) return;
      var k = el.dataset.k;
      var v = el.value;
      if (v !== '' && v !== undefined && v !== null) obj.fields[k] = v;
    });
    return obj;
  }

  // 多条字段：自动撑高（只处理高度，事件统一用委托绑定，避免重复绑定）
  function bindMulti() {
    box.querySelectorAll('textarea.multi-input').forEach(function(ta){
      function grow(){ ta.style.height = 'auto'; ta.style.height = Math.max(26, ta.scrollHeight) + 'px'; }
      ta.addEventListener('input', grow);
      grow();
    });
  }

  // 增删交互：事件委托到编辑容器，只绑定一次（关键：避免重渲染后旧监听指向已销毁的节点）
  if (!box._multiDelegated) {
    box._multiDelegated = true;
    box.addEventListener('click', function(ev){
      var addBtn = ev.target.closest('.multi-add');
      if (addBtn) {
        var wrap = addBtn.closest('.multi-wrap');
        if (!wrap) return;
        var cur = [];
        wrap.querySelectorAll('.multi-input').forEach(function(ta){ cur.push(ta.value); });
        cur.push('');
        renderMultiSection(wrap, addBtn.dataset.k, cur);
        return;
      }
      var delBtn = ev.target.closest('.multi-del');
      if (delBtn) {
        var wrap2 = delBtn.closest('.multi-wrap');
        if (!wrap2) return;
        var idx = parseInt(delBtn.dataset.i, 10);
        var cur2 = [];
        wrap2.querySelectorAll('.multi-input').forEach(function(ta){ cur2.push(ta.value); });
        cur2.splice(idx, 1);
        if (cur2.length === 0) cur2 = [''];
        renderMultiSection(wrap2, delBtn.dataset.k, cur2);
        return;
      }
    });
  }

  // 重新渲染某个多条字段区块
  function renderMultiSection(wrap, key, values) {
    var fld = findField(type, key);
    var note = fld && fld.note ? fld.note : '';
    var inner = '';
    values.forEach(function(ln, li){
      inner += '<div class="multi-row">' +
        '<textarea class="finput multi-input" data-k="' + key + '" data-t="long" rows="1" ' +
        'placeholder="' + esc(li === 0 ? (note || '填写一条描述…') : '再填一条…') + '">' + esc(ln) + '</textarea>' +
        (values.length > 1 ? '<div class="multi-del" data-k="' + key + '" data-i="' + li + '">×</div>' : '') +
      '</div>';
    });
    inner += '<div class="multi-add" data-k="' + key + '">＋ 增加一条</div>';
    wrap.innerHTML = inner;
    bindMulti();
    // 自动聚焦新加的那条
    var tas = wrap.querySelectorAll('.multi-input');
    if (tas.length) { var last = tas[tas.length-1]; last.focus(); }
  }

  document.getElementById('btn-save-product').addEventListener('click', function(){
    var obj = collect();
    if (!obj.name) { toast('请填写产品名称'); document.getElementById('f-name').focus(); return; }
    if (isNew) {
      obj.id = uid();
      obj.createdAt = Date.now();
      obj.updatedAt = Date.now();
      appData.products.push(obj);
      saveData(appData);
      state.editingDraft = null;
      toast('已保存');
      state.detailId = obj.id;
      switchPage('list');
    } else {
      var target = getProduct(state.editingId);
      target.name = obj.name;
      target.fields = obj.fields;
      if (obj.tier !== undefined) target.tier = obj.tier;
      target.updatedAt = Date.now();
      saveData(appData);
      toast('已修改');
      state.detailId = target.id;
      switchPage('detail');
    }
  });

  var delBtn = document.getElementById('btn-del-product');
  if (delBtn) {
    delBtn.addEventListener('click', function(){
      if (!confirm('确定删除「' + p.name + '」？此操作不可恢复。')) return;
      appData.products = appData.products.filter(function(x){ return x.id !== state.editingId; });
      saveData(appData);
      toast('已删除');
      state.editingId = null;
      switchPage('list');
    });
  }
}

/* ============================================================
   详情页
   ============================================================ */
function renderDetail() {
  var box = document.getElementById('page-detail');
  var p = getProduct(state.detailId);
  if (!p) { switchPage('list'); return; }
  var t = TYPES[p.type] || TYPES.qt;
  var fields = getFields(p.type);
  var f = p.fields || {};

  var sc = calcScore(p);
  var h = '<div class="detail-hero">' +
    '<div class="detail-name">' + esc(p.name) + '</div>' +
    (f.company ? '<div class="detail-co">' + esc(f.company) + '</div>' : '') +
    '<div class="detail-badges">' +
      '<span class="pcard-badge ' + t.cls + '">' + t.icon + ' ' + t.name + '</span>' +
      (sc !== null ? '<span class="pcard-badge" style="background:#e8f0fe;color:#1a73e8">综合分 ' + sc.toFixed(1) + '</span>' : '') +
    '</div>' +
  '</div>';

  // 按组显示已填字段
  var groups = [], gmap = {};
  fields.forEach(function(fd){
    var g = fd.group || '其他';
    if (!gmap[g]) { gmap[g] = []; groups.push(g); }
    gmap[g].push(fd);
  });

  // ===== 思维导图式呈现：左侧彩色分组标签 + 树状连线 + 字段胶囊 =====
  var G_COLORS = [
    { c:'#e8710a', bg:'#fff3e0' },  // 橙：投保规则
    { c:'#2f6fed', bg:'#e8f0fe' },  // 蓝：必选/核心责任
    { c:'#8430ce', bg:'#f3e8fd' },  // 紫：可选责任
    { c:'#137333', bg:'#e6f4ea' },  // 绿：收益/领取
    { c:'#5f6368', bg:'#f1f3f6' }   // 灰：其他
  ];
  function gcolor(g) {
    if (/投保规则|投保/.test(g)) return G_COLORS[0];
    if (/可选|附加/.test(g)) return G_COLORS[2];
    if (/收益|领取|续保|特药/.test(g)) return G_COLORS[3];
    if (/必选|核心|责任|基础/.test(g)) return G_COLORS[1];
    return G_COLORS[4];
  }

  groups.forEach(function(g){
    var rows = '';
    gmap[g].forEach(function(fd){
      var v = f[fd.key];
      if (valueEmpty(v)) return;
      rows += '<div class="mind-item">' +
        '<div class="mind-label">' + esc(fd.label) + '</div>' +
        '<div class="mind-body">' + renderValueHTML(v) + '</div>' +
      '</div>';
    });
    if (!rows) return;
    var gc = gcolor(g);
    h += '<div class="mind-sec">' +
      '<div class="mind-gtag" style="color:' + gc.c + ';background:' + gc.bg + '">' + esc(g.replace(/^[一二三四五六七八九十]+、/, '')) + '</div>' +
      '<div class="mind-items" style="border-left-color:' + gc.bg + '">' +
        '<div class="mind-rail" style="background:' + gc.bg + '"></div>' + rows +
      '</div>' +
    '</div>';
  });

  // 未填字段提示
  var filled = Object.keys(f).length;
  h += '<div class="cmp-note" style="padding:4px 16px 0">已填写 ' + filled + ' 个字段，共 ' + fields.length + ' 个</div>';

  h += '<div style="padding:14px 12px 24px">' +
    '<button class="btn btn-primary" id="btn-edit-current">编辑条款细节</button>' +
    '<div class="btn-row"><button class="btn btn-ghost" id="btn-dup-current">复制一份</button></div>' +
  '</div>';

  box.innerHTML = h;

  document.getElementById('btn-edit-current').addEventListener('click', function(){
    state.editingId = p.id;
    switchPage('edit');
  });
  document.getElementById('btn-dup-current').addEventListener('click', function(){
    var copy = JSON.parse(JSON.stringify(p));
    copy.id = uid();
    copy.name = p.name + '（副本）';
    copy.createdAt = Date.now();
    copy.updatedAt = Date.now();
    appData.products.push(copy);
    saveData(appData);
    toast('已复制');
    state.detailId = copy.id;
    renderDetail();
  });
}

/* ============================================================
   视图一：对比表 + 差异高亮
   ============================================================ */
function renderTable() {
  var box = document.getElementById('page-table');

  // 类型筛选
  var counts = {};
  appData.products.forEach(function(p){ counts[p.type] = (counts[p.type]||0)+1; });
  var usedTypes = Object.keys(counts);
  if (usedTypes.length === 0) {
    box.innerHTML = '<div class="empty"><p>还没有产品可以对比</p><div class="hint">先到「产品库」添加两三个产品吧</div></div>';
    return;
  }
  // 若当前选中的类型没有产品，回退到 all
  if (state.tableType !== 'all' && !counts[state.tableType]) state.tableType = 'all';

  var fb = '<div class="filter-bar">';
  fb += '<div class="chip' + (state.tableType==='all'?' active':'') + '" data-t="all">全部<span class="cnt">' + appData.products.length + '</span></div>';
  usedTypes.forEach(function(t){
    fb += '<div class="chip' + (state.tableType===t?' active':'') + '" data-t="' + t + '">' + TYPES[t].icon + ' ' + TYPES[t].short + '<span class="cnt">' + counts[t] + '</span></div>';
  });
  fb += '</div>';

  // 公司 / 医疗层级：下拉式筛选（一排两个，不占空间）
  var TIERS = ['基础百万医疗','中端医疗','高端医疗'];
  function tierOf(p){ return p.tier || '未标注'; }
  var allYl = appData.products.filter(function(p){ return p.type === 'yl'; });
  var coMap = {};
  allYl.forEach(function(p){ var c = ((p.fields||{}).company||'').trim(); if (c) coMap[c] = (coMap[c]||0)+1; });
  var coList = Object.keys(coMap).sort();
  if (state.tableCo !== 'all' && !coMap[state.tableCo]) state.tableCo = 'all';
  if (state.tableTier !== 'all' && TIERS.indexOf(state.tableTier) < 0 && state.tableTier !== '未标注') state.tableTier = 'all';

  fb += '<div class="filter-bar" id="ct-bar">';
  fb += '<span class="fsel-wrap"><select class="fsel' + (state.tableCo!=='all'?' active':'') + '" id="co-sel">' +
    '<option value="all">公司：全部 (' + allYl.length + ')</option>' +
    coList.map(function(c){ return '<option value="' + esc(c) + '"' + (state.tableCo===c?' selected':'') + '>' + esc(c) + ' (' + coMap[c] + ')</option>'; }).join('') +
    '</select></span>';
  fb += '<span class="fsel-wrap"><select class="fsel' + (state.tableTier!=='all'?' active':'') + '" id="tier-sel">' +
    '<option value="all">档次：全部</option>' +
    TIERS.map(function(tr){
      var n = allYl.filter(function(p){ return tierOf(p) === tr; }).length;
      return '<option value="' + tr + '"' + (state.tableTier===tr?' selected':'') + '>' + tr + ' (' + n + ')</option>';
    }).join('') +
    (allYl.some(function(p){ return tierOf(p)==='未标注'; }) ? '<option value="未标注"' + (state.tableTier==='未标注'?' selected':'') + '>未标注</option>' : '') +
    '</select></span>';
  fb += '</div>';

  var scope = appData.products.filter(function(p){
    if (state.tableType !== 'all' && p.type !== state.tableType) return false;
    var c = ((p.fields||{}).company||'').trim();
    if (state.tableCo !== 'all' && c !== state.tableCo) return false;
    if (state.tableTier !== 'all' && (p.type !== 'yl' || tierOf(p) !== state.tableTier)) return false;
    return true;
  });
  if (scope.length === 0) { box.innerHTML = fb + '<div class="empty"><p>该筛选条件下暂无产品</p></div>'; bindTypeChips(box, 'tableType', renderTable); bindCoTierChips(box); return; }

  // 清理过期的勾选（产品已删除或不在当前类型范围内）
  var scopeIds = {};
  scope.forEach(function(p){ scopeIds[p.id] = true; });
  state.tableIds = state.tableIds.filter(function(id){ return scopeIds[id]; });

  // ===== 产品勾选条（超过 6 个折叠，点"展开全部"再看全部）=====
  var pillArr = scope.map(function(p){
    var on = state.tableIds.indexOf(p.id) >= 0;
    return '<div class="sel-pill' + (on ? ' on' : '') + '" data-sel="' + esc(p.id) + '">' +
            (on ? '✓ ' : '') + esc(p.name) + '</div>';
  });
  var needFold = pillArr.length > 6;
  fb += '<div class="sel-bar"><div class="sel-head">' +
          '<span class="sel-t">勾选要对比的产品</span>' +
          '<span class="sel-n">' + (state.tableIds.length ? '已选 ' + state.tableIds.length + ' 个' : '未勾选＝全部 ' + scope.length + ' 个') + '</span>' +
          (state.tableIds.length ? '<span class="sel-clear" id="sel-clear">清空</span>' : '') +
        '</div><div class="sel-pills' + (needFold ? ' collapsed' : '') + '">' +
          pillArr.join('') +
        '</div>' +
        (needFold ? '<div class="sel-more" id="sel-more">展开全部 ' + pillArr.length + ' 个 ▾</div>' : '') +
        '</div>';

  // 勾选过滤：勾了哪些就只对比哪些
  var list = scope.filter(function(p){
    return state.tableIds.length === 0 || state.tableIds.indexOf(p.id) >= 0;
  });
  if (list.length === 0) {
    box.innerHTML = fb + '<div class="empty"><p>勾选的产品都不在当前类型里</p><div class="hint">点上面的「清空」恢复全部</div></div>';
    bindTypeChips(box, 'tableType', renderTable);
    bindCoTierChips(box);
    bindSelPills(box);
    return;
  }

  // 字段：全部类型统一显示（不同字段用「—」）
  var isMixed = state.tableType === 'all';
  var fields;
  if (isMixed) {
    // 混合模式：用所有出现过的字段并集，按通用优先排序
    var kmap = {}, ordered = [];
    list.forEach(function(p){
      getFields(p.type).forEach(function(fd){
        var k = fd.key;
        if (!kmap[k]) { kmap[k] = fd; ordered.push(k); }
      });
    });
    fields = ordered.map(function(k){ return kmap[k]; });
  } else {
    fields = getFields(state.tableType);
  }
  // 只显示至少一个产品填过的字段
  fields = fields.filter(function(fd){
    return list.some(function(p){
      var ff = p.fields || {};
      return !valueEmpty(ff[fd.key]);
    });
  });

  // 智能评估这一组产品
  var evalRes = evaluateGroup(list);
  var ranked = list.slice().sort(function(a,b){
    return (evalRes[b.id].score || 0) - (evalRes[a.id].score || 0);
  });
  var topId = ranked.length && evalRes[ranked[0].id].score > 0 ? ranked[0].id : null;

  // ===== 优势榜 =====
  var h = fb + '<div class="verdict">';
  h += '<div class="verdict-head"><span class="vt">🏆 智能评估</span><span class="vs">按条款内容自动判断，不是只看数字</span></div>';
  ranked.forEach(function(p, ri){
    var e = evalRes[p.id] || { win:0, lose:0, prosTop:[], consTop:[], winRate:0, score:0 };
    var rankCls = ri === 0 ? 'r1' : (ri === 1 ? 'r2' : (ri === 2 ? 'r3' : 'rn'));
    var medal = ri === 0 ? '①' : (ri === 1 ? '②' : (ri === 2 ? '③' : (ri+1)));
    h += '<div class="vcard ' + rankCls + (p.id === topId ? ' is-top' : '') + '" data-vp="' + esc(p.id) + '">';
    h += '<div class="vcard-top">' +
           '<div class="vrank">' + medal + '</div>' +
           '<div class="vname">' + esc(p.name) + (p.id === topId ? '<span class="crown">综合最优</span>' : '') + '</div>' +
           '<div class="vscore"><b>' + e.win + '</b><span>优</span>' + (e.lose ? '<i>' + e.lose + '劣</i>' : '') + '</div>' +
         '</div>';
    // 优势条
    var barW = Math.min(100, Math.max(4, e.winRate));
    h += '<div class="vbar"><div class="vbar-in" style="width:' + barW + '%"></div><span class="vbar-t">优势率 ' + e.winRate + '%</span></div>';
    // 亮点
    if (e.prosTop && e.prosTop.length) {
      h += '<div class="vpros">';
      e.prosTop.slice(0, 4).forEach(function(x){
        h += '<span class="vtag good">✓ ' + esc(x.label) + '：' + esc(x.reason) + '</span>';
      });
      h += '</div>';
    }
    if (e.consTop && e.consTop.length && (p.id === topId || e.win <= e.lose)) {
      h += '<div class="vpros">';
      e.consTop.slice(0, 2).forEach(function(x){
        h += '<span class="vtag bad">· ' + esc(x.label) + '：' + esc(x.reason) + '</span>';
      });
      h += '</div>';
    }
    if (!e.prosTop || !e.prosTop.length) {
      h += '<div class="vpros"><span class="vtag neutral">填写更多条款后会自动给出亮点</span></div>';
    }
    h += '</div>';
  });
  h += '</div>';

  // 表头
  h += '<div class="cmp-wrap"><div class="cmp-scroll"><table class="cmp-table"><thead><tr><th style="min-width:76px;max-width:88px">产品名称 <span style="color:#c0c5cc">→</span></th>';
  list.forEach(function(p){
    var t = TYPES[p.type] || TYPES.qt;
    h += '<th data-p="' + esc(p.id) + '" style="cursor:pointer"' + (p.id === topId ? ' class="top-col"' : '') + '>' + esc(p.name) + '<span class="hsub">' + esc((p.fields||{}).company || t.short) + '</span></th>';
  });
  h += '</tr></thead><tbody>';

  // 表体（按大组分段：一、投保规则 / 二、必选责任 / …）
  var lastGroup = null;
  fields.forEach(function(fd){
    var g = fd.group || '其他';
    if (g !== lastGroup) {
      // 统计该组内已填字段数
      var cnt = 0;
      fields.forEach(function(x){ if ((x.group||'其他') === g) cnt++; });
      h += '<tr class="group-row"><th colspan="' + (list.length + 1) + '">' + esc(g) + '<span class="gcnt">' + cnt + ' 项</span></th></tr>';
      lastGroup = g;
    }
    var vals = list.map(function(p){
      return valueToText((p.fields||{})[fd.key]);
    });
    // 差异判断：值不全相同
    var filledVals = vals.filter(function(v){ return v !== ''; });
    var isDiff = new Set(filledVals).size > 1;

    // 用语义引擎判断本行谁优谁劣
    var rowJudge = judgeField(fd, list.map(function(p, i){ return { id: p.id, txt: vals[i] }; }));

  h += '<tr><th>' + esc(fd.label) + '</th>';
  vals.forEach(function(v, i){
    var raw = (list[i].fields || {})[fd.key];
    var j = rowJudge[list[i].id] || { level:0, reason:'' };
    var cls = '';
    if (isDiff) cls = 'diff';
    if (j.level > 0) cls += ' adv';
    else if (j.level < 0) cls += ' dis';
    var show = v === '' ? '<span style="color:#c0c5cc">—</span>' : cellHtml(raw);
    var tag = j.level > 0 ? '<span class="adv-mark" title="' + esc(j.reason) + '">优</span>'
            : (j.level < 0 ? '<span class="dis-mark">弱</span>' : '');
    // 优势理由：仅在该行唯一优势时显示，避免刷屏
    var advCount = Object.keys(rowJudge).filter(function(k){ return rowJudge[k].level > 0; }).length;
    var reason = (j.level > 0 && advCount === 1 && j.reason) ? '<span class="adv-reason">' + esc(j.reason) + '</span>' : '';
    h += '<td class="' + cls + '" data-p="' + esc(list[i].id) + '" data-k="' + esc(fd.key) + '">' + show + tag + reason + '</td>';
  });
  h += '</tr>';
});

  h += '</tbody></table></div>';
  h += '<div class="cmp-note">🟢 优＝该项条款更有利　🔴 弱＝相对不利　淡黄＝各产品有差异<br>✏️ 点击任意单元格可直接修改；点产品名进完整编辑页。</div>';
  h += '</div>';

  box.innerHTML = h;
  bindTypeChips(box, 'tableType', renderTable);
  bindCoTierChips(box);
  bindSelPills(box);
  initFreezeFix(box.querySelector('.cmp-scroll'));
  bindCellEdit(box, 'table');
}

/* 产品勾选条：点 pill 切换勾选，点清空恢复全部 */
function bindSelPills(box) {

        toast('已按勾选过滤，再点几个一起对比');
      }
    }
    renderTable();
  });
}

/* iOS Safari 上表格内 sticky 偶发失效的兜底：
   首次滚动时实测左上角有没有钉住；若失效，改用 transform 补偿把表头/左列/角落拉回原位 */
function initFreezeFix(scroller) {
  if (!scroller || scroller._freezeInit) return;
  scroller._freezeInit = true;
  scroller._freezeMode = '';
  scroller.addEventListener('scroll', function(){
    var sl = scroller.scrollLeft, st = scroller.scrollTop;
    var table = scroller.querySelector('.cmp-table');
    if (!table) return;
    if (!scroller._freezeMode) {
      if (sl < 6 && st < 6) return;
      var corner = table.querySelector('thead th:first-child');
      if (corner) {
        var c = corner.getBoundingClientRect(), b = scroller.getBoundingClientRect();
        scroller._freezeMode = (Math.abs(c.left - b.left) < 3 && Math.abs(c.top - b.top) < 3) ? 'native' : 'js';
      } else {
        scroller._freezeMode = 'native';
      }
      if (scroller._freezeMode === 'native') return;
    }
    if (scroller._freezeMode !== 'js') return;
    var ths = table.querySelectorAll('thead th');
    for (var i = 0; i < ths.length; i++) {
      ths[i].style.transform = (i === 0) ? 'translate(' + sl + 'px,' + st + 'px)' : 'translateY(' + st + 'px)';
    }
    var rths = table.querySelectorAll('tbody th');
    for (var j = 0; j < rths.length; j++) {
      rths[j].style.transform = 'translateX(' + sl + 'px)';
    }
  }, { passive: true });
}

function openCellEditor(pid, key, view) {
  var p = getProduct(pid);
  if (!p) return;
  var fd = findField(p.type, key);
  var label = fd ? fd.label : key;
  var isMulti = !!(fd && fd.multi);
  var cur = valueToText((p.fields || {})[key]);
  var m = document.getElementById('cell-modal');
  if (!m) {
    m = document.createElement('div');
    m.className = 'modal';
    m.id = 'cell-modal';
    document.body.appendChild(m);
  }

  // 多条字段：一行一个框 + ＋增加一条（与产品编辑页一致）
  var bodyHtml;
  if (isMulti) {
    var lines = Array.isArray((p.fields||{})[key]) ? (p.fields||{})[key].slice()
              : (cur ? [cur] : ['']);
    if (!lines.length) lines = [''];
    bodyHtml = '<div id="ce-multi">';
    lines.forEach(function(ln, li){
      bodyHtml += '<div class="ce-mrow">' +
        '<textarea class="finput ce-line" rows="2" style="width:100%;font-size:14px" placeholder="' + esc(li === 0 ? (fd.note || '填写一条描述…') : '再填一条…') + '">' + esc(ln) + '</textarea>' +
        (lines.length > 1 ? '<div class="ce-mdel" data-i="' + li + '">✕</div>' : '') +
      '</div>';
    });
    bodyHtml += '<div id="ce-add" style="font-size:13px;color:#2f6fed;font-weight:600;padding:10px 2px;cursor:pointer;text-align:center;background:#f5f8ff;border-radius:8px;margin-top:6px">＋ 增加一条</div></div>' +
      '<div style="font-size:11.5px;color:#9aa1ab;margin-top:7px;line-height:1.5">每行一条描述，保存后同步到产品库和所有对比视图。</div>';
  } else {
    bodyHtml = '<textarea id="ce-input" class="finput" rows="7" style="width:100%;font-size:14px" placeholder="输入内容…"></textarea>' +
      '<div style="font-size:11.5px;color:#9aa1ab;margin-top:7px;line-height:1.5">保存后自动同步到产品库和所有对比视图。</div>';
  }

  m.innerHTML = '<div class="modal-box">' +
    '<div class="modal-head"><div class="mt">✏️ ' + esc(label) + '<span style="font-weight:400;color:#8a919b;font-size:12px;margin-left:6px">' + esc(p.name) + '</span></div><div class="mc" id="ce-cancel">取消</div></div>' +
    '<div class="modal-body" style="padding:14px 16px">' + bodyHtml + '</div>' +
    '<div class="modal-foot"><button class="btn btn-primary" id="ce-save" style="width:100%">保存</button></div>' +
  '</div>';
  m.classList.add('show');

  var close = function(){ m.classList.remove('show'); };
  m.querySelector('#ce-cancel').addEventListener('click', close);
  m.addEventListener('click', function(e){ if (e.target === m) close(); });

  var collect;
  if (isMulti) {
    var wrap = m.querySelector('#ce-multi');
    // ＋增加一条 / ✕ 删除（事件委托，重复渲染不叠加监听）
    wrap.addEventListener('click', function(ev){
      if (ev.target.id === 'ce-add') {
        var row = document.createElement('div');
        row.className = 'ce-mrow';
        row.innerHTML = '<textarea class="finput ce-line" rows="2" style="width:100%;font-size:14px" placeholder="再填一条…"></textarea>' +
          '<div class="ce-mdel">✕</div>';
        wrap.insertBefore(row, wrap.querySelector('#ce-add'));
        row.querySelector('textarea').focus();
        refreshDelBtns();
      } else if (ev.target.classList.contains('ce-mdel')) {
        var rows = wrap.querySelectorAll('.ce-mrow');
        if (rows.length > 1) ev.target.closest('.ce-mrow').remove();
        else { var t = wrap.querySelector('.ce-line'); if (t) { t.value = ''; t.focus(); } }
        refreshDelBtns();
      }
    });
    function refreshDelBtns(){
      var rows = wrap.querySelectorAll('.ce-mrow');
      rows.forEach(function(r, i){
        var d = r.querySelector('.ce-mdel');
        if (d) d.style.display = rows.length > 1 ? '' : 'none';
      });
    }
    collect = function(){
      var arr = [];
      wrap.querySelectorAll('.ce-line').forEach(function(t){
        var v = t.value.trim();
        if (v !== '') arr.push(v);
      });
      return arr;
    };
    var first = wrap.querySelector('.ce-line');
    setTimeout(function(){ if (first) first.focus(); }, 250);
  } else {
    var input = m.querySelector('#ce-input');
    input.value = cur;
    setTimeout(function(){ input.focus(); }, 250);
    collect = function(){ return input.value; };
  }

  m.querySelector('#ce-save').addEventListener('click', function(){
    var got = collect();
    if (isMulti) {
      if (got.length) p.fields[key] = got; else delete p.fields[key];
    } else {
      var v = String(got).trim();
      if (v !== '') p.fields[key] = v; else delete p.fields[key];
    }
    p.updatedAt = Date.now();
    saveData(appData);
    close();
    rerenderCompareView(view);
    toast('已保存并同步到产品');
  });
}

/* ============================================================
   视图二：两两对比
   ============================================================ */
function renderDuo() {
  var box = document.getElementById('page-duo');
  var ps = appData.products;
  if (ps.length < 2) {
    box.innerHTML = '<div class="empty"><p>至少需要两个产品</p><div class="hint">两两对比是拿两个产品逐条对照<br>先去添加第二个产品吧</div></div>';
    return;
  }
  // 默认选前两个
  if (!state.duoA || !getProduct(state.duoA)) state.duoA = ps[0].id;
  if (!state.duoB || !getProduct(state.duoB)) state.duoB = ps[1] ? ps[1].id : ps[0].id;
  if (state.duoA === state.duoB && ps.length > 1) {
    state.duoB = ps.filter(function(x){ return x.id !== state.duoA; })[0].id;
  }

  var A = getProduct(state.duoA), B = getProduct(state.duoB);

  function optHtml(sel) {
    return ps.map(function(p){
      var t = TYPES[p.type] || TYPES.qt;
      return '<option value="' + p.id + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.name) + '（' + t.short + '）</option>';
    }).join('');
  }

  var h = '<div class="duo-select">' +
    '<select id="duo-a">' + optHtml(state.duoA) + '</select>' +
    '<select id="duo-b">' + optHtml(state.duoB) + '</select>' +
  '</div>';

  // 顶部胜负小结
  var duoEval = evaluateGroup([A, B]);
  var ea = duoEval[A.id] || { win:0, lose:0, prosTop:[], consTop:[] };
  var eb = duoEval[B.id] || { win:0, lose:0, prosTop:[], consTop:[] };
  var leadA = ea.win - eb.win;
  var leadTxt = leadA > 0 ? ('A「' + A.name + '」领先 ' + leadA + ' 项')
              : (leadA < 0 ? ('B「' + B.name + '」领先 ' + (-leadA) + ' 项') : '两者各有优势，不相上下');
  h += '<div class="duo-summary">' +
    '<div class="ds-title">📊 ' + esc(leadTxt) + '</div>' +
    '<div class="ds-cols">' +
      '<div class="ds-col"><span class="ds-who">A</span>' + esc(A.name) +
        '<div class="ds-num"><b>' + ea.win + '</b> 项优势 / ' + ea.lose + ' 项劣势</div>' +
        (ea.prosTop[0] ? '<div class="ds-hl">✓ ' + esc(ea.prosTop[0].label) + '</div>' : '') + '</div>' +
      '<div class="ds-col"><span class="ds-who">B</span>' + esc(B.name) +
        '<div class="ds-num"><b>' + eb.win + '</b> 项优势 / ' + eb.lose + ' 项劣势</div>' +
        (eb.prosTop[0] ? '<div class="ds-hl">✓ ' + esc(eb.prosTop[0].label) + '</div>' : '') + '</div>' +
    '</div>' +
  '</div>';

  // 字段并集（A 与 B 类型可能不同）
  var kmap = {}, ordered = [];
  [A, B].forEach(function(p){
    getFields(p.type).forEach(function(fd){
      if (!kmap[fd.key]) { kmap[fd.key] = fd; ordered.push(fd.key); }
    });
  });
  var fields = ordered.map(function(k){ return kmap[k]; }).filter(function(fd){
    return !valueEmpty((A.fields||{})[fd.key]) || !valueEmpty((B.fields||{})[fd.key]);
  });

  // 差异统计
  var diffCount = 0;
  h += '<div class="duo-list">';
  var lastDuoGroup = null;
  fields.forEach(function(fd){
    // 分组标题（一、投保规则 / 二、必选责任 / …）
    var dg = fd.group || '其他';
    if (dg !== lastDuoGroup) {
      h += '<div class="duo-group">' + esc(dg) + '</div>';
      lastDuoGroup = dg;
    }
    var va = (A.fields||{})[fd.key], vb = (B.fields||{})[fd.key];
    var sa = valueToText(va);
    var sb = valueToText(vb);
    var same = sa === sb;

    // 优劣判断：走语义引擎
    var onlyA = false, onlyB = false;
    if (sa !== '' && sb === '') { onlyA = true; diffCount++; }
    else if (sb !== '' && sa === '') { onlyB = true; diffCount++; }
    else if (!same) diffCount++;

    var dj = judgeField(fd, [{ id: A.id, txt: sa }, { id: B.id, txt: sb }]);
    var ja = dj[A.id] || { level:0, reason:'' }, jb = dj[B.id] || { level:0, reason:'' };
    var winA = ja.level > 0, winB = jb.level > 0;

    var cA = 'duo-cell' + (winA ? ' win' : (winB ? ' lose' : (same ? ' same' : '')));
    var cB = 'duo-cell' + (winB ? ' win' : (winA ? ' lose' : (same ? ' same' : '')));
    var tagA = winA ? '<span class="adv-mark">优</span>' : (jb.level > 0 ? '<span class="dis-mark">弱</span>' : '');
    var tagB = winB ? '<span class="adv-mark">优</span>' : (ja.level > 0 ? '<span class="dis-mark">弱</span>' : '');
    var rsA = (winA && ja.reason) ? '<span class="adv-reason">' + esc(ja.reason) + '</span>' : '';
    var rsB = (winB && jb.reason) ? '<span class="adv-reason">' + esc(jb.reason) + '</span>' : '';

    var rowDiff = (!same) || onlyA || onlyB;
    h += '<div class="duo-row' + (rowDiff ? ' has-diff' : '') + '">' +
      '<div class="duo-label">' + esc(fd.label) + (rowDiff ? '<span class="diff-tag">异</span>' : '') + '</div>' +
      '<div class="duo-cells">' +
        '<div class="' + cA + '" data-p="' + esc(A.id) + '" data-k="' + esc(fd.key) + '">' + (sa === '' ? '<span style="color:#c0c5cc">未填（点这里填写）</span>' : cellHtml(va)) + (onlyA ? '<span class="duo-only">仅A</span>' : '') + tagA + rsA + '</div>' +
        '<div class="' + cB + '" data-p="' + esc(B.id) + '" data-k="' + esc(fd.key) + '">' + (sb === '' ? '<span style="color:#c0c5cc">未填（点这里填写）</span>' : cellHtml(vb)) + (onlyB ? '<span class="duo-only">仅B</span>' : '') + tagB + rsB + '</div>' +
      '</div>' +
    '</div>';
  });
  h += '</div>';
  h += '<div class="cmp-note">共 ' + fields.length + ' 项可比字段，其中 ' + diffCount + ' 项存在差异。<br>绿色＝该项更优；✏️ 点击任意格子可直接修改并保存。</div>';

  box.innerHTML = h;

  document.getElementById('duo-a').addEventListener('change', function(){
    state.duoA = this.value;
    renderDuo();
  });
  document.getElementById('duo-b').addEventListener('change', function(){
    state.duoB = this.value;
    renderDuo();
  });
  bindCellEdit(box, 'duo');
}

/* ============================================================
   视图三：打分排序
   ============================================================ */
function renderScore() {
  var box = document.getElementById('page-score');
  var ps = appData.products;
  if (ps.length === 0) {
    box.innerHTML = '<div class="empty"><p>还没有产品</p><div class="hint">添加产品并填写数值型字段后<br>这里会自动算出综合分排名</div></div>';
    return;
  }

  // 类型筛选
  var counts = {};
  ps.forEach(function(p){ counts[p.type] = (counts[p.type]||0)+1; });
  var usedTypes = Object.keys(counts);
  if (state.scoreType && state.scoreType !== 'all' && !counts[state.scoreType]) state.scoreType = 'all';
  if (!state.scoreType) state.scoreType = 'all';

  var fb = '<div class="filter-bar">';
  fb += '<div class="chip' + (state.scoreType==='all'?' active':'') + '" data-t="all">全部</div>';
  usedTypes.forEach(function(t){
    fb += '<div class="chip' + (state.scoreType===t?' active':'') + '" data-t="' + t + '">' + TYPES[t].icon + ' ' + TYPES[t].short + '</div>';
  });
  fb += '</div>';

  var list = ps.filter(function(p){ return state.scoreType === 'all' || p.type === state.scoreType; });
  // 打分字段（取列表里第一个产品的类型作为权重调节对象；混合模式取所有类型并集）
  var scoreTypes = state.scoreType === 'all'
    ? Array.from(new Set(list.map(function(p){ return p.type; })))
    : [state.scoreType];

  var scoreFields = [];
  var sseen = {};
  scoreTypes.forEach(function(t){
    getFields(t).filter(function(f){ return f.score && f.better; }).forEach(function(f){
      if (!sseen[f.key]) { sseen[f.key] = { f:f, types:[t] }; scoreFields.push(sseen[f.key]); }
      else if (sseen[f.key].types.indexOf(t) < 0) sseen[f.key].types.push(t);
    });
  });

  var h = fb + '<div class="score-head">';

  // 权重调节
  if (scoreFields.length > 0) {
    h += '<div class="score-weights"><div class="sw-title">权重设置（0＝不参与，5＝最重要）</div>';
    scoreFields.forEach(function(o){
      var f = o.f;
      var w = getWeight(o.types[0], f.key);
      h += '<div class="sw-row">' +
        '<div class="sw-name">' + esc(f.label) + '</div>' +
        '<input type="range" class="sw-slider" min="0" max="5" step="1" value="' + w + '" data-k="' + f.key + '" data-t="' + o.types[0] + '">' +
        '<div class="sw-val">' + w + '</div>' +
      '</div>';
    });
    h += '</div>';
  }

  // 排名
  var ranked = list.map(function(p){ return { p:p, s: calcScore(p) }; })
    .filter(function(o){ return o.s !== null; })
    .sort(function(a,b){ return b.s - a.s; });

  if (ranked.length === 0) {
    h += '<div class="empty" style="padding:30px 20px"><p>还没有足够的数值字段</p><div class="hint">填写「保费」「保额」等数字字段后<br>就能算出综合分排名</div></div>';
  } else {
    // 各类型颜色
    var colors = ['#2f6fed','#137333','#e8710a','#8430ce','#d93025','#0b8043'];
    ranked.forEach(function(o, i){
      var p = o.p;
      var t = TYPES[p.type] || TYPES.qt;
      var sc = o.s;
      // 分项条
      var bars = '';
      var wsum = 0, ws = [];
      scoreFields.forEach(function(oo){
        var f = oo.f;
        var w = getWeight(oo.types[0], f.key);
        if (w <= 0) return;
        var v = extractNum((p.fields||{})[f.key]);
        if (v === null) return;
        var peers = ps.filter(function(x){ return x.type === p.type; });
        var vals = peers.map(function(x){ return extractNum((x.fields||{})[f.key]); }).filter(function(x){ return x !== null; });
        if (vals.length < 2) return;
        var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
        var r = (mx===mn) ? 1 : (v-mn)/(mx-mn);
        if (f.better === 'low') r = 1-r;
        ws.push({ r:r, w:w });
        wsum += w;
      });
      for (var bi=0; bi<ws.length; bi++){
        bars += '<div class="rank-bar" style="width:' + (ws[bi].w/wsum*100).toFixed(1) + '%;background:' + colors[bi%colors.length] + ';opacity:' + (0.35 + ws[bi].r*0.65).toFixed(2) + '"></div>';
      }

      h += '<div class="rank-item">' +
        '<div class="rank-no">' + (i+1) + '</div>' +
        '<div class="rank-body">' +
          '<div class="rank-name">' + esc(p.name) + '</div>' +
          '<div class="rank-sub">' + t.icon + ' ' + t.short + (p.fields && p.fields.company ? ' · ' + esc(p.fields.company) : '') + '</div>' +
          (bars ? '<div class="rank-bars">' + bars + '</div>' : '') +
        '</div>' +
        '<div class="rank-score">' + sc.toFixed(1) + '</div>' +
      '</div>';
    });
    h += '<div class="cmp-note">综合分 = 各字段在同类型产品中归一化后，按你设的权重加权平均（满分 100）。<br>分数只反映你关心的这几个数值字段，不替代条款阅读。</div>';
  }
  h += '</div>';

  box.innerHTML = h;

  bindTypeChips(box, 'scoreType', renderScore);

  // 权重滑块
  box.querySelectorAll('.sw-slider').forEach(function(el){
    el.addEventListener('input', function(){
      this.parentNode.querySelector('.sw-val').textContent = this.value;
    });
    el.addEventListener('change', function(){
      setWeight(this.dataset.t, this.dataset.k, parseInt(this.value, 10));
      renderScore();
    });
  });
}
